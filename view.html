<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WebView Pro — Mobile & Desktop Preview</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0a0f;
    --surface: #111118;
    --card: #16161f;
    --border: #2a2a3a;
    --accent: #00ff88;
    --accent2: #7c3aed;
    --text: #e8e8f0;
    --muted: #666680;
    --glow: 0 0 30px rgba(0,255,136,0.15);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Syne', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* Ambient background */
  body::before {
    content: '';
    position: fixed;
    top: -50%;
    left: -50%;
    width: 200%;
    height: 200%;
    background: radial-gradient(ellipse at 20% 20%, rgba(124,58,237,0.06) 0%, transparent 50%),
                radial-gradient(ellipse at 80% 80%, rgba(0,255,136,0.04) 0%, transparent 50%);
    pointer-events: none;
    z-index: 0;
  }

  .app-wrapper {
    position: relative;
    z-index: 1;
    display: flex;
    flex-direction: column;
    height: 100vh;
  }

  /* ── Header ── */
  header {
    display: flex;
    align-items: center;
    gap: 16px;
    padding: 14px 24px;
    background: rgba(17,17,24,0.9);
    backdrop-filter: blur(20px);
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
  }

  .logo {
    font-size: 18px;
    font-weight: 800;
    letter-spacing: -0.5px;
    color: var(--accent);
  }
  .logo span { color: var(--text); }

  .url-bar {
    flex: 1;
    display: flex;
    align-items: center;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 0 14px;
    gap: 10px;
    transition: border-color 0.2s, box-shadow 0.2s;
  }
  .url-bar:focus-within {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(0,255,136,0.1);
  }

  .url-icon { color: var(--muted); font-size: 13px; }

  .url-input {
    flex: 1;
    background: none;
    border: none;
    outline: none;
    color: var(--text);
    font-family: 'DM Mono', monospace;
    font-size: 13px;
    padding: 10px 0;
  }
  .url-input::placeholder { color: var(--muted); }

  .btn-go {
    background: var(--accent);
    color: #000;
    border: none;
    border-radius: 7px;
    padding: 7px 18px;
    font-family: 'Syne', sans-serif;
    font-weight: 700;
    font-size: 13px;
    cursor: pointer;
    transition: transform 0.15s, box-shadow 0.2s;
    white-space: nowrap;
  }
  .btn-go:hover {
    transform: translateY(-1px);
    box-shadow: 0 4px 20px rgba(0,255,136,0.4);
  }
  .btn-go:active { transform: translateY(0); }

  /* ── Tab Toggle ── */
  .view-tabs {
    display: flex;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 3px;
    gap: 3px;
    flex-shrink: 0;
  }

  .tab-btn {
    background: none;
    border: none;
    color: var(--muted);
    padding: 7px 16px;
    border-radius: 7px;
    cursor: pointer;
    font-family: 'Syne', sans-serif;
    font-weight: 600;
    font-size: 12px;
    display: flex;
    align-items: center;
    gap: 6px;
    transition: all 0.2s;
    white-space: nowrap;
  }
  .tab-btn.active {
    background: var(--accent);
    color: #000;
  }
  .tab-btn:not(.active):hover {
    color: var(--text);
    background: var(--border);
  }

  /* ── Main Stage ── */
  .stage {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 32px 24px;
    overflow: hidden;
    position: relative;
  }

  /* Grid background */
  .stage::before {
    content: '';
    position: absolute;
    inset: 0;
    background-image:
      linear-gradient(rgba(42,42,58,0.3) 1px, transparent 1px),
      linear-gradient(90deg, rgba(42,42,58,0.3) 1px, transparent 1px);
    background-size: 40px 40px;
    pointer-events: none;
  }

  /* ── MOBILE MOCKUP ── */
  .mockup-container {
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    animation: fadeIn 0.4s ease;
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(12px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .phone-frame {
    position: relative;
    width: 320px;
    background: #0d0d0d;
    border-radius: 44px;
    padding: 14px;
    box-shadow:
      0 0 0 2px #333,
      0 0 0 3px #111,
      0 40px 80px rgba(0,0,0,0.8),
      var(--glow);
  }

  /* Side buttons */
  .phone-frame::before {
    content: '';
    position: absolute;
    left: -4px;
    top: 110px;
    width: 4px;
    height: 36px;
    background: #222;
    border-radius: 3px 0 0 3px;
    box-shadow: 0 48px 0 #222, 0 96px 0 #222;
  }
  .phone-frame::after {
    content: '';
    position: absolute;
    right: -4px;
    top: 160px;
    width: 4px;
    height: 56px;
    background: #222;
    border-radius: 0 3px 3px 0;
  }

  .phone-screen-wrap {
    background: #000;
    border-radius: 32px;
    overflow: hidden;
    position: relative;
  }

  /* Notch */
  .phone-notch {
    position: absolute;
    top: 14px;
    left: 50%;
    transform: translateX(-50%);
    width: 100px;
    height: 28px;
    background: #0d0d0d;
    border-radius: 20px;
    z-index: 10;
  }

  .phone-iframe-wrap {
    width: 100%;
    height: 560px;
    position: relative;
    overflow: hidden;
  }

  /* ── DESKTOP MOCKUP ── */
  .desktop-mockup {
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  .monitor-frame {
    background: #1a1a1f;
    border-radius: 12px;
    padding: 10px;
    box-shadow:
      0 0 0 2px #333,
      0 0 0 3px #111,
      0 40px 100px rgba(0,0,0,0.9),
      var(--glow);
    position: relative;
  }

  .monitor-bezel {
    background: #111;
    border-radius: 6px;
    padding: 4px 4px 8px;
  }

  /* Monitor top bar with buttons */
  .monitor-topbar {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 6px 10px;
    background: #1a1a1f;
    border-radius: 4px 4px 0 0;
  }
  .dot { width: 10px; height: 10px; border-radius: 50%; }
  .dot.red { background: #ff5f57; }
  .dot.yellow { background: #febc2e; }
  .dot.green { background: #28c840; }

  .monitor-address {
    flex: 1;
    background: #0d0d0d;
    border-radius: 4px;
    padding: 3px 10px;
    font-family: 'DM Mono', monospace;
    font-size: 10px;
    color: var(--muted);
    margin: 0 8px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .monitor-screen {
    width: 760px;
    height: 480px;
    background: #000;
    overflow: hidden;
    position: relative;
    border-radius: 0 0 4px 4px;
  }

  /* Stand */
  .monitor-stand {
    width: 120px;
    height: 28px;
    background: linear-gradient(to bottom, #1a1a1f, #111);
    clip-path: polygon(20% 0%, 80% 0%, 90% 100%, 10% 100%);
  }
  .monitor-base {
    width: 220px;
    height: 10px;
    background: #1a1a1f;
    border-radius: 6px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.5);
  }

  /* ── iFrame shared styles ── */
  .preview-iframe {
    width: 100%;
    height: 100%;
    border: none;
    display: block;
  }

  /* Mobile iframe — scaled for desktop viewport */
  .phone-iframe-wrap .preview-iframe {
    width: 390px;
    height: 844px;
    transform-origin: top left;
    transform: scale(0.748);
    pointer-events: auto;
    cursor: none;
  }

  /* Desktop iframe */
  .monitor-screen .preview-iframe {
    width: 1440px;
    height: 900px;
    transform-origin: top left;
    transform: scale(0.528);
    pointer-events: auto;
    cursor: none;
  }

  /* ── Custom cursor ── */
  .custom-cursor {
    position: fixed;
    pointer-events: none;
    z-index: 9999;
    transition: transform 0.1s ease;
  }

  .cursor-dot {
    width: 8px;
    height: 8px;
    background: var(--accent);
    border-radius: 50%;
    position: absolute;
    top: 0; left: 0;
    transform: translate(-50%, -50%);
    box-shadow: 0 0 10px var(--accent);
  }

  .cursor-ring {
    width: 28px;
    height: 28px;
    border: 1.5px solid rgba(0,255,136,0.5);
    border-radius: 50%;
    position: absolute;
    top: 0; left: 0;
    transform: translate(-50%, -50%);
    transition: width 0.2s, height 0.2s, border-color 0.2s;
  }

  .custom-cursor.clicking .cursor-ring {
    width: 20px;
    height: 20px;
    border-color: var(--accent);
  }

  /* Hide cursor over iframes */
  iframe { cursor: none; }

  /* ── Loading overlay ── */
  .loading-overlay {
    position: absolute;
    inset: 0;
    background: var(--bg);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 16px;
    z-index: 5;
    border-radius: inherit;
    transition: opacity 0.3s;
  }

  .loading-overlay.hidden {
    opacity: 0;
    pointer-events: none;
  }

  .spinner {
    width: 36px;
    height: 36px;
    border: 2px solid var(--border);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .loading-text {
    font-size: 12px;
    color: var(--muted);
    font-family: 'DM Mono', monospace;
  }

  /* ── Empty state ── */
  .empty-state {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 12px;
    color: var(--muted);
    border-radius: inherit;
  }

  .empty-icon {
    font-size: 40px;
    opacity: 0.3;
  }

  .empty-label {
    font-size: 13px;
    font-family: 'DM Mono', monospace;
    opacity: 0.5;
  }

  /* ── Status bar ── */
  .status-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 4px 16px;
    font-size: 10px;
    font-family: 'DM Mono', monospace;
    color: var(--muted);
    background: rgba(17,17,24,0.8);
    border-top: 1px solid var(--border);
    flex-shrink: 0;
  }

  .status-dot {
    width: 6px; height: 6px;
    border-radius: 50%;
    background: var(--border);
    display: inline-block;
    margin-right: 6px;
    transition: background 0.3s;
  }
  .status-dot.live { background: var(--accent); box-shadow: 0 0 6px var(--accent); }

  /* ── Responsive ── */
  @media (max-width: 900px) {
    .monitor-screen { width: 500px; height: 320px; }
    .monitor-screen .preview-iframe {
      transform: scale(0.347);
    }
    .phone-frame { width: 240px; }
    .phone-iframe-wrap { height: 420px; }
    .phone-iframe-wrap .preview-iframe {
      width: 390px; height: 844px;
      transform: scale(0.56);
    }
  }

  @media (max-width: 600px) {
    header { padding: 10px 12px; gap: 8px; }
    .logo { font-size: 14px; }
    .btn-go { padding: 7px 12px; font-size: 12px; }
    .tab-btn { padding: 6px 10px; font-size: 11px; }
    .stage { padding: 20px 12px; }
    .monitor-screen { width: 340px; height: 220px; }
    .monitor-screen .preview-iframe {
      transform: scale(0.236);
    }
    .monitor-stand { width: 80px; }
    .monitor-base { width: 160px; }
  }
</style>
</head>
<body>

<!-- Custom Cursor -->
<div class="custom-cursor" id="cursor">
  <div class="cursor-dot"></div>
  <div class="cursor-ring"></div>
</div>

<div class="app-wrapper">

  <!-- Header -->
  <header>
    <div class="logo">Web<span>View</span></div>

    <div class="url-bar">
      <span class="url-icon">🔗</span>
      <input class="url-input" id="urlInput" type="text"
        placeholder="https://example.com — ওয়েবসাইটের লিঙ্ক লিখুন..."
        value="" autocomplete="off" spellcheck="false" />
      <button class="btn-go" id="btnGo">লোড করুন ▶</button>
    </div>

    <div class="view-tabs">
      <button class="tab-btn active" id="tabMobile" onclick="switchView('mobile')">
        📱 মোবাইল
      </button>
      <button class="tab-btn" id="tabDesktop" onclick="switchView('desktop')">
        🖥️ ডেক্সটপ
      </button>
    </div>
  </header>

  <!-- Stage -->
  <div class="stage" id="stage">

    <!-- Mobile Mockup -->
    <div class="mockup-container" id="mobileMockup">
      <div class="phone-frame">
        <div class="phone-notch"></div>
        <div class="phone-screen-wrap">
          <div class="phone-iframe-wrap" id="mobileScreen">
            <div class="empty-state" id="mobileEmpty">
              <div class="empty-icon">📱</div>
              <div class="empty-label">মোবাইল ভিউ</div>
            </div>
            <div class="loading-overlay hidden" id="mobileLoading">
              <div class="spinner"></div>
              <div class="loading-text">লোড হচ্ছে...</div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Desktop Mockup -->
    <div class="mockup-container" id="desktopMockup" style="display:none; flex-direction:column; align-items:center; gap:0;">
      <div class="desktop-mockup">
        <div class="monitor-frame">
          <div class="monitor-bezel">
            <div class="monitor-topbar">
              <div class="dot red"></div>
              <div class="dot yellow"></div>
              <div class="dot green"></div>
              <div class="monitor-address" id="monitorAddress">about:blank</div>
            </div>
            <div class="monitor-screen" id="desktopScreen">
              <div class="empty-state" id="desktopEmpty">
                <div class="empty-icon">🖥️</div>
                <div class="empty-label">ডেক্সটপ ভিউ</div>
              </div>
              <div class="loading-overlay hidden" id="desktopLoading">
                <div class="spinner"></div>
                <div class="loading-text">লোড হচ্ছে...</div>
              </div>
            </div>
          </div>
        </div>
        <div class="monitor-stand"></div>
        <div class="monitor-base"></div>
      </div>
    </div>

  </div>

  <!-- Status Bar -->
  <div class="status-bar">
    <span><span class="status-dot" id="statusDot"></span><span id="statusText">প্রস্তুত — একটি URL লিখুন এবং লোড করুন</span></span>
    <span id="currentView">📱 মোবাইল ভিউ</span>
  </div>

</div>

<script>
  // ── Custom Cursor ──
  const cursor = document.getElementById('cursor');
  let mouseX = 0, mouseY = 0;

  document.addEventListener('mousemove', e => {
    mouseX = e.clientX;
    mouseY = e.clientY;
    cursor.style.left = mouseX + 'px';
    cursor.style.top = mouseY + 'px';
  });

  document.addEventListener('mousedown', () => cursor.classList.add('clicking'));
  document.addEventListener('mouseup', () => cursor.classList.remove('clicking'));

  // ── State ──
  let currentView = 'mobile';
  let currentUrl = '';

  // ── View Switcher ──
  function switchView(view) {
    currentView = view;
    document.getElementById('mobileMockup').style.display = view === 'mobile' ? 'flex' : 'none';
    document.getElementById('desktopMockup').style.display = view === 'desktop' ? 'flex' : 'none';
    document.getElementById('tabMobile').classList.toggle('active', view === 'mobile');
    document.getElementById('tabDesktop').classList.toggle('active', view === 'desktop');
    document.getElementById('currentView').textContent = view === 'mobile' ? '📱 মোবাইল ভিউ' : '🖥️ ডেক্সটপ ভিউ';

    // Reload in new view if URL exists
    if (currentUrl) loadUrl(currentUrl);
  }

  // ── URL Loader ──
  function loadUrl(rawUrl) {
    let url = rawUrl.trim();
    if (!url) return;
    if (!/^https?:\/\//i.test(url)) url = 'https://' + url;

    currentUrl = url;
    document.getElementById('urlInput').value = url;
    document.getElementById('monitorAddress').textContent = url;

    const screenId = currentView === 'mobile' ? 'mobileScreen' : 'desktopScreen';
    const emptyId = currentView === 'mobile' ? 'mobileEmpty' : 'desktopEmpty';
    const loadingId = currentView === 'mobile' ? 'mobileLoading' : 'desktopLoading';

    const screen = document.getElementById(screenId);
    const empty = document.getElementById(emptyId);
    const loading = document.getElementById(loadingId);

    // Remove existing iframe
    const oldIframe = screen.querySelector('iframe');
    if (oldIframe) oldIframe.remove();

    // Show loading
    empty.style.display = 'none';
    loading.classList.remove('hidden');

    setStatus('loading', 'লোড হচ্ছে — ' + url);

    // Create iframe
    const iframe = document.createElement('iframe');
    iframe.className = 'preview-iframe';
    iframe.sandbox = 'allow-scripts allow-same-origin allow-forms allow-popups allow-modals';
    iframe.referrerpolicy = 'no-referrer';

    iframe.onload = () => {
      loading.classList.add('hidden');
      setStatus('live', 'লোড সম্পন্ন — ' + url);
    };

    iframe.onerror = () => {
      loading.classList.add('hidden');
      setStatus('error', 'লোড ব্যর্থ হয়েছে');
    };

    iframe.src = url;
    screen.appendChild(iframe);

    // Fallback timeout
    setTimeout(() => {
      loading.classList.add('hidden');
    }, 8000);
  }

  function setStatus(state, text) {
    const dot = document.getElementById('statusDot');
    dot.className = 'status-dot' + (state === 'live' ? ' live' : '');
    document.getElementById('statusText').textContent = text;
  }

  // ── Event Listeners ──
  document.getElementById('btnGo').addEventListener('click', () => {
    loadUrl(document.getElementById('urlInput').value);
  });

  document.getElementById('urlInput').addEventListener('keydown', e => {
    if (e.key === 'Enter') loadUrl(e.target.value);
  });

  // Load example on start
  window.addEventListener('load', () => {
    document.getElementById('urlInput').value = 'https://example.com';
  });
</script>
</body>
</html>
