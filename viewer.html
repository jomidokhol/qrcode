<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GitShare | Viewer</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        body { background: #000000; color: #ffffff; margin: 0; font-family: 'Plus Jakarta Sans', sans-serif; display: flex; align-items: center; justify-content: center; min-height: 100vh; }
        #container { text-align: center; display: none; padding: 30px; width: 100%; max-width: 600px; }
        
        /* Preview Styling */
        .preview-box { width: 100%; border-radius: 20px; overflow: hidden; background: #111; border: 1px solid #222; margin-bottom: 20px; box-shadow: 0 20px 40px rgba(0,0,0,0.5); }
        video { width: 100%; display: block; }
        iframe { width: 100%; height: 500px; border: none; display: block; }
        img { width: 100%; display: block; height: auto; }

        .btn { background: #6366f1; color: white; border: none; padding: 16px; border-radius: 16px; font-weight: 700; cursor: pointer; text-decoration: none; display: flex; align-items: center; justify-content: center; gap: 10px; margin-top: 15px; }
        .empty-text { opacity: 0.2; font-size: 0.8rem; letter-spacing: 2px; }
    </style>
</head>
<body>

    <div id="empty" class="empty-text">SECURE VIEWER IDLE</div>

    <div id="container">
        <!-- Preview Container -->
        <div class="preview-box" id="previewBox"></div>
        
        <h2 id="vName" style="word-break: break-all; margin: 15px 0 5px 0; font-size: 1.2rem;">File Name</h2>
        <p id="vSize" style="opacity: 0.5; margin-bottom: 20px;">0.00 MB</p>
        
        <a id="vDownload" class="btn" download><i class="fas fa-download"></i> Download File</a>
        <p style="margin-top: 20px; font-size: 0.7rem; opacity: 0.3;">GitShare Pro - Encrypted Link</p>
    </div>

    <script>
        window.onload = () => {
            const params = new URLSearchParams(window.location.search);
            const encodedData = params.get('f');

            if (encodedData) {
                try {
                    const data = JSON.parse(atob(encodedData));
                    document.getElementById('empty').style.display = 'none';
                    document.getElementById('container').style.display = 'block';

                    document.getElementById('vName').innerText = data.n;
                    document.getElementById('vSize').innerText = data.s + " MB";
                    
                    const rawUrl = `https://raw.githubusercontent.com/jomidokhol/qrcode/main/${data.p}`;
                    document.getElementById('vDownload').href = rawUrl;

                    const previewBox = document.getElementById('previewBox');
                    const ext = data.n.split('.').pop().toLowerCase();

                    // Logic for Preview
                    if(['mp4', 'webm', 'ogg'].includes(ext)) {
                        previewBox.innerHTML = `<video controls><source src="${rawUrl}" type="video/${ext}">Your browser does not support the video tag.</video>`;
                    } 
                    else if(ext === 'pdf') {
                        previewBox.innerHTML = `<iframe src="${rawUrl}"></iframe>`;
                    } 
                    else if(['jpg', 'jpeg', 'png', 'gif', 'webp'].includes(ext)) {
                        previewBox.innerHTML = `<img src="${rawUrl}" alt="Preview">`;
                    } 
                    else {
                        previewBox.innerHTML = `<div style="padding: 40px; opacity: 0.5;"><i class="fas fa-file-alt" style="font-size: 3rem;"></i><br><br>Preview not available for this file type.</div>`;
                    }

                } catch (e) {
                    document.getElementById('empty').innerText = "LINK EXPIRED OR INVALID";
                }
            }
        };
    </script>
</body>
</html>
