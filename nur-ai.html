<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>আমার জেমিনি চ্যাটবট</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f7f6;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .chat-container {
            width: 100%;
            max-width: 500px;
            background: #fff;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            height: 80vh;
        }
        .chat-header {
            background: #4285f4;
            color: #fff;
            padding: 15px;
            text-align: center;
            font-size: 1.2em;
            font-weight: bold;
        }
        .chat-box {
            flex: 1;
            padding: 15px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .message {
            max-width: 80%;
            padding: 10px 15px;
            border-radius: 15px;
            line-height: 1.4;
            word-wrap: break-word;
        }
        .user-message {
            background: #e3f2fd;
            align-self: flex-end;
            border-bottom-right-radius: 0;
        }
        .bot-message {
            background: #f1f3f4;
            align-self: flex-start;
            border-bottom-left-radius: 0;
        }
        .input-area {
            display: flex;
            padding: 10px;
            background: #fff;
            border-top: 1px solid #ddd;
        }
        input[type="text"] {
            flex: 1;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
            outline: none;
        }
        button {
            background: #4285f4;
            color: white;
            border: none;
            padding: 10px 15px;
            margin-left: 10px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
        }
        button:hover {
            background: #3367d6;
        }
        .clear-btn {
            background: #ea4335;
            font-size: 0.8em;
            padding: 5px 10px;
            margin-top: 5px;
        }
    </style>
</head>
<body>

<div class="chat-container">
    <div class="chat-header">
        আমার এআই চ্যাটবট
        <br>
        <button class="clear-btn" onclick="clearChat()">চ্যাট হিস্ট্রি মুছুন</button>
    </div>
    <div class="chat-box" id="chat-box"></div>
    <div class="input-area">
        <input type="text" id="user-input" placeholder="কিছু লিখুন..." onkeypress="handleKeyPress(event)">
        <button onclick="sendMessage()">Send</button>
    </div>
</div>

<script>
    // এখানে আপনার API Key দিন
    const API_KEY = "AIzaSyBl_35HmgGEqJzxIBWp1d8f6qWJvEp9LHM"; 
    
    // Gemini 1.5 Flash মডেল ব্যবহার করা হচ্ছে (এটি ফ্রি এবং ফাস্ট)
    const API_URL = `https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${API_KEY}`;

    let chatHistory = [];

    // পেজ লোড হলে লোকাল স্টোরেজ থেকে চ্যাট হিস্ট্রি নিয়ে আসা
    window.onload = () => {
        const savedChat = localStorage.getItem('geminiChatHistory');
        if (savedChat) {
            chatHistory = JSON.parse(savedChat);
            chatHistory.forEach(msg => appendMessage(msg.role, msg.parts[0].text));
        } else {
            appendMessage("model", "হ্যালো! আমি আপনার অ্যাসিস্ট্যান্ট। আমি আপনাকে কীভাবে সাহায্য করতে পারি?");
        }
    };

    // মেসেজ স্ক্রিনে দেখানোর ফাংশন
    function appendMessage(role, text) {
        const chatBox = document.getElementById('chat-box');
        const messageDiv = document.createElement('div');
        messageDiv.classList.add('message');
        messageDiv.classList.add(role === 'user' ? 'user-message' : 'bot-message');
        
        // মার্কডাউন বা সিম্পল টেক্সট ঠিক করার জন্য
        messageDiv.innerText = text;
        
        chatBox.appendChild(messageDiv);
        chatBox.scrollTop = chatBox.scrollHeight; // স্ক্রল নিচে নিয়ে যাওয়া
    }

    // মেসেজ পাঠানোর ফাংশন
    async function sendMessage() {
        const inputField = document.getElementById('user-input');
        const text = inputField.value.trim();
        
        if (!text) return;

        // ইউজারের মেসেজ UI তে দেখানো
        appendMessage('user', text);
        inputField.value = '';

        // চ্যাট হিস্ট্রিতে সেভ করা
        chatHistory.push({ role: "user", parts: [{ text: text }] });
        saveChatLocally();

        // API কল করা
        try {
            const response = await fetch(API_URL, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ contents: chatHistory })
            });

            const data = await response.json();
            
            if (data.error) {
                throw new Error(data.error.message);
            }

            const botReply = data.candidates[0].content.parts[0].text;
            
            // বটের মেসেজ UI তে দেখানো
            appendMessage('model', botReply);
            
            // চ্যাট হিস্ট্রিতে বটের রিপ্লাই সেভ করা
            chatHistory.push({ role: "model", parts: [{ text: botReply }] });
            saveChatLocally();

        } catch (error) {
            console.error("Error:", error);
            appendMessage('model', "দুঃখিত, একটি সমস্যা হয়েছে! API Key ঠিক আছে কিনা চেক করুন।");
            // এরর হলে শেষ ইউজারের মেসেজটি হিস্ট্রি থেকে মুছে ফেলা ভালো
            chatHistory.pop(); 
        }
    }

    // এন্টার (Enter) বাটন চাপলে মেসেজ পাঠানো
    function handleKeyPress(event) {
        if (event.key === 'Enter') {
            sendMessage();
        }
    }

    // লোকাল স্টোরেজে সেভ করার ফাংশন
    function saveChatLocally() {
        localStorage.setItem('geminiChatHistory', JSON.stringify(chatHistory));
    }

    // চ্যাট মুছে ফেলার ফাংশন
    function clearChat() {
        if(confirm("আপনি কি সব চ্যাট মুছে ফেলতে চান?")) {
            localStorage.removeItem('geminiChatHistory');
            chatHistory = [];
            document.getElementById('chat-box').innerHTML = '';
            appendMessage("model", "চ্যাট হিস্ট্রি মুছে ফেলা হয়েছে! নতুন করে শুরু করুন।");
        }
    }
</script>

</body>
</html>
