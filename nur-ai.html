<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Universal AI Chat (Gemini Clone)</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- marked.js CDN for Markdown rendering -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

    <style>
        /* Mobile-First Full Screen Fixes */
        /* Ensure the body and html always take up the full available screen */
        html, body {
            margin: 0;
            padding: 0;
        }

        /* Custom scrollbar for better look (optional but good UX) */
        .scrollbar-custom::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        .scrollbar-custom::-webkit-scrollbar-thumb {
            background-color: rgb(209 213 219); /* light gray */
            border-radius: 4px;
        }
        .dark .scrollbar-custom::-webkit-scrollbar-thumb {
            background-color: rgb(75 85 99); /* dark gray */
        }
        .scrollbar-custom {
            scrollbar-width: thin;
            scrollbar-color: rgb(209 213 219) transparent;
        }

        /* Fix for input bar floating on mobile keyboard */
        #input-bar {
            box-shadow: 0 -4px 6px -1px rgba(0, 0, 0, 0.1), 0 -2px 4px -2px rgba(0, 0, 0, 0.06);
        }
        .dark #input-bar {
            box-shadow: 0 -4px 6px -1px rgba(255, 255, 255, 0.05), 0 -2px 4px -2px rgba(255, 255, 255, 0.02);
        }

        /* Code block styling for marked.js */
        .ai-message pre {
            @apply p-3 my-2 text-sm rounded-lg bg-gray-100 overflow-x-auto;
        }
        .dark .ai-message pre {
            @apply bg-gray-800 border border-gray-700;
        }
        .ai-message code:not(pre code) {
            @apply px-1 py-0.5 text-sm rounded bg-gray-200 font-mono;
        }
        .dark .ai-message code:not(pre code) {
            @apply bg-gray-700;
        }
        .ai-message h1, .ai-message h2, .ai-message h3 {
            @apply font-bold mt-4 mb-2;
        }
        .ai-message ul, .ai-message ol {
            @apply list-inside my-2 pl-4;
        }
        .ai-message ul {
            @apply list-disc;
        }
        .ai-message ol {
            @apply list-decimal;
        }

        /* Mobile Sidebar Overlay */
        #sidebar-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.5);
            z-index: 40; /* Below sidebar (z-50) */
            display: none;
        }
        @media (max-width: 767px) {
            #sidebar {
                transform: translateX(-100%);
                transition: transform 0.3s ease-in-out;
            }
            #sidebar.open {
                transform: translateX(0);
            }
        }
    </style>
</head>
<body class="bg-white dark:bg-gray-900 text-gray-900 dark:text-gray-100 transition-colors duration-300">

    <!-- CRITICAL TECH CONSTRAINT #2: Fallback Loader -->
    <div id="loading" class="fixed inset-0 flex items-center justify-center bg-gray-100 dark:bg-gray-800 text-2xl font-semibold z-[100]">
        Loading App...
    </div>

    <!-- MAIN APP CONTAINER (min-h-screen for full height, flex for layout) -->
    <div id="app-container" class="flex min-h-screen w-full">

        <!-- Sidebar Overlay (for mobile) -->
        <div id="sidebar-overlay" class="md:hidden"></div>

        <!-- Left Sidebar (Chat History) -->
        <aside id="sidebar" class="fixed inset-y-0 left-0 w-64 bg-gray-50 dark:bg-gray-800 p-4 flex flex-col z-50 md:relative md:translate-x-0">
            <!-- Sidebar Header -->
            <div class="flex items-center justify-between pb-4 border-b dark:border-gray-700">
                <h1 class="text-xl font-bold">AI Chat</h1>
                <button id="dark-mode-toggle" class="p-2 rounded-full hover:bg-gray-200 dark:hover:bg-gray-700 transition">
                    <!-- Icon placeholder: Sun/Moon -->
                    <svg id="moon-icon" xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 hidden dark:block" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z" /></svg>
                    <svg id="sun-icon" xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 dark:hidden" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z" /></svg>
                </button>
            </div>
            
            <!-- New Chat Button -->
            <button id="new-chat-btn" class="w-full mt-4 p-3 text-left font-semibold rounded-lg bg-white dark:bg-gray-700 hover:bg-gray-100 dark:hover:bg-gray-600 transition flex items-center">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 mr-2" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6v6m0 0v6m0-6h6m-6 0H6" /></svg>
                New Chat
            </button>

            <!-- Chat History List -->
            <div id="chat-history" class="mt-4 flex-grow overflow-y-auto scrollbar-custom">
                <!-- Chat items will be injected here -->
            </div>

            <!-- Footer: Settings & System Prompt -->
            <div class="pt-4 border-t dark:border-gray-700 space-y-2">
                <button id="system-prompt-btn" class="w-full p-2 text-left rounded-lg hover:bg-gray-200 dark:hover:bg-gray-700 transition flex items-center">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 mr-2" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 17v-2m3 2v-4m3 4v-6m2 10H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" /></svg>
                    System Prompt
                </button>
                <button id="settings-btn" class="w-full p-2 text-left rounded-lg hover:bg-gray-200 dark:hover:bg-gray-700 transition flex items-center">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 mr-2" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37a1.724 1.724 0 002.572-1.065z" /><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" /></svg>
                    Settings
                </button>
            </div>
        </aside>

        <!-- Main Content Area -->
        <main class="flex-1 flex flex-col md:ml-64 relative">

            <!-- Mobile Header/Toggle -->
            <header class="p-3 border-b dark:border-gray-800 md:hidden bg-white dark:bg-gray-900 sticky top-0 z-30">
                <button id="sidebar-toggle-btn" class="p-2 rounded-full hover:bg-gray-100 dark:hover:bg-gray-800 transition">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16m-7 6h7" /></svg>
                </button>
                <span id="current-chat-title" class="ml-3 font-semibold text-lg">New Chat</span>
            </header>
            
            <!-- Chat Messages Area -->
            <div id="chat-area" class="flex-grow overflow-y-auto p-4 md:p-8 space-y-4 scrollbar-custom pb-32">
                <div id="empty-state" class="text-center p-12 text-gray-500 dark:text-gray-400">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-12 w-12 mx-auto mb-3" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z" /></svg>
                    <p class="text-xl font-semibold">Start a conversation with AI</p>
                    <p class="text-sm">Your conversation history will appear here.</p>
                </div>
            </div>

            <!-- Floating/Sticky Input Bar -->
            <div id="input-bar" class="fixed bottom-0 left-0 right-0 md:left-64 p-4 bg-white dark:bg-gray-900 border-t dark:border-gray-800 z-40 transition-all duration-300">
                <div class="max-w-3xl mx-auto flex items-end">
                    <textarea id="user-input" rows="1" placeholder="Message Universal AI..."
                        class="flex-grow p-3 border border-gray-300 dark:border-gray-700 rounded-xl focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 dark:bg-gray-800 dark:text-gray-100 resize-none scrollbar-custom"
                        oninput="this.style.height='auto'; this.style.height=(this.scrollHeight)+'px';"
                        style="max-height: 200px;"></textarea>
                    <button id="send-btn" class="ml-3 p-3 text-white bg-indigo-600 rounded-xl hover:bg-indigo-700 transition-colors disabled:bg-indigo-400 dark:disabled:bg-indigo-500">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7" /></svg>
                    </button>
                </div>
                <div class="text-xs text-center text-gray-400 mt-2">
                    Powered by OpenRouter API.
                </div>
            </div>
        </main>
    </div>

    <!-- MODALS -->

    <!-- Settings Modal -->
    <div id="settings-modal" class="hidden fixed inset-0 bg-black bg-opacity-50 z-[60] flex items-center justify-center p-4">
        <div class="bg-white dark:bg-gray-800 rounded-lg w-full max-w-md p-6 shadow-xl">
            <h2 class="text-2xl font-bold mb-4 border-b dark:border-gray-700 pb-2">Settings</h2>
            <div class="space-y-4">
                <div>
                    <label for="api-key-input" class="block text-sm font-medium mb-1">OpenRouter API Key</label>
                    <input type="password" id="api-key-input" class="w-full p-2 border border-gray-300 dark:border-gray-700 rounded-md dark:bg-gray-700 dark:text-gray-100">
                    <p class="text-xs text-gray-500 mt-1">Key is stored only in your browser (localStorage).</p>
                </div>
                <div>
                    <label for="model-input" class="block text-sm font-medium mb-1">Model Name</label>
                    <input type="text" id="model-input" class="w-full p-2 border border-gray-300 dark:border-gray-700 rounded-md dark:bg-gray-700 dark:text-gray-100" value="deepseek/deepseek-r1:free">
                    <p class="text-xs text-gray-500 mt-1">Default: deepseek/deepseek-r1:free</p>
                </div>
            </div>
            <div class="mt-6 flex justify-end space-x-2">
                <button id="close-settings-btn" class="py-2 px-4 rounded-lg bg-gray-200 dark:bg-gray-700 hover:bg-gray-300 dark:hover:bg-gray-600 transition">Close</button>
                <button id="save-settings-btn" class="py-2 px-4 rounded-lg bg-indigo-600 text-white hover:bg-indigo-700 transition">Save</button>
            </div>
        </div>
    </div>

    <!-- System Prompt Modal -->
    <div id="system-prompt-modal" class="hidden fixed inset-0 bg-black bg-opacity-50 z-[60] flex items-center justify-center p-4">
        <div class="bg-white dark:bg-gray-800 rounded-lg w-full max-w-lg p-6 shadow-xl">
            <h2 class="text-2xl font-bold mb-4 border-b dark:border-gray-700 pb-2">System Prompt Editor</h2>
            <div>
                <label for="system-prompt-textarea" class="block text-sm font-medium mb-1">Define the AI's persona or instructions (per-chat)</label>
                <textarea id="system-prompt-textarea" rows="6" class="w-full p-2 border border-gray-300 dark:border-gray-700 rounded-md dark:bg-gray-700 dark:text-gray-100 resize-none scrollbar-custom" placeholder="You are a helpful and friendly Senior Frontend Engineer and UX Architect."></textarea>
            </div>
            <div class="mt-6 flex justify-end space-x-2">
                <button id="close-system-btn" class="py-2 px-4 rounded-lg bg-gray-200 dark:bg-gray-700 hover:bg-gray-300 dark:hover:bg-gray-600 transition">Close</button>
                <button id="save-system-btn" class="py-2 px-4 rounded-lg bg-indigo-600 text-white hover:bg-indigo-700 transition">Save & Apply</button>
            </div>
        </div>
    </div>


    <!-- CRITICAL TECH CONSTRAINT #1 & #2: Vanilla JavaScript at the END of body -->
    <script>
        // Use IIFE for scope isolation, though not strictly required in a single file
        (function() {
            // ==========================================================
            // 1. STATE MANAGEMENT
            // ==========================================================

            let state = {
                apiKey: null,
                model: "deepseek/deepseek-r1:free",
                darkMode: false,
                chats: [],
                currentChatId: null,
                isStreaming: false,
                abortController: null,
            };

            // ==========================================================
            // 2. DOM ELEMENTS CACHING
            // ==========================================================
            const elements = {
                loading: document.getElementById('loading'),
                appContainer: document.getElementById('app-container'),
                sidebar: document.getElementById('sidebar'),
                sidebarOverlay: document.getElementById('sidebar-overlay'),
                sidebarToggleBtn: document.getElementById('sidebar-toggle-btn'),
                darkModeToggle: document.getElementById('dark-mode-toggle'),
                chatHistory: document.getElementById('chat-history'),
                chatArea: document.getElementById('chat-area'),
                emptyState: document.getElementById('empty-state'),
                userInput: document.getElementById('user-input'),
                sendBtn: document.getElementById('send-btn'),
                newChatBtn: document.getElementById('new-chat-btn'),
                settingsBtn: document.getElementById('settings-btn'),
                systemPromptBtn: document.getElementById('system-prompt-btn'),
                settingsModal: document.getElementById('settings-modal'),
                systemPromptModal: document.getElementById('system-prompt-modal'),
                apiKeyInput: document.getElementById('api-key-input'),
                modelInput: document.getElementById('model-input'),
                closeSettingsBtn: document.getElementById('close-settings-btn'),
                saveSettingsBtn: document.getElementById('save-settings-btn'),
                systemPromptTextarea: document.getElementById('system-prompt-textarea'),
                closeSystemBtn: document.getElementById('close-system-btn'),
                saveSystemBtn: document.getElementById('save-system-btn'),
                currentChatTitle: document.getElementById('current-chat-title'),
            };

            // ==========================================================
            // 3. STORAGE & PERSISTENCE
            // ==========================================================

            /** Loads state from localStorage */
            function loadState() {
                try {
                    const savedState = JSON.parse(localStorage.getItem('aiChatState'));
                    if (savedState) {
                        state.apiKey = savedState.apiKey || null;
                        state.model = savedState.model || state.model;
                        state.darkMode = savedState.darkMode !== undefined ? savedState.darkMode : state.darkMode;
                        state.chats = savedState.chats || [];
                        state.currentChatId = savedState.currentChatId || null;

                        // Check if current chat still exists, otherwise default to a new one
                        if (state.currentChatId && !state.chats.find(c => c.id === state.currentChatId)) {
                            state.currentChatId = null;
                        }

                        // If no chats or currentChatId is null, create a new chat
                        if (state.chats.length === 0 || state.currentChatId === null) {
                            createNewChat();
                        }
                    } else {
                        // First run: Create initial chat
                        createNewChat();
                    }
                } catch (e) {
                    console.error("Error loading state:", e);
                    createNewChat(); // Ensure a chat is created even on error
                }
            }

            /** Saves state to localStorage */
            function saveState() {
                try {
                    const stateToSave = {
                        apiKey: state.apiKey,
                        model: state.model,
                        darkMode: state.darkMode,
                        chats: state.chats,
                        currentChatId: state.currentChatId
                    };
                    localStorage.setItem('aiChatState', JSON.stringify(stateToSave));
                } catch (e) {
                    console.error("Error saving state:", e);
                }
            }

            // ==========================================================
            // 4. UI RENDERING AND UPDATES
            // ==========================================================

            /** Applies the dark mode preference to the DOM */
            function applyDarkMode() {
                if (state.darkMode) {
                    document.documentElement.classList.add('dark');
                } else {
                    document.documentElement.classList.remove('dark');
                }
            }

            /** Gets the current chat object */
            function getCurrentChat() {
                return state.chats.find(c => c.id === state.currentChatId);
            }

            /** Scrolls the chat area to the bottom */
            function scrollToBottom() {
                elements.chatArea.scrollTop = elements.chatArea.scrollHeight;
            }

            /**
             * Renders a single message element
             * @param {object} message - { role: 'user' | 'assistant', content: string }
             * @param {string} tempId - Temporary ID for streaming updates
             */
            function renderMessage(message, tempId = null) {
                const isUser = message.role === 'user';
                const containerClasses = isUser ? 'flex justify-end' : 'flex justify-start';
                const messageClasses = isUser
                    ? 'bg-indigo-600 text-white rounded-tl-xl rounded-tr-xl rounded-bl-xl'
                    : 'bg-gray-100 dark:bg-gray-800 text-gray-900 dark:text-gray-100 rounded-tr-xl rounded-br-xl rounded-bl-xl';

                const avatar = isUser
                    ? `<div class="w-8 h-8 flex-shrink-0 ml-2 rounded-full bg-indigo-600 text-white flex items-center justify-center font-bold text-sm">U</div>`
                    : `<div class="w-8 h-8 flex-shrink-0 mr-2 rounded-full bg-blue-500 text-white flex items-center justify-center font-bold text-sm">AI</div>`;

                const contentHtml = marked.parse(message.content);

                const messageDiv = document.createElement('div');
                messageDiv.className = containerClasses;
                if (tempId) {
                    messageDiv.id = `msg-${tempId}`;
                }

                messageDiv.innerHTML = `
                    ${!isUser ? avatar : ''}
                    <div class="max-w-xl lg:max-w-2xl">
                        <div class="p-3 shadow-md ${messageClasses} ai-message break-words min-w-[50px] transition-colors duration-300">
                            ${contentHtml}
                        </div>
                    </div>
                    ${isUser ? avatar : ''}
                `;

                elements.chatArea.appendChild(messageDiv);
                scrollToBottom();
            }

            /** Renders all messages for the current chat */
            function renderChatMessages() {
                const currentChat = getCurrentChat();
                elements.chatArea.innerHTML = '';
                elements.currentChatTitle.textContent = currentChat ? currentChat.title : 'New Chat';

                if (!currentChat || currentChat.messages.length === 0) {
                    elements.emptyState.style.display = 'block';
                    return;
                }

                elements.emptyState.style.display = 'none';
                currentChat.messages.forEach(msg => renderMessage(msg));
            }

            /** Renders the chat history sidebar */
            function renderChatHistory() {
                elements.chatHistory.innerHTML = '';
                state.chats.forEach(chat => {
                    const isActive = chat.id === state.currentChatId;
                    const itemClass = isActive
                        ? 'bg-indigo-100 dark:bg-indigo-900/50'
                        : 'hover:bg-gray-200 dark:hover:bg-gray-700';

                    const item = document.createElement('div');
                    item.className = `chat-history-item flex items-center justify-between p-2 rounded-lg cursor-pointer transition-colors ${itemClass}`;
                    item.dataset.chatId = chat.id;

                    item.innerHTML = `
                        <span class="truncate text-sm font-medium flex-grow" title="${chat.title}">${chat.title}</span>
                        <div class="flex space-x-1 opacity-0 ${isActive ? 'opacity-100' : 'group-hover:opacity-100'} transition-opacity">
                            <button class="rename-chat-btn p-1 rounded-full hover:bg-gray-300 dark:hover:bg-gray-600">
                                <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.232 5.232l3.536 3.536m-2.036-5.036a2.5 2.5 0 113.536 3.536L6.5 21.036H3v-3.572L16.732 3.732z" /></svg>
                            </button>
                            <button class="delete-chat-btn p-1 rounded-full hover:bg-red-200 dark:hover:bg-red-700">
                                <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 text-red-500" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" /></svg>
                            </button>
                        </div>
                    `;
                    
                    item.addEventListener('click', (e) => {
                        if (e.target.closest('.rename-chat-btn') || e.target.closest('.delete-chat-btn')) {
                            return; // Don't switch chat if clicking action buttons
                        }
                        switchChat(chat.id);
                        if (window.innerWidth < 768) {
                            toggleSidebar(false); // Close sidebar on mobile after selection
                        }
                    });
                    
                    elements.chatHistory.appendChild(item);
                });
            }

            // ==========================================================
            // 5. CHAT MANAGEMENT
            // ==========================================================
            
            /** Switches to a different chat by ID */
            function switchChat(chatId) {
                if (state.currentChatId === chatId) return;
                state.currentChatId = chatId;
                renderChatMessages();
                renderChatHistory();
                saveState();
            }

            /** Creates a new chat */
            function createNewChat() {
                const newChat = {
                    id: Date.now().toString(),
                    title: "New Chat",
                    systemPrompt: "",
                    messages: []
                };
                state.chats.unshift(newChat); // Add to the top
                state.currentChatId = newChat.id;
                renderChatMessages();
                renderChatHistory();
                saveState();
            }

            /** Renames a chat */
            function renameChat(chatId) {
                const chat = state.chats.find(c => c.id === chatId);
                if (!chat) return;

                const newTitle = prompt("Enter new title for the chat:", chat.title);
                if (newTitle && newTitle.trim()) {
                    chat.title = newTitle.trim();
                    renderChatHistory();
                    if (chatId === state.currentChatId) {
                        elements.currentChatTitle.textContent = chat.title;
                    }
                    saveState();
                }
            }

            /** Deletes a chat */
            function deleteChat(chatId) {
                if (!confirm("Are you sure you want to delete this chat? This cannot be undone.")) return;

                const index = state.chats.findIndex(c => c.id === chatId);
                if (index > -1) {
                    state.chats.splice(index, 1);
                }

                if (state.currentChatId === chatId) {
                    if (state.chats.length > 0) {
                        state.currentChatId = state.chats[0].id; // Switch to the first chat
                    } else {
                        createNewChat(); // Create a new chat if none left
                        return; // createNewChat handles rendering/saving
                    }
                }

                renderChatMessages();
                renderChatHistory();
                saveState();
            }

            /** Handles history item button clicks */
            function handleHistoryActions(e) {
                const button = e.target.closest('.rename-chat-btn') || e.target.closest('.delete-chat-btn');
                if (!button) return;

                const item = e.target.closest('.chat-history-item');
                const chatId = item.dataset.chatId;

                if (button.classList.contains('rename-chat-btn')) {
                    renameChat(chatId);
                } else if (button.classList.contains('delete-chat-btn')) {
                    deleteChat(chatId);
                }
            }


            // ==========================================================
            // 6. API CORE (STREAMING)
            // ==========================================================

            /** Handles sending the message and streaming the response */
            async function sendMessage() {
                const userInput = elements.userInput.value.trim();
                if (!userInput || state.isStreaming) return;
                
                if (!state.apiKey) {
                    alert("Please enter your OpenRouter API Key in Settings first.");
                    elements.settingsModal.style.display = 'flex';
                    return;
                }

                elements.userInput.value = ''; // Clear input
                elements.userInput.style.height = 'auto'; // Reset height
                elements.sendBtn.disabled = true;
                state.isStreaming = true;
                state.abortController = new AbortController();
                const currentChat = getCurrentChat();

                // 1. Add User Message to Chat and DOM
                const userMessage = { role: 'user', content: userInput };
                currentChat.messages.push(userMessage);
                renderMessage(userMessage);
                saveState();

                // 2. Prepare API Call
                let messagesForApi = currentChat.messages.slice(); // Clone messages

                // Add System Prompt if it exists
                if (currentChat.systemPrompt) {
                    messagesForApi.unshift({ role: "system", content: currentChat.systemPrompt });
                }

                const tempMessageId = Date.now();
                const tempAIMessage = { role: 'assistant', content: '...' };
                currentChat.messages.push(tempAIMessage); // Placeholder message for state
                
                // Render placeholder message on DOM
                renderMessage({ role: 'assistant', content: '<span class="animate-pulse">Thinking...</span>' }, tempMessageId);
                const messageEl = document.getElementById(`msg-${tempMessageId}`).querySelector('.ai-message');
                messageEl.innerHTML = ''; // Clear 'Thinking...'

                let fullResponseContent = "";
                let accumulatedBuffer = "";

                try {
                    const response = await fetch('https://openrouter.ai/api/v1/chat/completions', {
                        method: 'POST',
                        headers: {
                            'Authorization': `Bearer ${state.apiKey}`,
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify({
                            model: state.model,
                            messages: messagesForApi,
                            stream: true
                        }),
                        signal: state.abortController.signal
                    });

                    if (!response.ok) {
                        const errorData = await response.json();
                        throw new Error(`API Error: ${response.status} - ${errorData.message || 'Unknown error'}`);
                    }

                    const reader = response.body.getReader();
                    const decoder = new TextDecoder("utf-8");

                    while (true) {
                        const { value, done } = await reader.read();
                        if (done) {
                            break;
                        }

                        accumulatedBuffer += decoder.decode(value, { stream: true });

                        // Process chunks that end with \n\n (SSE format)
                        let boundary = accumulatedBuffer.indexOf('\n\n');
                        while (boundary !== -1) {
                            const chunk = accumulatedBuffer.substring(0, boundary);
                            accumulatedBuffer = accumulatedBuffer.substring(boundary + 2);

                            // Process the chunk (remove 'data: ')
                            if (chunk.startsWith('data: ')) {
                                const jsonStr = chunk.substring(6).trim();
                                if (jsonStr === '[DONE]') {
                                    break;
                                }

                                try {
                                    const data = JSON.parse(jsonStr);
                                    const delta = data.choices?.[0]?.delta?.content || '';
                                    if (delta) {
                                        fullResponseContent += delta;
                                        // Use marked.js only on the full content
                                        messageEl.innerHTML = marked.parse(fullResponseContent);
                                        scrollToBottom();
                                    }
                                } catch (e) {
                                    // Ignore non-JSON chunks or parsing errors
                                    console.warn("Could not parse chunk:", e);
                                }
                            }
                            boundary = accumulatedBuffer.indexOf('\n\n');
                        }
                    }

                } catch (error) {
                    if (error.name === 'AbortError') {
                        fullResponseContent += "\n\n**Response Aborted.**";
                    } else {
                        console.error('Streaming error:', error);
                        // Display error to the user
                        fullResponseContent += `\n\n**Error:** ${error.message}`;
                    }
                    messageEl.innerHTML = marked.parse(fullResponseContent);
                } finally {
                    // 3. Finalize and Update State
                    state.isStreaming = false;
                    elements.sendBtn.disabled = false;
                    
                    // Update the placeholder message with the final content
                    const placeholderIndex = currentChat.messages.findIndex(m => m.content === '...');
                    if (placeholderIndex !== -1) {
                        currentChat.messages[placeholderIndex].content = fullResponseContent || '(Empty response)';
                    }
                    
                    // If it was a new chat and the first message, rename it
                    if (currentChat.messages.length === 2 && currentChat.title === "New Chat") {
                        currentChat.title = userInput.substring(0, 30) + (userInput.length > 30 ? '...' : '');
                        elements.currentChatTitle.textContent = currentChat.title;
                        renderChatHistory(); // Update the sidebar title
                    }

                    saveState();
                }
            }


            // ==========================================================
            // 7. EVENT HANDLERS
            // ==========================================================
            
            /** Toggles the sidebar visibility on mobile */
            function toggleSidebar(open) {
                const isOpen = open !== undefined ? open : elements.sidebar.classList.contains('open');
                if (isOpen) {
                    elements.sidebar.classList.remove('open');
                    elements.sidebarOverlay.style.display = 'none';
                } else {
                    elements.sidebar.classList.add('open');
                    elements.sidebarOverlay.style.display = 'block';
                }
            }

            /** Toggles the dark mode */
            function toggleDarkMode() {
                state.darkMode = !state.darkMode;
                applyDarkMode();
                saveState();
            }

            /** Opens the settings modal and loads current values */
            function openSettingsModal() {
                elements.apiKeyInput.value = state.apiKey || '';
                elements.modelInput.value = state.model;
                elements.settingsModal.style.display = 'flex';
            }

            /** Saves settings from the modal */
            function saveSettings() {
                state.apiKey = elements.apiKeyInput.value.trim() || null;
                state.model = elements.modelInput.value.trim() || state.model;
                elements.settingsModal.style.display = 'none';
                saveState();
                alert('Settings saved!');
            }

            /** Opens the system prompt modal and loads the current chat's prompt */
            function openSystemPromptModal() {
                const currentChat = getCurrentChat();
                elements.systemPromptTextarea.value = currentChat.systemPrompt || '';
                elements.systemPromptModal.style.display = 'flex';
            }

            /** Saves the system prompt to the current chat */
            function saveSystemPrompt() {
                const currentChat = getCurrentChat();
                currentChat.systemPrompt = elements.systemPromptTextarea.value.trim();
                elements.systemPromptModal.style.display = 'none';
                saveState();
                alert('System Prompt saved for the current chat!');
            }

            // Keyboard shortcut for sending (Enter)
            elements.userInput.addEventListener('keypress', (e) => {
                if (e.key === 'Enter' && !e.shiftKey) {
                    e.preventDefault();
                    sendMessage();
                }
            });

            // ==========================================================
            // 8. INITIALIZATION
            // ==========================================================

            function init() {
                // 1. Load and apply state
                loadState();
                applyDarkMode();

                // 2. Initial rendering
                renderChatHistory();
                renderChatMessages();

                // 3. Set up event listeners
                elements.newChatBtn.addEventListener('click', createNewChat);
                elements.sendBtn.addEventListener('click', sendMessage);
                elements.chatHistory.addEventListener('click', handleHistoryActions);

                // Sidebar Toggle (Mobile)
                elements.sidebarToggleBtn.addEventListener('click', () => toggleSidebar());
                elements.sidebarOverlay.addEventListener('click', () => toggleSidebar(false));

                // Dark Mode
                elements.darkModeToggle.addEventListener('click', toggleDarkMode);

                // Settings Modal
                elements.settingsBtn.addEventListener('click', openSettingsModal);
                elements.closeSettingsBtn.addEventListener('click', () => elements.settingsModal.style.display = 'none');
                elements.saveSettingsBtn.addEventListener('click', saveSettings);

                // System Prompt Modal
                elements.systemPromptBtn.addEventListener('click', openSystemPromptModal);
                elements.closeSystemBtn.addEventListener('click', () => elements.systemPromptModal.style.display = 'none');
                elements.saveSystemBtn.addEventListener('click', saveSystemPrompt);

                // 4. Hide loading screen (CRITICAL CONSTRAINT #2)
                elements.loading.style.display = 'none';
            }

            // Run initialization
            init();

        })();
    </script>
</body>
