<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>XYZ Shop - Secure Login</title>
    <!-- স্টাইলিং এর জন্য Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 flex items-center justify-center min-h-screen p-4 font-sans">

    <div class="w-full max-w-md bg-white rounded-2xl shadow-xl overflow-hidden border border-gray-100">
        <!-- Header -->
        <div class="bg-emerald-800 p-6 text-center">
            <h1 class="text-2xl font-bold text-white tracking-wide">XYZ Shop</h1>
            <p class="text-emerald-200 text-sm mt-1">Secure Account Verification</p>
        </div>

        <div class="p-6">
            <!-- Alert Message Box -->
            <div id="alertBox" class="hidden mb-4 p-3 rounded-lg text-sm font-medium text-center transition-all"></div>

            <!-- Step 1: Configuration (API Key) -->
            <div id="configSection" class="mb-6 p-4 bg-gray-50 border border-gray-200 rounded-xl">
                <label class="block text-xs font-bold text-gray-500 uppercase tracking-wider mb-2">System Config (Dev Only)</label>
                <input type="text" id="apiKeyInput" placeholder="Paste your Applet API Key here" class="w-full text-sm px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:border-emerald-500 focus:ring-1 focus:ring-emerald-500 mb-2">
                <button onclick="saveApiKey()" class="w-full bg-gray-800 text-white text-xs font-bold py-2 rounded-lg hover:bg-gray-900">Save API Key to LocalStorage</button>
            </div>

            <!-- Step 2: Request OTP -->
            <div id="requestSection" class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Email Address</label>
                    <input type="email" id="emailInput" placeholder="user@example.com" class="w-full px-4 py-3 border border-gray-300 rounded-xl focus:outline-none focus:border-emerald-500 focus:ring-2 focus:ring-emerald-200 transition-all">
                </div>
                <button id="sendBtn" onclick="sendOtp()" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-3 rounded-xl transition-all shadow-lg shadow-emerald-200">
                    Send Verification Code
                </button>
            </div>

            <!-- Step 3: Verify OTP (Initially Hidden) -->
            <div id="verifySection" class="space-y-4 hidden mt-6 pt-6 border-t border-gray-100">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Enter 6-Digit OTP</label>
                    <input type="text" id="otpInput" maxlength="6" placeholder="• • • • • •" class="w-full px-4 py-3 border border-gray-300 rounded-xl text-center text-2xl tracking-[0.5em] focus:outline-none focus:border-emerald-500 focus:ring-2 focus:ring-emerald-200 transition-all">
                </div>
                <button id="verifyBtn" onclick="verifyOtp()" class="w-full bg-gray-900 hover:bg-black text-white font-bold py-3 rounded-xl transition-all">
                    Verify & Login
                </button>
                <button onclick="resetFlow()" class="w-full text-sm text-gray-500 hover:text-gray-800 font-medium py-2">
                    Use a different email
                </button>
            </div>

            <!-- Step 4: Success Screen (Initially Hidden) -->
            <div id="successSection" class="hidden text-center py-6">
                <div class="w-16 h-16 bg-emerald-100 text-emerald-600 rounded-full flex items-center justify-center mx-auto mb-4">
                    <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7"></path></svg>
                </div>
                <h2 class="text-2xl font-bold text-gray-900 mb-2">Verified Successfully!</h2>
                <p class="text-gray-500 mb-6">Welcome to XYZ Shop dashboard.</p>
                <button onclick="resetFlow()" class="bg-gray-100 hover:bg-gray-200 text-gray-800 font-medium py-2 px-6 rounded-lg transition-colors">Start Over</button>
            </div>
        </div>
    </div>

    <script>
        // আপনার সার্ভারের লোকাল বা লাইভ URL দিন
        const API_URL = 'http://localhost:3000/api/v1/send'; 
        
        let generatedOtp = null; // পাঠানো OTP এখানে সেভ থাকবে

        // পেজ লোড হলে LocalStorage থেকে API Key নিয়ে আসা
        window.onload = () => {
            const savedKey = localStorage.getItem('xyz_api_key');
            if (savedKey) {
                document.getElementById('apiKeyInput').value = savedKey;
            }
        };

        // ১. API Key সেভ করার ফাংশন
        function saveApiKey() {
            const key = document.getElementById('apiKeyInput').value.trim();
            if(!key) return showAlert('Please enter an API Key', 'error');
            localStorage.setItem('xyz_api_key', key);
            showAlert('API Key Saved to Local Storage!', 'success');
        }

        // ২. OTP পাঠানোর ফাংশন
        async function sendOtp() {
            const email = document.getElementById('emailInput').value.trim();
            const apiKey = document.getElementById('apiKeyInput').value.trim();
            const btn = document.getElementById('sendBtn');

            if (!apiKey) return showAlert('Please save your API Key first.', 'error');
            if (!email) return showAlert('Please enter an email address.', 'error');

            // একটি ৬ ডিজিটের র‍্যান্ডম OTP জেনারেট করা হচ্ছে
            generatedOtp = Math.floor(100000 + Math.random() * 900000).toString();

            try {
                btn.innerText = "Sending...";
                btn.disabled = true;

                const response = await fetch(API_URL, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${apiKey}`
                    },
                    body: JSON.stringify({
                        to: email,
                        otp: generatedOtp,
                        subject: 'XYZ Shop - Your Login Code'
                    })
                });

                const data = await response.json();

                if (response.ok) {
                    showAlert('OTP Sent! Check your email.', 'success');
                    // ইমেইল ইনপুট হাইড করে OTP ইনপুট শো করা
                    document.getElementById('requestSection').classList.add('hidden');
                    document.getElementById('verifySection').classList.remove('hidden');
                } else {
                    showAlert(data.error || 'Failed to send OTP', 'error');
                }
            } catch (error) {
                showAlert('Network error. Is your server running?', 'error');
            } finally {
                btn.innerText = "Send Verification Code";
                btn.disabled = false;
            }
        }

        // ৩. OTP ভেরিফাই করার ফাংশন
        function verifyOtp() {
            const userOtp = document.getElementById('otpInput').value.trim();
            
            if (!userOtp) return showAlert('Please enter the OTP', 'error');

            // ইউজার ইনপুট করা OTP এর সাথে আমাদের জেনারেট করা OTP ম্যাচ করানো
            if (userOtp === generatedOtp) {
                // সাকসেস!
                document.getElementById('verifySection').classList.add('hidden');
                document.getElementById('configSection').classList.add('hidden');
                document.getElementById('alertBox').classList.add('hidden');
                document.getElementById('successSection').classList.remove('hidden');
            } else {
                showAlert('Invalid Verification Code. Try again.', 'error');
            }
        }

        // ৪. রিসেট বা আবার শুরু করার ফাংশন
        function resetFlow() {
            generatedOtp = null;
            document.getElementById('otpInput').value = '';
            document.getElementById('emailInput').value = '';
            
            document.getElementById('successSection').classList.add('hidden');
            document.getElementById('verifySection').classList.add('hidden');
            document.getElementById('requestSection').classList.remove('hidden');
            document.getElementById('configSection').classList.remove('hidden');
            document.getElementById('alertBox').classList.add('hidden');
        }

        // এলার্ট দেখানোর হেল্পার ফাংশন
        function showAlert(message, type) {
            const box = document.getElementById('alertBox');
            box.innerText = message;
            box.classList.remove('hidden', 'bg-red-100', 'text-red-700', 'bg-emerald-100', 'text-emerald-700');
            
            if (type === 'error') {
                box.classList.add('bg-red-100', 'text-red-700');
            } else {
                box.classList.add('bg-emerald-100', 'text-emerald-700');
            }
        }
    </script>
</body>
</html>
