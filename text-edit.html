<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>রাইটিং স্টুডিও</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+Bengali:wght@400;600;700&family=Hind+Siliguri:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #f0f4f0;
  --surface: #ffffff;
  --surface2: #f5f8f5;
  --surface3: #e8f0e8;
  --border: #c8dcc8;
  --accent: #2d7a4f;
  --accent2: #3a9962;
  --accent3: #1a5c3a;
  --accent-light: #e0f0e8;
  --text: #1a2a1a;
  --text-muted: #5a7a5a;
  --page-bg: #ffffff;
  --red: #c0392b;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:'Hind Siliguri',sans-serif;height:100vh;display:flex;flex-direction:column;overflow:hidden}

/* TOP BAR */
.topbar{background:var(--surface);border-bottom:2px solid var(--border);padding:0 20px;height:48px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0;box-shadow:0 1px 4px rgba(45,122,79,.06)}
.topbar-brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:1.1rem;color:var(--accent);letter-spacing:.02em}
.topbar-brand svg{width:22px;height:22px}
.topbar-actions{display:flex;gap:8px}
.btn-top{background:var(--surface2);border:1px solid var(--border);color:var(--text-muted);padding:5px 14px;border-radius:6px;cursor:pointer;font-size:.8rem;font-family:inherit;transition:all .18s}
.btn-top:hover{background:var(--accent-light);color:var(--accent3);border-color:var(--accent2)}
.btn-top.primary{background:var(--accent);color:#fff;border-color:var(--accent3)}
.btn-top.primary:hover{background:var(--accent3)}

/* TOOLBAR */
.toolbar{background:var(--surface);border-bottom:2px solid var(--border);padding:7px 14px;display:flex;flex-direction:column;gap:5px;flex-shrink:0}
.toolbar-row{display:flex;align-items:center;gap:3px;flex-wrap:wrap}
.tool-sep{width:1px;height:24px;background:var(--border);margin:0 4px}
.tb-btn{background:transparent;border:1px solid transparent;color:var(--text-muted);width:30px;height:30px;border-radius:6px;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:.85rem;font-weight:700;font-family:'Georgia',serif;transition:all .14s;position:relative;flex-shrink:0}
.tb-btn:hover{background:var(--accent-light);color:var(--accent3);border-color:var(--border)}
.tb-btn.active{background:var(--accent);color:#fff;border-color:var(--accent3)}
.tb-btn svg{width:14px;height:14px;pointer-events:none}
.tb-select{background:var(--surface2);border:1px solid var(--border);color:var(--text);padding:3px 6px;border-radius:6px;font-family:inherit;font-size:.78rem;cursor:pointer;height:30px;outline:none;transition:border-color .18s}
.tb-select:hover,.tb-select:focus{border-color:var(--accent2);background:var(--accent-light)}
.color-wrap{position:relative;display:flex;align-items:center}
.color-btn{width:30px;height:30px;border-radius:6px;border:1px solid var(--border);cursor:pointer;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:1px;background:var(--surface2);transition:border-color .18s;overflow:hidden;padding:0}
.color-btn:hover{border-color:var(--accent2);background:var(--accent-light)}
.color-btn .icon-layer{font-size:13px;font-weight:700;font-family:Georgia,serif;color:var(--text);line-height:1}
.color-btn .color-strip{width:100%;height:5px;background:#2d7a4f;transition:background .2s}
input[type="color"].hidden-picker{position:absolute;opacity:0;width:100%;height:100%;cursor:pointer;top:0;left:0}
.hl-strip{width:14px;height:14px;border-radius:3px;background:#bbf7d0}

/* EDITOR AREA */
.editor-wrap{flex:1;display:flex;overflow:hidden;background:var(--bg)}
.page-area{flex:1;overflow-y:auto;padding:36px 20px;display:flex;justify-content:center;align-items:flex-start;scrollbar-width:thin;scrollbar-color:var(--border) transparent}
.page{width:820px;min-height:1060px;background:var(--page-bg);border:1px solid var(--border);border-radius:4px;box-shadow:0 4px 32px rgba(45,122,79,.10),0 1px 4px rgba(0,0,0,.07);padding:60px 70px;position:relative}
.page::before{content:'';position:absolute;top:0;left:68px;width:2px;height:100%;background:rgba(45,122,79,.12);pointer-events:none}
#editor{outline:none;min-height:940px;font-family:'Noto Serif Bengali',serif;font-size:16px;line-height:1.9;color:#111;caret-color:var(--accent);word-break:break-word}
#editor:empty::before{content:attr(data-placeholder);color:#aaa;pointer-events:none}
#editor a{color:var(--accent);text-decoration:underline}
#editor blockquote{border-left:3px solid var(--accent2);padding:8px 16px;margin:8px 0;color:#555;font-style:italic;background:rgba(45,122,79,.04);border-radius:0 6px 6px 0}
#editor table{border-collapse:collapse;width:100%;margin:8px 0}
#editor td,#editor th{border:1px solid var(--border);padding:6px 10px;min-width:40px}
#editor th{background:var(--surface3);font-weight:600}
#editor hr{border:none;border-top:2px solid var(--border);margin:16px 0}

/* CODE BLOCK */
.ws-code-block{position:relative;background:#1a1a1a;border-radius:8px;margin:12px 0;border:1px solid #333;overflow:hidden;display:block}
.ws-code-header{display:flex;justify-content:space-between;align-items:center;padding:6px 12px;background:#111;border-bottom:1px solid #333}
.ws-code-lang{font-size:.72rem;color:#6a9;font-family:monospace;letter-spacing:.06em;text-transform:uppercase}
.ws-code-copy{background:#2a2a2a;border:1px solid #444;color:#aaa;padding:2px 10px;border-radius:4px;font-size:.72rem;cursor:pointer;font-family:'Hind Siliguri',sans-serif;transition:all .15s}
.ws-code-copy:hover{background:var(--accent);color:#fff;border-color:var(--accent3)}
.ws-code-body{padding:14px 16px;font-family:'Courier New',monospace;font-size:.9rem;color:#d4f7d4;white-space:pre-wrap;outline:none;min-height:48px;line-height:1.7;display:block}
.ws-code-body:empty::before{content:'কোড এখানে লিখুন...';color:#555;pointer-events:none}

/* IMAGE WRAPPER */
.img-wrapper{position:relative;line-height:0;display:block;margin:8px auto;user-select:none}
.img-wrapper img{display:block;border-radius:4px;max-width:100%}
.img-wrapper.selected img{outline:2px solid var(--accent2);outline-offset:1px}
.img-wrapper.selected .img-handle{display:block}
.img-handle{display:none;position:absolute;width:11px;height:11px;background:var(--accent);border:2px solid #fff;border-radius:2px;z-index:10;box-shadow:0 1px 4px rgba(0,0,0,.3)}
.img-handle.se{bottom:-5px;right:-5px;cursor:se-resize}
.img-handle.sw{bottom:-5px;left:-5px;cursor:sw-resize}
.img-handle.ne{top:-5px;right:-5px;cursor:ne-resize}
.img-handle.nw{top:-5px;left:-5px;cursor:nw-resize}
.img-handle.n{top:-5px;left:50%;transform:translateX(-50%);cursor:n-resize}
.img-handle.s{bottom:-5px;left:50%;transform:translateX(-50%);cursor:s-resize}
.img-handle.e{right:-5px;top:50%;transform:translateY(-50%);cursor:e-resize}
.img-handle.w{left:-5px;top:50%;transform:translateY(-50%);cursor:w-resize}
.img-ratio-badge{display:none;position:absolute;bottom:6px;left:6px;background:rgba(0,0,0,.65);color:#fff;font-size:.68rem;padding:1px 7px;border-radius:4px;pointer-events:none;font-family:monospace}
.img-wrapper.selected .img-ratio-badge{display:block}

/* IMAGE CONTEXT MENU */
.img-context-menu{display:none;position:fixed;background:#fff;border:1px solid var(--border);border-radius:10px;box-shadow:0 8px 32px rgba(0,0,0,.16);padding:6px 0;z-index:9999;min-width:200px;animation:ctxIn .15s ease}
@keyframes ctxIn{from{opacity:0;transform:scale(.95)}to{opacity:1;transform:scale(1)}}
.img-context-menu.show{display:block}
.img-ctx-item{padding:8px 18px;font-size:.83rem;cursor:pointer;color:var(--text);display:flex;align-items:center;gap:10px;transition:background .1s;font-family:'Hind Siliguri',sans-serif}
.img-ctx-item:hover{background:var(--accent-light);color:var(--accent3)}
.img-ctx-item.danger{color:var(--red)}
.img-ctx-item.danger:hover{background:#fff0f0}
.img-ctx-sep{height:1px;background:var(--border);margin:4px 0}
.img-ctx-label{padding:5px 18px 2px;font-size:.68rem;color:var(--text-muted);text-transform:uppercase;letter-spacing:.08em}

/* STATUS BAR */
.statusbar{background:var(--surface);border-top:2px solid var(--border);height:28px;display:flex;align-items:center;padding:0 16px;gap:20px;font-size:.72rem;color:var(--text-muted);flex-shrink:0}
.statusbar span{display:flex;align-items:center;gap:4px}
.status-dot{width:6px;height:6px;border-radius:50%;background:var(--accent2);animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}

/* MODALS */
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:1000;align-items:center;justify-content:center;backdrop-filter:blur(3px)}
.modal-overlay.show{display:flex}
.modal{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:28px;width:440px;box-shadow:0 16px 64px rgba(45,122,79,.15);animation:slideIn .18s ease}
@keyframes slideIn{from{transform:translateY(-10px);opacity:0}to{transform:translateY(0);opacity:1}}
.modal h3{font-size:1rem;color:var(--accent);margin-bottom:18px;font-weight:700}
.modal-field{margin-bottom:14px}
.modal-field label{display:block;font-size:.78rem;color:var(--text-muted);margin-bottom:5px}
.modal-field input,.modal-field select{width:100%;background:var(--surface2);border:1px solid var(--border);color:var(--text);padding:8px 12px;border-radius:7px;font-family:inherit;font-size:.85rem;outline:none;transition:border-color .18s}
.modal-field input:focus,.modal-field select:focus{border-color:var(--accent2)}
.modal-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:20px}
.modal-btn{padding:8px 20px;border-radius:7px;border:1px solid var(--border);cursor:pointer;font-family:inherit;font-size:.83rem;font-weight:500;transition:all .18s}
.modal-btn.cancel{background:var(--surface2);color:var(--text-muted)}
.modal-btn.cancel:hover{color:var(--text);background:var(--surface3)}
.modal-btn.confirm{background:var(--accent);color:#fff;border-color:var(--accent3)}
.modal-btn.confirm:hover{background:var(--accent3)}
.tb-btn[title]:hover::after{content:attr(title);position:absolute;top:calc(100% + 5px);left:50%;transform:translateX(-50%);background:var(--text);color:#fff;font-size:.68rem;font-family:'Hind Siliguri',sans-serif;white-space:nowrap;padding:3px 8px;border-radius:4px;pointer-events:none;z-index:999}
@media(max-width:900px){.page{width:100%;padding:24px 16px}.page::before{display:none}}
</style>
</head>
<body>

<div class="topbar">
  <div class="topbar-brand">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 20h9M16.5 3.5a2.121 2.121 0 013 3L7 19l-4 1 1-4L16.5 3.5z"/></svg>
    One Text Studio
  </div>
  <div class="topbar-actions">
    <button class="btn-top" onclick="printDoc()">Print</button>
    <button class="btn-top" onclick="exportHTML()">⬇ HTML</button>
    <button class="btn-top primary" onclick="copyHTML()">Copy HTML</button>
  </div>
</div>

<div class="toolbar">
  <div class="toolbar-row">
    <select class="tb-select" id="fontFamily" onchange="execCmd('fontName',this.value)" style="width:128px">
      <option value="'Noto Serif Bengali',serif">Noto Serif</option>
      <option value="'Hind Siliguri',sans-serif">Hind Siliguri</option>
      <option value="Georgia,serif">Georgia</option>
      <option value="'Times New Roman',serif">Times New Roman</option>
      <option value="Arial,sans-serif">Arial</option>
      <option value="'Courier New',monospace">Courier New</option>
      <option value="Verdana,sans-serif">Verdana</option>
    </select>
    <select class="tb-select" onchange="setFontSize(this.value)" style="width:58px">
      <option value="10">10</option><option value="12">12</option><option value="14" selected>14</option>
      <option value="16">16</option><option value="18">18</option><option value="20">20</option>
      <option value="24">24</option><option value="28">28</option><option value="32">32</option>
      <option value="36">36</option><option value="48">48</option><option value="64">64</option><option value="72">72</option>
    </select>
    <div class="tool-sep"></div>
    <button class="tb-btn" id="btn-bold" title="Bold (Ctrl+B)" onclick="execCmd('bold')"><b>B</b></button>
    <button class="tb-btn" id="btn-italic" title="Italic (Ctrl+I)" onclick="execCmd('italic')"><i>I</i></button>
    <button class="tb-btn" id="btn-underline" title="Underline" onclick="execCmd('underline')"><u>U</u></button>
    <button class="tb-btn" id="btn-strikethrough" title="Strikethrough" onclick="execCmd('strikethrough')"><s>S</s></button>
    <button class="tb-btn" id="btn-superscript" title="Superscript" onclick="execCmd('superscript')">x²</button>
    <button class="tb-btn" id="btn-subscript" title="Subscript" onclick="execCmd('subscript')">x₂</button>
    <div class="tool-sep"></div>
    <div class="color-wrap" title="Text color">
      <button class="color-btn" id="textColorBtn">
        <span class="icon-layer">A</span>
        <span class="color-strip" id="textColorStrip"></span>
      </button>
      <input type="color" class="hidden-picker" id="textColorPicker" value="#2d7a4f" oninput="applyTextColor(this.value)">
    </div>
    <div class="color-wrap" title="Highlight">
      <button class="color-btn" id="bgColorBtn">
        <div class="hl-strip" id="bgColorStrip"></div>
        <span style="font-size:9px;color:var(--text-muted);line-height:1">HL</span>
      </button>
      <input type="color" class="hidden-picker" id="bgColorPicker" value="#bbf7d0" oninput="applyHighlight(this.value)">
    </div>
    <div class="tool-sep"></div>
    <button class="tb-btn" title="left" onclick="execCmd('justifyLeft')"><svg viewBox="0 0 16 16" fill="currentColor"><rect x="1" y="2" width="14" height="2" rx="1"/><rect x="1" y="6" width="10" height="2" rx="1"/><rect x="1" y="10" width="14" height="2" rx="1"/><rect x="1" y="14" width="8" height="2" rx="1"/></svg></button>
    <button class="tb-btn" title="center" onclick="execCmd('justifyCenter')"><svg viewBox="0 0 16 16" fill="currentColor"><rect x="1" y="2" width="14" height="2" rx="1"/><rect x="3" y="6" width="10" height="2" rx="1"/><rect x="1" y="10" width="14" height="2" rx="1"/><rect x="4" y="14" width="8" height="2" rx="1"/></svg></button>
    <button class="tb-btn" title="right" onclick="execCmd('justifyRight')"><svg viewBox="0 0 16 16" fill="currentColor"><rect x="1" y="2" width="14" height="2" rx="1"/><rect x="5" y="6" width="10" height="2" rx="1"/><rect x="1" y="10" width="14" height="2" rx="1"/><rect x="7" y="14" width="8" height="2" rx="1"/></svg></button>
    <button class="tb-btn" title="justify" onclick="execCmd('justifyFull')"><svg viewBox="0 0 16 16" fill="currentColor"><rect x="1" y="2" width="14" height="2" rx="1"/><rect x="1" y="6" width="14" height="2" rx="1"/><rect x="1" y="10" width="14" height="2" rx="1"/><rect x="1" y="14" width="14" height="2" rx="1"/></svg></button>
    <div class="tool-sep"></div>
    <button class="tb-btn" title="ইন্ডেন্ট কমান" onclick="execCmd('outdent')"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><polyline points="9,4 5,8 9,12"/><line x1="5" y1="8" x2="15" y2="8"/><line x1="1" y1="3" x2="1" y2="13"/></svg></button>
    <button class="tb-btn" title="ইন্ডেন্ট বাড়ান" onclick="execCmd('indent')"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><polyline points="7,4 11,8 7,12"/><line x1="11" y1="8" x2="1" y2="8"/><line x1="15" y1="3" x2="15" y2="13"/></svg></button>
    <div class="tool-sep"></div>
    <select class="tb-select" onchange="setHeading(this.value);this.value=''" style="width:84px">
      <option value="">শিরোনাম</option>
      <option value="h1">H1</option><option value="h2">H2</option><option value="h3">H3</option>
      <option value="h4">H4</option><option value="h5">H5</option><option value="h6">H6</option>
      <option value="p">সাধারণ</option>
    </select>
    <select class="tb-select" onchange="setZoom(this.value)" style="width:68px">
      <option value=".7">70%</option><option value=".85">85%</option>
      <option value="1" selected>100%</option><option value="1.15">115%</option>
      <option value="1.25">125%</option><option value="1.5">150%</option>
    </select>
  </div>
  <div class="toolbar-row">
    <button class="tb-btn" title="বুলেট লিস্ট" onclick="execCmd('insertUnorderedList')"><svg viewBox="0 0 16 16" fill="currentColor"><circle cx="2" cy="4" r="1.5"/><rect x="5" y="3" width="10" height="2" rx="1"/><circle cx="2" cy="9" r="1.5"/><rect x="5" y="8" width="10" height="2" rx="1"/><circle cx="2" cy="14" r="1.5"/><rect x="5" y="13" width="10" height="2" rx="1"/></svg></button>
    <button class="tb-btn" title="নম্বর লিস্ট" onclick="execCmd('insertOrderedList')"><svg viewBox="0 0 16 16" fill="currentColor"><text x="1" y="5" font-size="4.5" font-family="monospace">1.</text><rect x="6" y="3" width="9" height="2" rx="1"/><text x="1" y="10" font-size="4.5" font-family="monospace">2.</text><rect x="6" y="8" width="9" height="2" rx="1"/><text x="1" y="15" font-size="4.5" font-family="monospace">3.</text><rect x="6" y="13" width="9" height="2" rx="1"/></svg></button>
    <div class="tool-sep"></div>
    <button class="tb-btn" title="লিঙ্ক (Ctrl+K)" onclick="openLinkModal()"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M6.5 9.5a4 4 0 005.6 0l2-2a4 4 0 00-5.6-5.6l-1 1"/><path d="M9.5 6.5a4 4 0 00-5.6 0l-2 2a4 4 0 005.6 5.6l1-1"/></svg></button>
    <button class="tb-btn" title="লিঙ্ক মুছুন" onclick="execCmd('unlink')"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M6.5 9.5a4 4 0 005.6 0l2-2a4 4 0 00-5.6-5.6l-1 1"/><path d="M9.5 6.5a4 4 0 00-5.6 0l-2 2a4 4 0 005.6 5.6l1-1"/><line x1="2" y1="2" x2="14" y2="14" stroke-width="2"/></svg></button>
    <button class="tb-btn" title="ইমেজ" onclick="openImageModal()"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="1" y="2" width="14" height="12" rx="2"/><circle cx="5.5" cy="6" r="1.5"/><polyline points="1,13 5,8 8,11 11,7 15,13"/></svg></button>
    <button class="tb-btn" title="টেবিল" onclick="openTableModal()"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="1" y="1" width="14" height="14" rx="1"/><line x1="1" y1="6" x2="15" y2="6"/><line x1="1" y1="11" x2="15" y2="11"/><line x1="6" y1="1" x2="6" y2="15"/><line x1="11" y1="1" x2="11" y2="15"/></svg></button>
    <button class="tb-btn" title="বিভাজক" onclick="execCmd('insertHorizontalRule')"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2"><line x1="1" y1="8" x2="15" y2="8"/></svg></button>
    <button class="tb-btn" title="কোড ব্লক" onclick="insertCodeBlock()"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><polyline points="5,3 1,8 5,13"/><polyline points="11,3 15,8 11,13"/></svg></button>
    <button class="tb-btn" title="কোটেশন" onclick="execCmd('formatBlock','blockquote')"><svg viewBox="0 0 16 16" fill="currentColor"><path d="M2 4h4v5H4a2 2 0 01-2-2V4zm8 0h4v5h-2a2 2 0 01-2-2V4z" opacity=".5"/><path d="M4 9v3l2-1.5V9H4zm8 0v3l2-1.5V9h-2z"/></svg></button>
    <div class="tool-sep"></div>
    <select class="tb-select" onchange="setLineHeight(this.value)" style="width:80px">
      <option value="">লাইন স্পেস</option><option value="1.2">১.২</option>
      <option value="1.5">১.৫</option><option value="1.8" selected>১.৮</option>
      <option value="2">২.০</option><option value="2.5">২.৫</option>
    </select>
    <select class="tb-select" onchange="setLetterSpacing(this.value)" style="width:82px">
      <option value="">অক্ষর ফাঁক</option><option value="0">০</option>
      <option value=".5px">০.৫px</option><option value="1px">১px</option>
      <option value="2px">২px</option><option value="3px">৩px</option>
    </select>
    <div class="tool-sep"></div>
    <button class="tb-btn" title="পূর্বাবস্থা (Ctrl+Z)" onclick="document.execCommand('undo')"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M3 7H11a4 4 0 010 8H7"/><polyline points="3,4 3,7 6,7"/></svg></button>
    <button class="tb-btn" title="পুনরায় (Ctrl+Y)" onclick="document.execCommand('redo')"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M13 7H5a4 4 0 000 8h4"/><polyline points="13,4 13,7 10,7"/></svg></button>
    <div class="tool-sep"></div>
    <button class="tb-btn" title="ফরম্যাট মুছুন" onclick="execCmd('removeFormat')"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M3 3l10 10M8 3l3 3-5 5-3-3z"/><line x1="1" y1="15" x2="8" y2="15"/></svg></button>
  </div>
</div>

<div class="editor-wrap">
  <div class="page-area" id="pageArea">
    <div class="page" id="pageEl">
      <div id="editor" contenteditable="true" spellcheck="true" data-placeholder="এখানে লেখা শুরু করুন..."></div>

</div>

<div class="statusbar">
  <span><span class="status-dot"></span> সম্পাদনা মোড</span>

</div>

<!-- IMAGE CONTEXT MENU -->
<div class="img-context-menu" id="imgCtxMenu">
  <div class="img-ctx-label">ইমেজ টুলস</div>
  <div class="img-ctx-item" onclick="ctxChangeSize()">📐 সাইজ পরিবর্তন</div>
  <div class="img-ctx-item" onclick="ctxSetRatio()">🔒 <span id="ratioLabel">রেশিও লক: চালু</span></div>
  <div class="img-ctx-item" onclick="ctxCopyLink()">🔗 ইমেজ লিঙ্ক কপি</div>
  <div class="img-ctx-item" onclick="ctxOpenLink()">↗ নতুন ট্যাবে খুলুন</div>
  <div class="img-ctx-sep"></div>
  <div class="img-ctx-label">পজিশন</div>
  <div class="img-ctx-item" onclick="ctxAlign('left')">⬅ বামে</div>
  <div class="img-ctx-item" onclick="ctxAlign('center')">⬌ কেন্দ্রে</div>
  <div class="img-ctx-item" onclick="ctxAlign('right')">➡ ডানে</div>
  <div class="img-ctx-item" onclick="ctxAlign('float-left')">↰ টেক্সটের বামে</div>
  <div class="img-ctx-item" onclick="ctxAlign('float-right')">↱ টেক্সটের ডানে</div>
  <div class="img-ctx-sep"></div>
  <div class="img-ctx-item danger" onclick="ctxDeleteImg()">🗑 ইমেজ মুছুন</div>
</div>

<!-- LINK MODAL -->
<div class="modal-overlay" id="linkModal">
  <div class="modal">
    <h3>🔗 লিঙ্ক যোগ করুন</h3>
    <div class="modal-field"><label>লিঙ্ক টেক্সট</label><input type="text" id="linkText" placeholder="প্রদর্শিত লেখা"></div>
    <div class="modal-field"><label>URL</label><input type="url" id="linkURL" placeholder="https://example.com"></div>
    <div class="modal-field"><label>খোলার ধরণ</label>
      <select id="linkTarget"><option value="_blank">নতুন ট্যাবে</option><option value="_self">একই ট্যাবে</option></select>
    </div>
    <div class="modal-actions">
      <button class="modal-btn cancel" onclick="closeModal('linkModal')">বাতিল</button>

</div>

<!-- IMAGE MODAL -->
<div class="modal-overlay" id="imageModal">
  <div class="modal">
    <h3>🖼 ইমেজ যোগ করুন</h3>
    <div class="modal-field"><label>ইমেজ URL</label><input type="url" id="imageURL" placeholder="https://example.com/image.jpg"></div>
    <div class="modal-field"><label>ফাইল আপলোড</label><input type="file" id="imageFile" accept="image/*" onchange="previewImageFile(this)"></div>
    <div class="modal-field"><label>প্রস্থ (px বা %)</label><input type="text" id="imageWidth" placeholder="যেমন: 400 বা 80%"></div>
    <div class="modal-field"><label>উচ্চতা (px, ফাঁকা = auto)</label><input type="text" id="imageHeight" placeholder="auto"></div>

      <select id="imageAlign">
        <option value="center">কেন্দ্রে</option><option value="left">বামে</option>
        <option value="right">ডানে</option><option value="float-left">টেক্সটের বামে</option>
        <option value="float-right">টেক্সটের ডানে</option>
      </select>
    </div>

      <button class="modal-btn cancel" onclick="closeModal('imageModal')">বাতিল</button>
      <button class="modal-btn confirm" onclick="insertImage()">যোগ করুন</button>

  </div>

<!-- TABLE MODAL -->
<div class="modal-overlay" id="tableModal">
  <div class="modal">
    <h3>📊 টেবিল যোগ করুন</h3>
    <div class="modal-field"><label>সারি সংখ্যা</label><input type="number" id="tableRows" value="3" min="1" max="20"></div>
    <div class="modal-field"><label>কলাম সংখ্যা</label><input type="number" id="tableCols" value="3" min="1" max="10"></div>
    <div class="modal-field"><label>শিরোনাম সারি</label>
      <select id="tableHeader"><option value="yes">হ্যাঁ</option><option value="no">না</option></select>
    </div>
    <div class="modal-actions">
      <button class="modal-btn cancel" onclick="closeModal('tableModal')">বাতিল</button>
      <button class="modal-btn confirm" onclick="insertTable()">যোগ করুন</button>
    </div>
  </div>
</div>

<script>
const editor = document.getElementById('editor');
let savedRange = null;
let ratioLocked = true;
let currentImgWrapper = null;

/* ═══════════════════════════════════════
   EXEC COMMAND — selection-aware
═══════════════════════════════════════ */
function execCmd(cmd, val=null){
  editor.focus();
  document.execCommand(cmd,false,val);
  updateFormatState();
}

function setFontSize(size){
  editor.focus();
  const sel=window.getSelection();
  if(!sel||sel.rangeCount===0||sel.isCollapsed)return;
  const range=sel.getRangeAt(0);
  const span=document.createElement('span');
  span.style.fontSize=size+'px';
  try{
    const frag=range.extractContents();
    span.appendChild(frag);
    range.insertNode(span);
    range.selectNodeContents(span);
    sel.removeAllRanges();sel.addRange(range);
  }catch(e){document.execCommand('fontSize',false,'3');}
  updateFormatState();
}

function applyTextColor(color){
  document.getElementById('textColorStrip').style.background=color;
  execCmd('foreColor',color);
}
function applyHighlight(color){
  document.getElementById('bgColorStrip').style.background=color;
  execCmd('hiliteColor',color);
}
document.getElementById('textColorBtn').addEventListener('click',()=>document.getElementById('textColorPicker').click());
document.getElementById('bgColorBtn').addEventListener('click',()=>document.getElementById('bgColorPicker').click());

function setHeading(tag){if(tag)execCmd('formatBlock',tag);}
function setLineHeight(v){if(v)editor.style.lineHeight=v;}
function setLetterSpacing(v){if(v)editor.style.letterSpacing=v;}
function setZoom(v){
  const p=document.getElementById('pageEl');
  p.style.transform=`scale(${v})`;
  p.style.transformOrigin='top center';
}

/* ═══════════════════════════════════════
   CODE BLOCK — multiline, keep-in-box, copy
═══════════════════════════════════════ */
function insertCodeBlock(){
  saveSelection();
  const wrapper=document.createElement('div');
  wrapper.className='ws-code-block';
  wrapper.contentEditable='false';

  const header=document.createElement('div');
  header.className='ws-code-header';

  const lang=document.createElement('span');
  lang.className='ws-code-lang';
  lang.textContent='code';

  const copyBtn=document.createElement('button');
  copyBtn.className='ws-code-copy';
  copyBtn.textContent='📋 কপি';
  copyBtn.addEventListener('click',()=>{
    navigator.clipboard.writeText(body.innerText).then(()=>{
      copyBtn.textContent='✓ কপি হয়েছে';
      setTimeout(()=>copyBtn.textContent='📋 কপি',1800);
    });
  });

  header.appendChild(lang);
  header.appendChild(copyBtn);

  const body=document.createElement('div');
  body.className='ws-code-body';
  body.contentEditable='true';
  body.spellcheck=false;

  // Enter = \n inside box (not new paragraph)
  body.addEventListener('keydown',e=>{
    if(e.key==='Enter'){
      e.preventDefault();
      e.stopPropagation();
      document.execCommand('insertText',false,'\n');
    }
    if(e.key==='Tab'){
      e.preventDefault();
      document.execCommand('insertText',false,'  ');
    }
    e.stopPropagation();
  });

  wrapper.appendChild(header);
  wrapper.appendChild(body);

  restoreSelection();
  editor.focus();
  const sel=window.getSelection();
  if(sel&&sel.rangeCount){
    const range=sel.getRangeAt(0);
    range.collapse(true);
    const p=document.createElement('p');
    p.innerHTML='<br>';
    range.insertNode(p);
    p.before(wrapper);
    const nr=document.createRange();
    nr.setStart(body,0);nr.collapse(true);
    sel.removeAllRanges();sel.addRange(nr);
    body.focus();
  }
}

/* ═══════════════════════════════════════
   IMAGE — insert with drag-resize + hold menu
═══════════════════════════════════════ */
let imageDataURL=null;

function openImageModal(){
  saveSelection();
  imageDataURL=null;
  ['imageURL','imageWidth','imageHeight','imageAlt'].forEach(id=>document.getElementById(id).value='');
  document.getElementById('imageFile').value='';
  document.getElementById('imageModal').classList.add('show');
}

function previewImageFile(input){
  const file=input.files[0];
  if(!file)return;
  const reader=new FileReader();
  reader.onload=e=>{imageDataURL=e.target.result;};
  reader.readAsDataURL(file);
}

function insertImage(){
  const src=imageDataURL||document.getElementById('imageURL').value.trim();
  if(!src)return;
  const w=document.getElementById('imageWidth').value.trim();
  const h=document.getElementById('imageHeight').value.trim();
  const align=document.getElementById('imageAlign').value;
  const alt=document.getElementById('imageAlt').value.trim();
  const wrapper=buildImgWrapper(src,alt,w,h,align);
  restoreSelection();
  editor.focus();
  insertNode(wrapper);
  wrapper.after(document.createElement('br'));
  closeModal('imageModal');
}

function buildImgWrapper(src,alt,w,h,align){
  const wrapper=document.createElement('div');
  wrapper.className='img-wrapper';
  wrapper.contentEditable='false';
  applyImgAlign(wrapper,align||'center');

  const img=document.createElement('img');
  img.src=src; img.alt=alt||''; img.draggable=false;
  img.style.display='block'; img.style.borderRadius='4px'; img.style.maxWidth='100%';
  if(w)img.style.width=isNaN(w)?w:w+'px';
  if(h)img.style.height=isNaN(h)?h:h+'px';
  img.onload=()=>updateBadge(wrapper,img);

  // Handles
  ['nw','n','ne','w','e','sw','s','se'].forEach(pos=>{
    const h2=document.createElement('div');
    h2.className=`img-handle ${pos}`;
    h2.dataset.pos=pos;
    setupResize(h2,wrapper,img);
    wrapper.appendChild(h2);
  });

  // Badge
  const badge=document.createElement('div');
  badge.className='img-ratio-badge';
  wrapper.appendChild(badge);
  wrapper.appendChild(img);

  // Click to select
  wrapper.addEventListener('click',e=>{e.stopPropagation();selectWrapper(wrapper);});

  // Tap & hold
  let holdTimer;
  wrapper.addEventListener('pointerdown',e=>{
    holdTimer=setTimeout(()=>{showCtxMenu(wrapper,e.clientX,e.clientY);},550);
  });
  ['pointerup','pointermove'].forEach(ev=>wrapper.addEventListener(ev,()=>clearTimeout(holdTimer)));
  wrapper.addEventListener('contextmenu',e=>{e.preventDefault();showCtxMenu(wrapper,e.clientX,e.clientY);});

  return wrapper;
}

function applyImgAlign(wrapper,align){
  wrapper.style.cssText='position:relative;line-height:0;user-select:none;';
  wrapper.dataset.align=align;
  if(align==='center'){wrapper.style.display='block';wrapper.style.marginLeft='auto';wrapper.style.marginRight='auto';}
  else if(align==='right'){wrapper.style.display='block';wrapper.style.marginLeft='auto';wrapper.style.marginRight='0';}
  else if(align==='float-left'){wrapper.style.display='inline-block';wrapper.style.float='left';wrapper.style.margin='4px 12px 4px 0';}
  else if(align==='float-right'){wrapper.style.display='inline-block';wrapper.style.float='right';wrapper.style.margin='4px 0 4px 12px';}
  else{wrapper.style.display='block';wrapper.style.margin='8px 0';}
}

function updateBadge(wrapper,img){
  const badge=wrapper.querySelector('.img-ratio-badge');
  if(!badge)return;
  badge.textContent=`${img.offsetWidth||img.naturalWidth}×${img.offsetHeight||img.naturalHeight}`;
}

function selectWrapper(wrapper){
  document.querySelectorAll('.img-wrapper.selected').forEach(w=>w.classList.remove('selected'));
  wrapper.classList.add('selected');
  currentImgWrapper=wrapper;
}

/* Drag Resize */
function setupResize(handle,wrapper,img){
  handle.addEventListener('pointerdown',e=>{
    e.preventDefault();e.stopPropagation();
    selectWrapper(wrapper);
    const sx=e.clientX,sy=e.clientY;
    const sw=img.offsetWidth||img.naturalWidth;
    const sh=img.offsetHeight||img.naturalHeight;
    const pos=handle.dataset.pos;
    const aspect=sw/sh;

    function onMove(ev){
      const dx=ev.clientX-sx,dy=ev.clientY-sy;
      let nw=sw,nh=sh;
      if(pos.includes('e'))nw=Math.max(40,sw+dx);
      if(pos.includes('s'))nh=Math.max(30,sh+dy);
      if(pos.includes('w'))nw=Math.max(40,sw-dx);
      if(pos.includes('n'))nh=Math.max(30,sh-dy);
      if(ratioLocked){
        if(pos==='e'||pos==='w')nh=Math.round(nw/aspect);
        else if(pos==='n'||pos==='s')nw=Math.round(nh*aspect);
        else nh=Math.round(nw/aspect);
      }
      img.style.width=nw+'px';img.style.height=nh+'px';
      updateBadge(wrapper,img);
    }
    function onUp(){
      document.removeEventListener('pointermove',onMove);
      document.removeEventListener('pointerup',onUp);
    }
    document.addEventListener('pointermove',onMove);
    document.addEventListener('pointerup',onUp);
  });
}

/* Context Menu */
function showCtxMenu(wrapper,x,y){
  selectWrapper(wrapper);
  const menu=document.getElementById('imgCtxMenu');
  menu.classList.add('show');
  const vw=window.innerWidth,vh=window.innerHeight;
  menu.style.left=(x+210>vw?vw-215:x)+'px';
  menu.style.top=(y+330>vh?vh-335:y)+'px';
}
function closeCtxMenu(){document.getElementById('imgCtxMenu').classList.remove('show');}

document.addEventListener('click',e=>{
  if(!e.target.closest('#imgCtxMenu')&&!e.target.closest('.img-wrapper')){
    closeCtxMenu();
    document.querySelectorAll('.img-wrapper.selected').forEach(w=>w.classList.remove('selected'));
    currentImgWrapper=null;
  }
});

function ctxChangeSize(){
  closeCtxMenu();
  if(!currentImgWrapper)return;
  const img=currentImgWrapper.querySelector('img');
  const nw=prompt('নতুন প্রস্থ (px বা %):', img.style.width||img.naturalWidth+'px');
  if(nw!==null&&nw.trim()){img.style.width=isNaN(nw.trim())?nw.trim():nw.trim()+'px';if(ratioLocked)img.style.height='';}
  updateBadge(currentImgWrapper,currentImgWrapper.querySelector('img'));
}
function ctxSetRatio(){
  ratioLocked=!ratioLocked;
  document.getElementById('ratioLabel').textContent='রেশিও লক: '+(ratioLocked?'চালু':'বন্ধ');
  closeCtxMenu();
}
function ctxCopyLink(){
  closeCtxMenu();
  if(!currentImgWrapper)return;
  navigator.clipboard.writeText(currentImgWrapper.querySelector('img').src)
    .then(()=>alert('✓ ইমেজ লিঙ্ক কপি হয়েছে!'));
}
function ctxOpenLink(){
  closeCtxMenu();
  if(!currentImgWrapper)return;
  window.open(currentImgWrapper.querySelector('img').src,'_blank');
}
function ctxAlign(align){
  closeCtxMenu();
  if(!currentImgWrapper)return;
  applyImgAlign(currentImgWrapper,align);
}
function ctxDeleteImg(){
  closeCtxMenu();
  if(!currentImgWrapper)return;
  if(confirm('ইমেজটি মুছে ফেলবেন?')){currentImgWrapper.remove();currentImgWrapper=null;}
}

/* ═══════════════════════════════════════
   HELPERS
═══════════════════════════════════════ */
function saveSelection(){
  const sel=window.getSelection();
  if(sel&&sel.rangeCount)savedRange=sel.getRangeAt(0).cloneRange();
}
function restoreSelection(){
  if(savedRange){const sel=window.getSelection();sel.removeAllRanges();sel.addRange(savedRange);}
}
function insertNode(node){
  const sel=window.getSelection();
  if(sel&&sel.rangeCount){
    const range=sel.getRangeAt(0);range.deleteContents();
    range.insertNode(node);range.setStartAfter(node);
    sel.removeAllRanges();sel.addRange(range);
  }else{editor.appendChild(node);}
}

/* LINK */
function openLinkModal(){
  saveSelection();
  const sel=window.getSelection();
  document.getElementById('linkText').value=sel?sel.toString():'';
  document.getElementById('linkURL').value='';
  document.getElementById('linkModal').classList.add('show');
  setTimeout(()=>document.getElementById('linkURL').focus(),100);
}
function insertLink(){
  const url=document.getElementById('linkURL').value.trim();
  const text=document.getElementById('linkText').value.trim();
  const target=document.getElementById('linkTarget').value;
  if(!url)return;
  restoreSelection();editor.focus();
  const sel=window.getSelection();
  if(sel&&!sel.isCollapsed&&!text){
    document.execCommand('createLink',false,url);
    editor.querySelectorAll(`a[href="${url}"]`).forEach(a=>a.target=target);
  }else{
    const a=document.createElement('a');
    a.href=url;a.target=target;a.textContent=text||url;
    if(sel&&sel.rangeCount){const r=sel.getRangeAt(0);r.deleteContents();r.insertNode(a);}
    else editor.appendChild(a);
  }
  closeModal('linkModal');
}

/* TABLE */
function openTableModal(){saveSelection();document.getElementById('tableModal').classList.add('show');}
function insertTable(){
  const rows=parseInt(document.getElementById('tableRows').value)||3;
  const cols=parseInt(document.getElementById('tableCols').value)||3;
  const header=document.getElementById('tableHeader').value==='yes';
  let html='<table style="border-collapse:collapse;width:100%;margin:8px 0">';
  for(let r=0;r<rows;r++){
    html+='<tr>';
    for(let c=0;c<cols;c++){
      const tag=(r===0&&header)?'th':'td';
      const st=`border:1px solid #c8dcc8;padding:6px 10px;min-width:40px;${tag==='th'?'background:#e8f0e8;font-weight:600':''}`;
      html+=`<${tag} style="${st}" contenteditable="true">&nbsp;</${tag}>`;
    }
    html+='</tr>';
  }
  html+='</table><br>';
  restoreSelection();editor.focus();
  document.execCommand('insertHTML',false,html);
  closeModal('tableModal');
}

/* MODALS */
function closeModal(id){document.getElementById(id).classList.remove('show');editor.focus();}
document.querySelectorAll('.modal-overlay').forEach(o=>o.addEventListener('click',e=>{if(e.target===o)o.classList.remove('show');}));

/* FORMAT STATE */
function updateFormatState(){
  ['bold','italic','underline','strikethrough','superscript','subscript'].forEach(cmd=>{
    const btn=document.getElementById('btn-'+cmd);
    if(btn)btn.classList.toggle('active',document.queryCommandState(cmd));
  });
  onEditorInput();
}

/* COUNTS */
function onEditorInput(){
  const text=editor.innerText||'';
  const words=text.trim()?text.trim().split(/\s+/).length:0;
  document.getElementById('wordCount').textContent=words;
  document.getElementById('charCount').textContent=text.replace(/\n/g,'').length;
  document.getElementById('lineCount').textContent=text.split('\n').length;
  autoSave();
}

/* AUTO SAVE */
let saveTimer;
function autoSave(){
  clearTimeout(saveTimer);
  document.getElementById('saveStatus').textContent='⏳ সেভ হচ্ছে...';
  saveTimer=setTimeout(()=>{
    try{localStorage.setItem('ws_v3',editor.innerHTML);document.getElementById('saveStatus').textContent='✓ সেভ হয়েছে';}catch(e){}
  },1200);
}
window.addEventListener('load',()=>{
  try{const s=localStorage.getItem('ws_v3');if(s)editor.innerHTML=s;}catch(e){}
  onEditorInput();
});

/* KEYBOARD */
editor.addEventListener('keydown',e=>{
  if(e.target.classList&&e.target.classList.contains('ws-code-body'))return;
  if(e.ctrlKey||e.metaKey){
    switch(e.key.toLowerCase()){
      case'b':e.preventDefault();execCmd('bold');break;
      case'i':e.preventDefault();execCmd('italic');break;
      case'u':e.preventDefault();execCmd('underline');break;
      case'k':e.preventDefault();openLinkModal();break;
      case'z':setTimeout(updateFormatState,10);break;
      case'y':setTimeout(updateFormatState,10);break;
    }
  }
  if(e.key==='Tab'){e.preventDefault();execCmd(e.shiftKey?'outdent':'indent');}
});
editor.addEventListener('keyup',updateFormatState);
editor.addEventListener('mouseup',updateFormatState);
editor.addEventListener('input',onEditorInput);

/* EXPORT */
function exportHTML(){
  const full=`<!DOCTYPE html><html lang="bn"><head><meta charset="UTF-8"><title>ডকুমেন্ট</title><style>body{font-family:'Noto Serif Bengali',serif;max-width:800px;margin:40px auto;padding:20px;line-height:1.9;font-size:16px;color:#111}a{color:#2d7a4f}blockquote{border-left:3px solid #3a9962;padding:8px 16px;margin:8px 0;font-style:italic;color:#444;background:rgba(45,122,79,.04);border-radius:0 6px 6px 0}table{border-collapse:collapse;width:100%}td,th{border:1px solid #c8dcc8;padding:6px 10px}th{background:#e8f0e8;font-weight:600}.ws-code-block{background:#1a1a1a;border-radius:8px;margin:12px 0;border:1px solid #333;overflow:hidden}.ws-code-header{display:flex;justify-content:space-between;align-items:center;padding:6px 12px;background:#111;border-bottom:1px solid #333}.ws-code-lang{font-size:.72rem;color:#6a9;font-family:monospace;text-transform:uppercase;letter-spacing:.06em}.ws-code-copy{background:#2a2a2a;border:1px solid #444;color:#aaa;padding:2px 10px;border-radius:4px;font-size:.72rem;cursor:pointer}.ws-code-body{padding:14px 16px;font-family:'Courier New',monospace;font-size:.9rem;color:#d4f7d4;white-space:pre-wrap;line-height:1.7}.img-handle,.img-ratio-badge{display:none!important}.img-wrapper{display:block;margin:8px auto}.img-wrapper img{max-width:100%;border-radius:4px;display:block}</style></head><body>${editor.innerHTML}</body></html>`;
  const a=Object.assign(document.createElement('a'),{href:URL.createObjectURL(new Blob([full],{type:'text/html'})),download:'document.html'});
  a.click();
}
function copyHTML(){
  navigator.clipboard.writeText(editor.innerHTML).then(()=>{
    const btn=document.querySelector('.btn-top.primary');
    btn.textContent='✓ কপি হয়েছে!';
    setTimeout(()=>btn.textContent='📋 কপি HTML',1800);
  });
}
function printDoc(){
  const w=window.open('','_blank');
  w.document.write(`<!DOCTYPE html><html><head><meta charset="UTF-8"><title>প্রিন্ট</title><style>@import url('https://fonts.googleapis.com/css2?family=Noto+Serif+Bengali&display=swap');body{font-family:'Noto Serif Bengali',serif;max-width:800px;margin:40px auto;font-size:16px;line-height:1.9;color:#111}a{color:#2d7a4f}blockquote{border-left:3px solid #3a9962;padding:8px 16px;font-style:italic;color:#444}table{border-collapse:collapse;width:100%}td,th{border:1px solid #ccc;padding:6px 10px}.ws-code-block{background:#1a1a1a;border-radius:8px;margin:12px 0}.ws-code-header{display:flex;justify-content:space-between;padding:6px 12px;background:#111;border-bottom:1px solid #333}.ws-code-lang{font-size:.7rem;color:#6a9;font-family:monospace;text-transform:uppercase}.ws-code-copy{display:none}.ws-code-body{padding:14px 16px;font-family:'Courier New',monospace;font-size:.9rem;color:#d4f7d4;white-space:pre-wrap;line-height:1.7}.img-handle,.img-ratio-badge{display:none!important}.img-wrapper img{max-width:100%;border-radius:4px}@media print{body{margin:0}}</style></head><body>${editor.innerHTML}</body></html>`);
  w.document.close();w.focus();
  setTimeout(()=>{w.print();w.close();},600);
}
</script>
</body>
</html>
