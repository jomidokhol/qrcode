<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ramadan Voucher Popup</title>
    <link href="https://fonts.googleapis.com/css2?family=Anton&family=Roboto:wght@500;900&display=swap" rel="stylesheet">
    <style>
        /* --- RESET & LAYOUT --- */
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Roboto', sans-serif;
            background-color: #222;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        /* --- THE SERRATED EDGE (JAGGED SHAPE) --- */
        /* This clip-path draws the zig-zag teeth on top and bottom */
        .jagged-shape {
            clip-path: polygon(
                0% 10px, 
                5% 0%, 10% 10px, 15% 0%, 20% 10px, 25% 0%, 30% 10px, 35% 0%, 40% 10px, 45% 0%, 50% 10px, 55% 0%, 60% 10px, 65% 0%, 70% 10px, 75% 0%, 80% 10px, 85% 0%, 90% 10px, 95% 0%, 100% 10px, /* Top Teeth */
                100% calc(100% - 10px),
                95% 100%, 90% calc(100% - 10px), 85% 100%, 80% calc(100% - 10px), 75% 100%, 70% calc(100% - 10px), 65% 100%, 60% calc(100% - 10px), 55% 100%, 50% calc(100% - 10px), 45% 100%, 40% calc(100% - 10px), 35% 100%, 30% calc(100% - 10px), 25% 100%, 20% calc(100% - 10px), 15% 100%, 10% calc(100% - 10px), 5% 100%, 0% calc(100% - 10px) /* Bottom Teeth */
            );
        }

        /* --- MODAL OVERLAY --- */
        .overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.85);
            display: flex; justify-content: center; align-items: center;
            z-index: 1000;
        }

        .popup-container {
            position: relative;
            width: 340px;
            display: flex;
            flex-direction: column;
            align-items: center;
            /* Animation for pop-in */
            animation: bounceIn 0.6s cubic-bezier(0.215, 0.610, 0.355, 1.000);
        }

        @keyframes bounceIn {
            0% { transform: scale(0.3); opacity: 0; }
            50% { transform: scale(1.05); }
            70% { transform: scale(0.9); }
            100% { transform: scale(1); opacity: 1; }
        }

        /* --- VOUCHER CLUSTER --- */
        .voucher-area {
            position: relative;
            width: 100%;
            height: 140px;
            z-index: 10;
        }

        .ticket {
            position: absolute;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            color: white;
            font-family: 'Anton', sans-serif;
            text-transform: uppercase;
            line-height: 1;
            box-shadow: 0 4px 15px rgba(0,0,0,0.4);
            /* Inner dashed border effect using pseudo element */
        }
        
        .ticket::after {
            content: '';
            position: absolute;
            top: 5px; left: 5px; right: 5px; bottom: 5px;
            border: 1px dashed rgba(255,255,255,0.6);
            z-index: 1;
        }

        /* 1. YELLOW (Left) */
        .t-yellow {
            background: linear-gradient(to bottom, #ffcc00, #ffaa00);
            width: 110px; height: 80px;
            top: 40px; left: 0px;
            transform: rotate(-15deg);
            z-index: 2;
        }
        .t-yellow span { font-size: 16px; z-index: 2; }

        /* 2. GREEN (Right) */
        .t-green {
            background: linear-gradient(to bottom, #00b894, #008060);
            width: 110px; height: 80px;
            top: 40px; right: 0px;
            transform: rotate(15deg);
            z-index: 2;
        }
        .t-green span { font-size: 14px; z-index: 2; }

        /* 3. RED (Center Top - The "FLASH" one) */
        .t-red {
            background: linear-gradient(to bottom, #ff3333, #cc0000);
            width: 90px; height: 110px;
            top: 0px; left: 50%;
            transform: translateX(-50%) rotate(-5deg);
            z-index: 3;
            /* Extra jagged side teeth modification for the red one */
            clip-path: polygon(
                0% 0%, 100% 0%, 100% 100%, 0% 100%,
                0% 10%, 5% 15%, 0% 20%, 5% 25%, 0% 30% /* Adding fake tears on side via visual tricks if needed, but keeping consistent for now */
            );
            /* Re-applying jagged shape manually to ensure it's tall */
            clip-path: polygon(
                0% 10px, 15% 0%, 30% 10px, 50% 0%, 70% 10px, 85% 0%, 100% 10px,
                100% calc(100% - 10px), 85% 100%, 70% calc(100% - 10px), 50% 100%, 30% calc(100% - 10px), 15% 100%, 0% calc(100% - 10px)
            );
        }
        .t-red span { font-size: 18px; z-index: 2; }

        /* 4. BLUE (Center Bottom - Small) */
        .t-blue {
            background: linear-gradient(to bottom, #4a90e2, #0052cc);
            width: 70px; height: 60px;
            top: 90px; left: 50%;
            transform: translateX(-50%) rotate(5deg);
            z-index: 4;
            font-size: 10px;
        }

        /* --- PINK GLOW BOX --- */
        .promo-box {
            background: linear-gradient(180deg, #ff1a66 0%, #ff0044 100%);
            width: 100%;
            padding: 60px 10px 40px 10px;
            margin-top: -50px; /* Pulls box up behind tickets */
            border-radius: 15px;
            text-align: center;
            position: relative;
            z-index: 1;
            box-shadow: 
                0 0 20px #ff0044,
                0 0 60px rgba(255, 0, 68, 0.6),
                inset 0 0 15px rgba(255, 255, 255, 0.4);
            border: 2px solid #ff99bb;
        }

        /* The Main Text */
        .main-title {
            font-family: 'Anton', sans-serif;
            color: white;
            font-size: 42px;
            line-height: 0.95;
            text-transform: uppercase;
            letter-spacing: 1px;
            text-shadow: 3px 3px 0px rgba(0,0,0,0.15);
            margin-bottom: 25px;
        }

        /* --- THE BUTTON --- */
        .btn-glow {
            background: radial-gradient(circle at center, #7b2cbf 0%, #3c096c 100%);
            border: 2px solid #e0aaff;
            color: white;
            padding: 12px 40px;
            border-radius: 50px;
            font-family: 'Roboto', sans-serif;
            font-weight: 900;
            font-size: 16px;
            text-transform: uppercase;
            cursor: pointer;
            box-shadow: 0 5px 20px rgba(60, 9, 108, 0.6);
            position: absolute;
            bottom: -22px;
            left: 50%;
            transform: translateX(-50%);
            transition: all 0.2s;
        }
        .btn-glow:hover { transform: translateX(-50%) scale(1.05); }

        /* --- CLOSE BUTTON --- */
        .close-wrapper {
            margin-top: 45px;
            display: flex;
            flex-direction: column;
            align-items: center;
            cursor: pointer;
        }
        .close-line {
            width: 1px; height: 25px; background: #fff; opacity: 0.6;
        }
        .close-btn {
            width: 35px; height: 35px;
            border: 1px solid #fff;
            border-radius: 50%;
            color: white;
            display: flex; justify-content: center; align-items: center;
            font-size: 18px;
            background: rgba(0,0,0,0.3);
            transition: transform 0.2s;
        }
        .close-wrapper:hover .close-btn { transform: rotate(90deg); }

        /* --- HEADER TEXT (2.2) --- */
        .header-text {
            position: absolute;
            top: -50px;
            width: 100%;
            text-align: center;
            z-index: 20;
        }
        .header-text h2 {
            font-family: 'Anton', sans-serif;
            font-size: 36px;
            background: linear-gradient(to right, #fff, #ffe0f0);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 0 5px #ff00aa);
        }

    </style>
</head>
<body>

    <div class="overlay" id="modal">
        <div class="popup-container">
            
            <!-- Floating Header -->
            <div class="header-text">
                <h2>Gift Recived</h2>
            </div>

            <!-- VOUCHERS -->
            <div class="voucher-area">
                <!-- Red: Flash -->
                <div class="ticket t-red jagged-shape">
                    <span>Money<br>💸</span>
                </div>
                <!-- Yellow: Choice -->
                <div class="ticket t-yellow jagged-shape">
                    <span>🤑️<br>nice</span>
                </div>
                <!-- Green: Free Ship -->
                <div class="ticket t-green jagged-shape">
                    <span>🥰<br>yehhh</span>
                </div>
                <!-- Blue: Bank -->
                <div class="ticket t-blue jagged-shape">
                    <span>Wow<br>🥳</span>
                </div>
            </div>

            <!-- PINK BOX -->
            <div class="promo-box">
                <div class="main-title">
                    <br>৳ 999.00
                </div>
                <button class="btn-glow" onclick="closeModal()">Claim</button>
            </div>

            <!-- CLOSE BUTTON -->
            <div class="close-wrapper" onclick="closeModal()">
                <div class="close-line"></div>
                <div class="close-btn">&times;</div>
            </div>

        </div>
    </div>

    <script>
        function closeModal() {
            const modal = document.getElementById('modal');
            modal.style.transition = 'opacity 0.3s';
            modal.style.opacity = '0';
            setTimeout(() => modal.remove(), 300);
        }
    </script>
</body>
</html>
