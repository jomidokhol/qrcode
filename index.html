<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GitShare Pro | QR Generator</title>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode/1.5.1/qrcode.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">

    <style>
        :root { --primary: #6366f1; --bg: #ffffff; --card: #f8fafc; --text: #0f172a; --border: #e2e8f0; }
        .dark-mode { --bg: #000000; --card: #111111; --text: #ffffff; --border: #222222; }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Plus Jakarta Sans', sans-serif; }
        body { background-color: var(--bg); color: var(--text); transition: 0.4s; min-height: 100vh; display: flex; justify-content: center; align-items: center; padding: 20px; }
        .container { width: 100%; max-width: 500px; }
        .main-card { background: var(--card); border: 1px solid var(--border); border-radius: 32px; padding: 30px; box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.2); }

        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; }
        .logo { font-weight: 800; font-size: 1.4rem; color: var(--primary); display: flex; align-items: center; gap: 8px; }
        .theme-btn { background: var(--border); border: none; width: 40px; height: 40px; border-radius: 12px; cursor: pointer; color: var(--text); }

        #loaderInline { display: none; text-align: center; padding: 20px; }
        .spinner { width: 40px; height: 40px; border: 4px solid var(--border); border-top: 4px solid var(--primary); border-radius: 50%; animation: spin 1s linear infinite; margin: 0 auto 10px; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        .upload-box { border: 2px dashed var(--primary); border-radius: 24px; padding: 40px 20px; text-align: center; cursor: pointer; background: rgba(99, 102, 241, 0.05); }
        
        #resultArea { display: none; margin-top: 25px; padding-top: 25px; border-top: 1px solid var(--border); text-align: center; }
        .qr-wrapper { width: 200px; height: 200px; margin: 0 auto 20px; background: white; padding: 10px; border-radius: 16px; display: flex; align-items: center; justify-content: center; overflow: hidden; }
        #qrcode canvas { width: 100% !important; height: 100% !important; }

        .control-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; text-align: left; margin-top: 20px; }
        .control-item label { font-size: 0.7rem; font-weight: 700; display: block; margin-bottom: 5px; opacity: 0.7; }
        input[type="color"] { width: 100%; height: 35px; border: none; border-radius: 5px; background: none; cursor: pointer; }

        .btn { width: 100%; padding: 14px; border-radius: 12px; border: none; font-weight: 700; cursor: pointer; transition: 0.3s; display: flex; align-items: center; justify-content: center; gap: 10px; margin-top: 10px; }
        .btn-primary { background: var(--primary); color: white; }
        .btn-action { background: var(--border); color: var(--text); font-size: 0.85rem; }
    </style>
</head>
<body>

    <div class="container">
        <div class="main-card">
            <div class="header">
                <div class="logo"><i class="fas fa-bolt"></i> GitShare</div>
                <button class="theme-btn" id="themeToggle"><i class="fas fa-moon"></i></button>
            </div>

            <div id="uploaderView">
                <div class="upload-box" id="dropZone">
                    <i class="fas fa-cloud-arrow-up" style="font-size: 2.5rem; color: var(--primary);"></i>
                    <h3 id="uploadTitle" style="margin-top:10px;">Choose a file</h3>
                    <input type="file" id="fileInput" hidden>
                </div>
                
                <div id="loaderInline">
                    <div class="spinner"></div>
                    <p style="font-size: 0.85rem; font-weight: 600;">Processing...</p>
                </div>

                <button class="btn btn-primary" id="uploadBtn" disabled>Generate QR Code</button>
            </div>

            <div id="resultArea">
                <div class="qr-wrapper"><div id="qrcode"></div></div>
                
                <div class="control-grid">
                    <div class="control-item">
                        <label>QR Color</label>
                        <input type="color" id="qrColor" value="#000000">
                    </div>
                    <div class="control-item">
                        <label>Background</label>
                        <input type="color" id="qrBg" value="#ffffff">
                    </div>
                    <div class="control-item" style="grid-column: span 2;">
                        <label>Download Resolution</label>
                        <input type="range" id="qrSize" min="200" max="1500" value="600" style="width: 100%; accent-color: var(--primary);">
                    </div>
                </div>

                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 15px;">
                    <button class="btn btn-action" id="downloadQRBtn"><i class="fas fa-download"></i> Save QR</button>
                    <button class="btn btn-action" id="copyBtn"><i class="fas fa-link"></i> Copy URL</button>
                </div>
                <button class="btn" style="background: transparent; border: 1px solid var(--border); font-size: 0.8rem; margin-top: 15px;" onclick="location.reload()">
                    Upload New File
                </button>
            </div>
        </div>
    </div>

    <script>
        const GIT = {
            token: "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",
            owner: "jomidokhol",
            repo: "qrcode",
            branch: "main",
            domain: "https://qrcode-gen-weld.vercel.app" // আপনার ডোমেইন
        };

        const fileInput = document.getElementById('fileInput');
        const dropZone = document.getElementById('dropZone');
        const uploadBtn = document.getElementById('uploadBtn');
        const loader = document.getElementById('loaderInline');
        const resultArea = document.getElementById('resultArea');
        const qrcodeDiv = document.getElementById('qrcode');
        let currentUrl = "";
        let selectedFile = null;

        document.getElementById('themeToggle').onclick = () => {
            document.body.classList.toggle('dark-mode');
        };

        dropZone.onclick = () => fileInput.click();
        fileInput.onchange = (e) => {
            selectedFile = e.target.files[0];
            if(selectedFile) {
                document.getElementById('uploadTitle').innerText = selectedFile.name;
                uploadBtn.disabled = false;
            }
        };

        uploadBtn.onclick = async () => {
            loader.style.display = 'block';
            uploadBtn.style.display = 'none';
            const reader = new FileReader();
            reader.readAsDataURL(selectedFile);
            reader.onload = async () => {
                const base64 = reader.result.split(',')[1];
                const fileName = Date.now() + "_" + selectedFile.name;
                const path = `uploads/${fileName}`;

                try {
                    const res = await fetch(`https://api.github.com/repos/${GIT.owner}/${GIT.repo}/contents/${path}`, {
                        method: "PUT",
                        headers: { "Authorization": `token ${GIT.token}`, "Content-Type": "application/json" },
                        body: JSON.stringify({ message: "upload", content: base64, branch: GIT.branch })
                    });

                    if (res.ok) {
                        const fileData = { n: selectedFile.name, p: path, s: (selectedFile.size / (1024*1024)).toFixed(2) };
                        // জেনারেটেড ইউআরএল ফরম্যাট: ডোমেইন/viewer.html?f=FILE_ID
                        currentUrl = `${GIT.domain}/viewer.html?f=${btoa(JSON.stringify(fileData))}`;
                        
                        document.getElementById('uploaderView').style.display = 'none';
                        resultArea.style.display = 'block';
                        generateQR();
                    }
                } catch (e) { alert("Error: " + e.message); }
                loader.style.display = 'none';
            };
        };

        function generateQR() {
            qrcodeDiv.innerHTML = '';
            QRCode.toCanvas(currentUrl, {
                width: document.getElementById('qrSize').value,
                margin: 2,
                color: { dark: document.getElementById('qrColor').value, light: document.getElementById('qrBg').value }
            }, (err, canvas) => { qrcodeDiv.appendChild(canvas); });
        }

        document.getElementById('qrColor').oninput = generateQR;
        document.getElementById('qrBg').oninput = generateQR;
        document.getElementById('qrSize').oninput = generateQR;

        document.getElementById('downloadQRBtn').onclick = () => {
            const link = document.createElement('a');
            link.download = 'qrcode.png';
            link.href = qrcodeDiv.querySelector('canvas').toDataURL();
            link.click();
        };

        document.getElementById('copyBtn').onclick = () => {
            navigator.clipboard.writeText(currentUrl);
            alert("Sharable URL Copied!");
        };
    </script>
</body>
</html>
