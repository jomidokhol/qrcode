<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nur Share Pro | QR Generator</title>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode/1.5.1/qrcode.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">

    <style>
        :root { --primary: #6366f1; --bg: #ffffff; --card: #f8fafc; --text: #0f172a; --border: #e2e8f0; }
        .dark-mode { --bg: #000000; --card: #111111; --text: #ffffff; --border: #222222; }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Plus Jakarta Sans', sans-serif; }
        body { background-color: var(--bg); color: var(--text); transition: 0.4s; min-height: 100vh; display: flex; justify-content: center; align-items: center; padding: 20px; }
        .container { width: 100%; max-width: 500px; }
        .main-card { background: var(--card); border: 1px solid var(--border); border-radius: 32px; padding: 30px; box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.2); }

        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; }
        .logo { font-weight: 800; font-size: 1.4rem; color: var(--primary); display: flex; align-items: center; gap: 8px; }
        .theme-btn { background: var(--border); border: none; width: 40px; height: 40px; border-radius: 12px; cursor: pointer; color: var(--text); }

        /* Progress Bar UI */
        #progressContainer { display: none; margin-top: 20px; text-align: left; }
        .progress-track { background: var(--border); height: 10px; border-radius: 10px; overflow: hidden; margin-top: 10px; }
        .progress-fill { background: var(--primary); height: 100%; width: 0%; transition: width 0.1s; }
        #percentLabel { font-size: 0.8rem; font-weight: 700; color: var(--primary); }

        .upload-box { border: 2px dashed var(--primary); border-radius: 24px; padding: 40px 20px; text-align: center; cursor: pointer; background: rgba(99, 102, 241, 0.05); }
        
        #resultArea { display: none; margin-top: 25px; padding-top: 25px; border-top: 1px solid var(--border); text-align: center; }
        .qr-wrapper { width: 200px; height: 200px; margin: 0 auto 20px; background: white; padding: 10px; border-radius: 16px; display: flex; align-items: center; justify-content: center; overflow: hidden; }
        #qrcode canvas { width: 100% !important; height: 100% !important; }

        .control-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; text-align: left; margin-top: 20px; }
        .btn { width: 100%; padding: 14px; border-radius: 12px; border: none; font-weight: 700; cursor: pointer; transition: 0.3s; display: flex; align-items: center; justify-content: center; gap: 10px; margin-top: 10px; }
        .btn-primary { background: var(--primary); color: white; }
        .btn-action { background: var(--border); color: var(--text); font-size: 0.85rem; }
    </style>
</head>
<body>

    <div class="container">
        <div class="main-card">
            <div class="header">
                <div class="logo"><i class="fas fa-bolt"></i> Nur Share</div>
                <button class="theme-btn" id="themeToggle"><i class="fas fa-moon"></i></button>
            </div>

            <div id="uploaderView">
                <div class="upload-box" id="dropZone">
                    <i class="fas fa-cloud-arrow-up" style="font-size: 2.5rem; color: var(--primary);"></i>
                    <h3 id="uploadTitle" style="margin-top:10px;">Choose a file</h3>
                    <input type="file" id="fileInput" hidden>
                </div>
                
                <!-- Real Progress Bar -->
                <div id="progressContainer">
                    <div style="display: flex; justify-content: space-between;">
                        <span style="font-size: 0.8rem; opacity: 0.7;">Uploading...</span>
                        <span id="percentLabel">0%</span>
                    </div>
                    <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
                </div>

                <button class="btn btn-primary" id="uploadBtn" disabled>Generate</button>
            </div>

            <div id="resultArea">
                <div class="qr-wrapper"><div id="qrcode"></div></div>
                <div class="control-grid" style="grid-template-columns: 1fr;">
                    <label style="font-size: 0.7rem; font-weight: 700;">Resolution</label>
                    <input type="range" id="qrSize" min="200" max="1500" value="600" style="width: 100%; accent-color: var(--primary);">
                </div>
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 15px;">
                    <button class="btn btn-action" id="downloadQRBtn"><i class="fas fa-download"></i> Save QR</button>
                    <button class="btn btn-action" id="copyBtn"><i class="fas fa-link"></i> Copy URL</button>
                </div>
                <button class="btn" style="background: transparent; border: 1px solid var(--border); font-size: 0.8rem; margin-top: 15px;" onclick="location.reload()">
                    Upload New File
                </button>
            </div>
        </div>
    </div>

    <script>
        const GIT = {
            token: "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",
            owner: "jomidokhol",
            repo: "qrcode",
            branch: "main",
            domain: "https://qrcode-gen-weld.vercel.app"
        };

        const fileInput = document.getElementById('fileInput');
        const dropZone = document.getElementById('dropZone');
        const uploadBtn = document.getElementById('uploadBtn');
        const progressContainer = document.getElementById('progressContainer');
        const progressFill = document.getElementById('progressFill');
        const percentLabel = document.getElementById('percentLabel');
        const resultArea = document.getElementById('resultArea');
        const qrcodeDiv = document.getElementById('qrcode');
        let currentUrl = "";
        let selectedFile = null;

        document.getElementById('themeToggle').onclick = () => {
            document.body.classList.toggle('dark-mode');
        };

        dropZone.onclick = () => fileInput.click();
        fileInput.onchange = (e) => {
            selectedFile = e.target.files[0];
            if(selectedFile) {
                document.getElementById('uploadTitle').innerText = selectedFile.name;
                uploadBtn.disabled = false;
            }
        };

        uploadBtn.onclick = () => {
            if(!selectedFile) return;
            
            progressContainer.style.display = 'block';
            uploadBtn.style.display = 'none';

            const reader = new FileReader();
            reader.readAsDataURL(selectedFile);
            reader.onload = () => {
                const base64 = reader.result.split(',')[1];
                const fileName = Date.now() + "_" + selectedFile.name;
                const path = `uploads/${fileName}`;

                // GitHub Content API handles data as a single PUT request. 
                // Using XMLHttpRequest to track the actual data transfer.
                const xhr = new XMLHttpRequest();
                xhr.open("PUT", `https://api.github.com/repos/${GIT.owner}/${GIT.repo}/contents/${path}`);
                xhr.setRequestHeader("Authorization", `token ${GIT.token}`);
                xhr.setRequestHeader("Content-Type", "application/json");

                xhr.upload.onprogress = (e) => {
                    if (e.lengthComputable) {
                        const percent = Math.round((e.loaded / e.total) * 100);
                        progressFill.style.width = percent + "%";
                        percentLabel.innerText = percent + "%";
                    }
                };

                xhr.onload = () => {
                    if (xhr.status === 201 || xhr.status === 200) {
                        const fileData = { n: selectedFile.name, p: path, s: (selectedFile.size / (1024*1024)).toFixed(2) };
                        currentUrl = `${GIT.domain}/viewer.html?f=${btoa(JSON.stringify(fileData))}`;
                        document.getElementById('uploaderView').style.display = 'none';
                        resultArea.style.display = 'block';
                        generateQR();
                    } else {
                        alert("Upload Error!");
                        location.reload();
                    }
                };

                xhr.send(JSON.stringify({ message: "upload", content: base64, branch: GIT.branch }));
            };
        };

        function generateQR() {
            qrcodeDiv.innerHTML = '';
            QRCode.toCanvas(currentUrl, {
                width: document.getElementById('qrSize').value,
                margin: 2,
                color: { dark: '#000000', light: '#ffffff' }
            }, (err, canvas) => { qrcodeDiv.appendChild(canvas); });
        }

        document.getElementById('downloadQRBtn').onclick = () => {
            const link = document.createElement('a');
            link.download = 'qrcode.png';
            link.href = qrcodeDiv.querySelector('canvas').toDataURL();
            link.click();
        };

        document.getElementById('copyBtn').onclick = () => {
            navigator.clipboard.writeText(currentUrl);
            alert("Sharable URL Copied!");
        };
    </script>
</body>
</html>
