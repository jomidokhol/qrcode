<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="google" content="notranslate">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>bKash Payment - AutoPay Test</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+Bengali:wght@400;600;700&display=swap');

        :root {
            --skeleton-bg: #e0e0e0;
        }

        * { 
            margin: 0; 
            padding: 0; 
            box-sizing: border-box; 
            font-family: 'Noto Sans Bengali', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: #f4f6f9;
            background-image: radial-gradient(#e0e0e0 1px, transparent 1px);
            background-size: 20px 20px;
            display: flex; justify-content: center; align-items: flex-start;
            min-height: 100vh; padding-top: 20px;
        }

        .container { width: 100%; max-width: 400px; margin: 0 auto; padding-bottom: 20px; }

        .header-icons {
            display: flex; justify-content: space-between; padding: 10px 20px;
            background: white; border-radius: 8px; margin-bottom: 20px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05); align-items: center;
        }
        .header-icons span { color: #5f6368; cursor: pointer; font-size: 18px; }

        .logo-section { text-align: center; margin-bottom: 20px; }
        .logo-section img { width: 240px; }

        .white-box {
            background: white; padding: 15px 20px; border-radius: 8px; margin-bottom: 10px;
            display: flex; align-items: center; box-shadow: 0 2px 5px rgba(0,0,0,0.05);
            font-weight: 600; color: #444;
        }
        
        .pink-card {
            background-color: #d12053; color: white; padding: 20px;
            border-radius: 8px 8px 0 0; margin-top: 10px; position: relative;
        }

        .section-title { text-align: center; margin-bottom: 15px; font-size: 16px; font-weight: 600; }

        .input-group { margin-bottom: 20px; }
        .input-group input {
            width: 100%; padding: 12px; border-radius: 5px; border: none;
            font-size: 16px; outline: none; text-align: center;
        }

        .instructions { list-style: none; font-size: 13px; line-height: 1.6; }
        .instructions li { position: relative; padding-left: 15px; margin-bottom: 12px; }
        .instructions li::before { content: "•"; position: absolute; left: 0; font-weight: bold; }

        .highlight-yellow { color: #ffe600; font-weight: bold; }

        .btn-primary {
            width: 100%; background-color: #d32f2f; color: white; border: none;
            padding: 15px; font-size: 16px; font-weight: bold; border-radius: 8px;
            cursor: pointer; margin-top: 15px; box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            transition: background-color 0.3s;
        }
        .btn-primary:hover { background-color: #b71c1c; }
        .btn-primary:disabled { background-color: #e57373; cursor: not-allowed; opacity: 0.7; }

        /* Loader and Toast CSS */
        #loading-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background-color: rgba(255, 255, 255, 0.95); z-index: 10000;
            display: none; justify-content: center; align-items: center;
        }
        .loader-svg { width: 80px; height: 80px; }
        .ring { fill: none; stroke: rgba(0, 210, 255, 0.5); stroke-width: 7; stroke-linecap: round; transform-origin: center; }
        .ring-1 { stroke-dasharray: 200; stroke-dashoffset: 80; animation: spin 1.5s linear infinite; }
        .ring-2 { stroke-dasharray: 140; stroke-dashoffset: 60; animation: spin 1.2s linear infinite reverse; }
        .ring-3 { stroke-dasharray: 80; stroke-dashoffset: 40; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        /* Updated Toast CSS */
        #toast-box { position: fixed; top: 20px; left: 50%; transform: translateX(-50%); z-index: 10001; width: 90%; max-width: 400px; display: flex; flex-direction: column; align-items: center; }
        .toast {
            width: 100%; padding: 16px 20px; margin-bottom: 10px; border-radius: 4px; color: #fff;
            font-size: 16px; font-weight: 500; display: flex; align-items: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
            opacity: 0; transform: translateY(-20px);
            animation: slideDown 0.4s forwards, fadeOut 0.4s forwards 3s;
        }
        .toast-error { background-color: #c9444d; } /* bKash style red */
        .toast-success { background-color: #28a745; } /* Green */
        .toast i { margin-right: 15px; font-size: 24px; color: #ffffff; }
        @keyframes slideDown { to { transform: translateY(0); opacity: 1; } }
        @keyframes fadeOut { to { opacity: 0; visibility: hidden; } }

    </style>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>

<div id="loading-overlay">
    <svg class="loader-svg" viewBox="0 0 120 120">
        <circle class="ring ring-1" cx="60" cy="60" r="50"></circle>
        <circle class="ring ring-2" cx="60" cy="60" r="35"></circle>
        <circle class="ring ring-3" cx="60" cy="60" r="20"></circle>
    </svg>
</div>

<div id="toast-box"></div>

<!-- STEP 1: Amount Entry Screen (New Page) -->
<div class="container" id="amount-screen">
    <div class="header-icons">
        <span onclick="history.back()">&#8592;</span>
        <div style="display: flex; gap: 15px;">
            <span>অ্যামাউন্ট দিন</span>
        </div>
    </div>
    <div class="logo-section">
        <img src="https://i.ibb.co.com/1GDqN06T/5db8198b939c391189fd7be0038c16b6.png" alt="bKash Logo">
    </div>
    <div class="pink-card" style="border-radius: 8px;">
        <div class="section-title">আপনি কত টাকা পাঠাতে চান?</div>
        <div class="input-group">
            <input type="number" id="paymentAmount" placeholder="যেমন: 500" required>
        </div>
        <button class="btn-primary" onclick="goToPaymentPage()">পরবর্তী ধাপে যান</button>
    </div>
</div>

<!-- STEP 2: Main Payment Screen (Hidden by default) -->
<div class="container" id="payment-screen" style="display: none;">
    <div class="header-icons">
        <span onclick="goBackToAmount()">&#8592;</span>
        <div style="display: flex; gap: 15px;">
            <span>bKash Payment</span>
            <span onclick="history.back()">&#10005;</span>
        </div>
    </div>
    <div class="logo-section">
        <img src="https://i.ibb.co.com/1GDqN06T/5db8198b939c391189fd7be0038c16b6.png" alt="bKash Logo">
    </div>
    <div class="white-box">
        <span>bKash Pay</span>
    </div>
    <div class="white-box" id="amountDisplayBox">
        ৳ <span id="mainAmountDisplay">...</span>
    </div>
    <div class="pink-card">
        <div class="section-title">ট্রানজেকশন আইডি দিন</div>
        <div class="input-group">
            <input type="text" id="trxID" placeholder="ট্রানজেকশন আইডি (উদাঃ DBS0JQ9I4S)">
        </div>
        <ul class="instructions">
            <li>*247# ডায়াল করে অথবা bKash অ্যাপে যান।</li>
            <li>"<span class="highlight-yellow">Send Money</span>" -এ ক্লিক করুন।</li>
            <li>নম্বরঃ <span class="highlight-yellow" id="adminNumberDisplay">017XXXXXXXX</span></li>
            <li>টাকার পরিমাণঃ <span class="highlight-yellow" id="instructionAmountDisplay">...</span></li>
            <li>পেমেন্ট শেষে প্রাপ্ত <span class="highlight-yellow">Transaction ID</span> উপরে দিন এবং VERIFY করুন।</li>
        </ul>
    </div>
    <button class="btn-primary" id="verifyBtn" onclick="initiateValidation()">VERIFY</button>
</div>

<!-- Firebase SDKs -->
<script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-firestore-compat.js"></script>

<script>
    // ==========================================
    // ১. আপনার মূল ফায়ারবেইজ কনফিগারেশন (Optional, for saving orders)
    // ==========================================
    const mainFirebaseConfig = {
      apiKey: "AIzaSyCZrkWD_5YQW...",
      projectId: "topupshopnur",
      // ... অন্যান্য তথ্য
    };
    firebase.initializeApp(mainFirebaseConfig);
    const mainDb = firebase.firestore();

    // ==========================================
    // ২. নতুন ফায়ারবেইজ কনফিগারেশন (AutoPayMessages এর জন্য)
    // ==========================================
    const autoPayFirebaseConfig = {
      apiKey: "AIzaSyCFNNXY4oRMg8AjhWa9PqCN8gdILmwdRk0",
      authDomain: "autopay-api.firebaseapp.com",
      databaseURL: "https://autopay-api-default-rtdb.asia-southeast1.firebasedatabase.app",
      projectId: "autopay-api",
      storageBucket: "autopay-api.firebasestorage.app",
      messagingSenderId: "560907178391",
      appId: "1:560907178391:web:aa544aedc91be464cd74d2",
      measurementId: "G-X7D91TPCWL"
    };
    
    // নতুন অ্যাপ ইনিশিয়ালাইজ করা হচ্ছে (যাতে আগেরটার সাথে ক্ল্যাশ না করে)
    const autoPayApp = firebase.initializeApp(autoPayFirebaseConfig, "AutoPayApp");
    const autoPayDb = autoPayApp.firestore();

    let targetAmount = 0;

    // --- Page Transitions ---
    function goToPaymentPage() {
        const amountInput = document.getElementById('paymentAmount').value;
        if (!amountInput || amountInput <= 0) {
            showToast("অনুগ্রহ করে সঠিক টাকার পরিমাণ দিন", "error"); 
            return;
        }
        
        targetAmount = parseInt(amountInput); // দশমিক বাদ দিয়ে পূর্ণসংখ্যা

        // Update UI
        document.getElementById('mainAmountDisplay').innerText = targetAmount + ".00";
        document.getElementById('instructionAmountDisplay').innerText = targetAmount + ".00";
        
        // Hide amount screen, show payment screen
        document.getElementById('amount-screen').style.display = 'none';
        document.getElementById('payment-screen').style.display = 'block';
    }

    function goBackToAmount() {
        document.getElementById('payment-screen').style.display = 'none';
        document.getElementById('amount-screen').style.display = 'block';
    }

    // --- Toast Notification ---
    function showToast(message, type) {
        const toastBox = document.getElementById('toast-box');
        const toast = document.createElement('div');
        toast.classList.add('toast');
        
        // FontAwesome Icons
        let iconHtml = type === 'error' ? '<i class="fa-solid fa-shield-halved"></i>' : '<i class="fas fa-check-circle"></i>';

        toast.classList.add(type === 'error' ? 'toast-error' : 'toast-success');
        toast.innerHTML = iconHtml + message;
        toastBox.appendChild(toast);
        setTimeout(() => toast.remove(), 3500);
    }

    // --- Validation and AutoPay Checking ---
    async function initiateValidation() {
        const inputField = document.getElementById('trxID');
        const trxID = inputField.value.trim(); 

        if (trxID.length < 8 || trxID.length > 12) {
            showToast("Your transaction ID is incorrect.", "error");
            return;
        }

        const loadingOverlay = document.getElementById('loading-overlay');
        loadingOverlay.style.display = 'flex';

        try {
            // ৩. ডাটাবেজ ফিল্টারিং: 'AutoPayMessages' কালেকশন থেকে ডাটা নেওয়া হচ্ছে
            const snapshot = await autoPayDb.collection('AutoPayMessages')
                                           .where('sender', '==', 'bKash')
                                           .get();
            
            let isPaymentValid = false;
            let matchedDocId = null; // যে ডকুমেন্টে TrxID মিলবে সেটির ID সংরক্ষণ করার জন্য

            snapshot.forEach(doc => {
                const data = doc.data();
                const smsText = data.message || "";

                // শর্ত ২: TrxID খোঁজা
                const trxRegex = /TrxID[:\s]*([A-Z0-9]{10})/i;
                const trxMatch = smsText.match(trxRegex);
                const extractedTrxID = trxMatch ? trxMatch[1] : null;

                // শর্ত ৩: টাকার পরিমাণ খোঁজা
                const amountRegex = /received Tk[:\s]*(\d+)/i;
                const amountMatch = smsText.match(amountRegex);
                const extractedAmount = amountMatch ? parseInt(amountMatch[1]) : null;

                // মিল চেক করা এবং পূর্বে ব্যবহার হয়েছে কিনা (used ফিল্ড) তা চেক করা
                if (extractedTrxID === trxID && extractedAmount === targetAmount) {
                    if (data.used !== true) { // যদি আগে ব্যবহার না হয়ে থাকে
                        isPaymentValid = true;
                        matchedDocId = doc.id;
                    }
                }
            });

            if (isPaymentValid && matchedDocId) {
                // সফল হলে 'AutoPayMessages' কালেকশনের ওই ডকুমেন্টে used ফিল্ড true করে দেওয়া হচ্ছে
                await autoPayDb.collection('AutoPayMessages').doc(matchedDocId).update({
                    used: true
                });

                loadingOverlay.style.display = 'none';
                showToast("Payment successful", "success");
                
                // এখানে আপনার সাকসেস লজিক দিন (যেমন ডাটাবেজে অর্ডার সেভ করা)
                setTimeout(() => {
                    alert("Payment successful! Taking you to the next step...");
                    // processDatabaseOrder(trxID); // আপনার আগের ফাংশন কল করতে পারেন
                }, 1500);
            } else {
                loadingOverlay.style.display = 'none';
                showToast("Your transaction ID is incorrect.", "error");
            }

        } catch (error) {
            loadingOverlay.style.display = 'none';
            console.error(error);
            // কোন সার্ভার এরর হলেও এই একই ম্যাসেজ দেখাবে
            showToast("Your transaction ID is incorrect.", "error");
        }
    }
</script>

</body>
</html>
