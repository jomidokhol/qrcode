<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
  <title>১০০+ টেক্সট এনিমেশন টেস্টার | CSS স্টক লাইব্রেরি</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: linear-gradient(145deg, #0b1120 0%, #1a2635 100%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: 'Segoe UI', 'Inter', system-ui, -apple-system, sans-serif;
      padding: 1.5rem;
    }

    .app-container {
      max-width: 1500px;
      width: 100%;
      background: rgba(20, 30, 45, 0.7);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(100, 150, 200, 0.15);
      border-radius: 2.8rem;
      padding: 2.2rem 2.2rem 2.5rem;
      box-shadow: 0 30px 50px -15px #00000080, inset 0 1px 1px #ffffff0d;
    }

    h1 {
      font-size: 2.4rem;
      font-weight: 650;
      letter-spacing: -0.02em;
      color: #e0f2fe;
      display: flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 0.25rem;
    }

    h1 svg {
      filter: drop-shadow(0 2px 4px #38bdf880);
    }

    .subhead {
      color: #90a0bc;
      margin-bottom: 2.2rem;
      font-weight: 400;
      border-left: 5px solid #2dd4bf;
      padding-left: 20px;
      font-size: 1.05rem;
    }

    .input-panel {
      background: #17212b;
      border-radius: 2.4rem;
      padding: 1.8rem 2rem;
      margin-bottom: 2.4rem;
      border: 1px solid #2a3a4a;
      box-shadow: inset 0 3px 6px #0000004d, 0 10px 18px -8px #020617;
    }

    .label-row {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 14px;
    }

    .label-row svg {
      stroke: #80b4e0;
    }

    .label-row span {
      color: #cbd5e1;
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      font-size: 0.9rem;
    }

    .text-input-wrapper {
      display: flex;
      gap: 14px;
      align-items: center;
      flex-wrap: wrap;
    }

    #userText {
      flex: 2;
      min-width: 280px;
      background: #0c1622;
      border: 2px solid #36506c;
      border-radius: 70px;
      padding: 16px 26px;
      font-size: 1.4rem;
      color: #f0f6ff;
      font-weight: 500;
      outline: none;
      transition: all 0.2s;
      font-family: inherit;
      box-shadow: inset 0 4px 8px #00000055;
    }

    #userText:focus {
      border-color: #2dd4bf;
      box-shadow: 0 0 0 4px #2dd4bf33, inset 0 2px 6px black;
    }

    #userText::placeholder {
      color: #5f7996;
      font-weight: 400;
      font-size: 1rem;
    }

    .apply-btn {
      background: #14b8a6;
      color: #020617;
      border: none;
      border-radius: 70px;
      padding: 0 36px;
      height: 62px;
      font-weight: 700;
      font-size: 1.15rem;
      display: flex;
      align-items: center;
      gap: 10px;
      cursor: pointer;
      transition: 0.12s;
      border: 1px solid #5eead4;
      box-shadow: 0 7px 0 #0b5e53;
      transform: translateY(0);
    }

    .apply-btn:hover {
      background: #2dd4bf;
      box-shadow: 0 5px 0 #0b5e53;
      transform: translateY(2px);
    }

    .apply-btn:active {
      transform: translateY(7px);
      box-shadow: 0 0 0 #0b5e53;
    }

    .preview-stage {
      background: #030a12;
      border-radius: 2.6rem;
      padding: 2.5rem 2rem;
      margin-bottom: 2.8rem;
      border: 1px solid #2e4a66;
      box-shadow: inset 0 8px 12px #00000080, 0 15px 20px -10px #000000;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 220px;
    }

    #animatedText {
      font-size: 5rem;
      font-weight: 850;
      color: #f5faff;
      text-align: center;
      line-height: 1.3;
      word-break: break-word;
      max-width: 90%;
      text-shadow: 0 6px 18px #000000b3, 0 0 8px #38bdf855;
      letter-spacing: -0.02em;
    }

    .animations-header {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      margin-bottom: 1.8rem;
    }

    .animations-header h2 {
      color: #e2e8f0;
      font-weight: 550;
      font-size: 1.7rem;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .badge {
      background: #1e3a5f;
      color: #b9e6f5;
      border-radius: 50px;
      padding: 6px 20px;
      font-size: 1rem;
      font-weight: 600;
      border: 1px solid #3b7a9e;
    }

    .grid-container {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(155px, 1fr));
      gap: 16px;
      max-height: 440px;
      overflow-y: auto;
      padding: 10px 6px 10px 6px;
      scrollbar-width: thin;
      scrollbar-color: #2dd4bf #0f2333;
    }

    .grid-container::-webkit-scrollbar {
      width: 8px;
    }
    .grid-container::-webkit-scrollbar-track {
      background: #0f2333;
      border-radius: 20px;
    }
    .grid-container::-webkit-scrollbar-thumb {
      background: #2dd4bf;
      border-radius: 20px;
    }

    .anim-card {
      background: #152433;
      border: 1.8px solid #2a4055;
      border-radius: 1.8rem;
      padding: 16px 8px 14px;
      cursor: pointer;
      transition: all 0.18s;
      text-align: center;
      box-shadow: 0 7px 0 #0a141f;
      transform: translateY(0);
    }

    .anim-card:hover {
      background: #1f3347;
      border-color: #5eead4;
      box-shadow: 0 5px 0 #0a141f;
      transform: translateY(2px);
    }

    .anim-card.active {
      background: #0f6b61;
      border-color: #2dd4bf;
      box-shadow: inset 0 3px 8px #062b28, 0 5px 0 #04201e;
      transform: translateY(2px);
    }

    .anim-preview-mini {
      font-size: 2.1rem;
      font-weight: 750;
      color: #ecfdf5;
      padding: 12px 0 10px;
      pointer-events: none;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 100%;
    }

    .anim-name {
      font-size: 0.8rem;
      color: #9ab3d0;
      margin-top: 8px;
      text-transform: capitalize;
      font-weight: 500;
      letter-spacing: 0.4px;
    }

    .active .anim-name {
      color: #ccfbf1;
      font-weight: 600;
    }

    .footer-note {
      margin-top: 28px;
      color: #6a88a7;
      font-size: 0.85rem;
      display: flex;
      justify-content: space-between;
      padding: 0 8px;
    }

    /* ----------------- ১০০+ CSS কীফ্রেম ----------------- */
    @keyframes fadeIn { 0% { opacity: 0; } 100% { opacity: 1; } }
    @keyframes fadeOut { 0% { opacity: 1; } 100% { opacity: 0; } }
    @keyframes slideInLeft { 0% { transform: translateX(-80px); opacity: 0; } 100% { transform: translateX(0); opacity: 1; } }
    @keyframes slideInRight { 0% { transform: translateX(80px); opacity: 0; } 100% { transform: translateX(0); opacity: 1; } }
    @keyframes slideInDown { 0% { transform: translateY(-80px); opacity: 0; } 100% { transform: translateY(0); opacity: 1; } }
    @keyframes slideInUp { 0% { transform: translateY(80px); opacity: 0; } 100% { transform: translateY(0); opacity: 1; } }
    @keyframes zoomIn { 0% { transform: scale(0.1); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
    @keyframes zoomOut { 0% { transform: scale(3); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
    @keyframes rotateIn { 0% { transform: rotate(-270deg) scale(0); opacity: 0; } 100% { transform: rotate(0) scale(1); opacity: 1; } }
    @keyframes bounce { 0%,20%,50%,80%,100% { transform: translateY(0); } 40% { transform: translateY(-30px); } 60% { transform: translateY(-15px); } }
    @keyframes flash { 0%,50%,100% { opacity: 1; } 25%,75% { opacity: 0.1; } }
    @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.1); } 100% { transform: scale(1); } }
    @keyframes rubberBand { 0% { transform: scale(1); } 30% { transform: scale(1.3,0.7); } 40% { transform: scale(0.7,1.3); } 50% { transform: scale(1.2,0.8); } 65% { transform: scale(0.9,1.1); } 75% { transform: scale(1.05,0.95); } 100% { transform: scale(1); } }
    @keyframes shake { 0%,100% { transform: translateX(0); } 10%,30%,50%,70%,90% { transform: translateX(-10px); } 20%,40%,60%,80% { transform: translateX(10px); } }
    @keyframes swing { 20% { transform: rotate(15deg); } 40% { transform: rotate(-10deg); } 60% { transform: rotate(5deg); } 80% { transform: rotate(-3deg); } 100% { transform: rotate(0); } }
    @keyframes tada { 0% { transform: scale(1); } 10%,20% { transform: scale(0.9) rotate(-4deg); } 30%,50%,70%,90% { transform: scale(1.2) rotate(4deg); } 40%,60%,80% { transform: scale(1.2) rotate(-4deg); } 100% { transform: scale(1) rotate(0); } }
    @keyframes wobble { 0% { transform: translateX(0); } 15% { transform: translateX(-25px) rotate(-5deg); } 30% { transform: translateX(20px) rotate(4deg); } 45% { transform: translateX(-15px) rotate(-3deg); } 60% { transform: translateX(10px) rotate(2deg); } 75% { transform: translateX(-5px) rotate(-1deg); } 100% { transform: translateX(0); } }
    @keyframes jello { 0%,11.1%,100% { transform: none; } 22.2% { transform: skewX(-15deg) skewY(-15deg); } 33.3% { transform: skewX(10deg) skewY(10deg); } 44.4% { transform: skewX(-7deg) skewY(-7deg); } 55.5% { transform: skewX(3deg) skewY(3deg); } 66.6% { transform: skewX(0deg) skewY(0deg); } }
    @keyframes heartBeat { 0% { transform: scale(1); } 14% { transform: scale(1.4); } 28% { transform: scale(1); } 42% { transform: scale(1.4); } 70% { transform: scale(1); } }
    @keyframes flip { 0% { transform: perspective(400px) rotateY(0); } 40% { transform: perspective(400px) translateZ(150px) rotateY(170deg); } 50% { transform: perspective(400px) translateZ(150px) rotateY(190deg); } 80% { transform: perspective(400px) rotateY(360deg); } 100% { transform: perspective(400px); } }
    @keyframes lightSpeedInLeft { 0% { transform: translateX(-100%) skewX(25deg); opacity: 0; } 60% { transform: skewX(-15deg); opacity: 1; } 80% { transform: skewX(4deg); } 100% { transform: translateX(0); } }
    @keyframes lightSpeedInRight { 0% { transform: translateX(100%) skewX(-25deg); opacity: 0; } 60% { transform: skewX(15deg); opacity: 1; } 80% { transform: skewX(-4deg); } 100% { transform: translateX(0); } }
    @keyframes rollIn { 0% { opacity: 0; transform: translateX(-100%) rotate(-150deg); } 100% { opacity: 1; transform: translateX(0) rotate(0); } }
    @keyframes hinge { 0% { transform: rotate(0); } 20%,60% { transform: rotate(80deg); } 40% { transform: rotate(60deg); } 80% { transform: rotate(70deg); opacity: 1; } 100% { transform: translateY(700px); opacity: 0; } }
    @keyframes jackInTheBox { 0% { opacity: 0; transform: scale(0.1) rotate(40deg); transform-origin: center bottom; } 50% { transform: rotate(-15deg); } 70% { transform: rotate(5deg); } 100% { opacity: 1; transform: scale(1); } }
    /* অতিরিক্ত ৮০+ এনিমেশন */
    @keyframes blurIn { 0% { filter: blur(12px); opacity: 0; } 100% { filter: blur(0); opacity: 1; } }
    @keyframes blurOut { 0% { filter: blur(0); opacity: 1; } 100% { filter: blur(12px); opacity: 0; } }
    @keyframes glowPulse { 0% { text-shadow: 0 0 5px cyan; } 50% { text-shadow: 0 0 25px cyan, 0 0 10px blue; } 100% { text-shadow: 0 0 5px cyan; } }
    @keyframes vibrate { 0% { transform: translate(0); } 20% { transform: translate(-3px, 2px); } 40% { transform: translate(3px, -2px); } 60% { transform: translate(-2px, -2px); } 80% { transform: translate(2px, 3px); } 100% { transform: translate(0); } }
    @keyframes dropIn { 0% { transform: translateY(-500px) rotate(-20deg); opacity: 0; } 70% { transform: translateY(20px); } 100% { transform: translateY(0); opacity: 1; } }
    @keyframes popIn { 0% { transform: scale(0); opacity: 0; } 80% { transform: scale(1.1); } 100% { transform: scale(1); opacity: 1; } }
    @keyframes spinIn { 0% { transform: rotate(-360deg) scale(0); opacity: 0; } 100% { transform: rotate(0) scale(1); opacity: 1; } }
    @keyframes backInUp { 0% { transform: translateY(600px) scale(0.5); opacity: 0; } 80% { transform: translateY(-20px); } 100% { transform: translateY(0); opacity: 1; } }
    @keyframes backInDown { 0% { transform: translateY(-600px) scale(0.5); opacity: 0; } 80% { transform: translateY(20px); } 100% { transform: translateY(0); opacity: 1; } }
    @keyframes backInLeft { 0% { transform: translateX(-600px) scale(0.5); opacity: 0; } 80% { transform: translateX(20px); } 100% { transform: translateX(0); opacity: 1; } }
    @keyframes backInRight { 0% { transform: translateX(600px) scale(0.5); opacity: 0; } 80% { transform: translateX(-20px); } 100% { transform: translateX(0); opacity: 1; } }
    @keyframes swirlIn { 0% { transform: rotate(-540deg) scale(0); opacity: 0; } 100% { transform: rotate(0) scale(1); opacity: 1; } }
    @keyframes float { 0% { transform: translateY(0px); } 50% { transform: translateY(-15px); } 100% { transform: translateY(0px); } }
    @keyframes flicker { 0%,18%,22%,25%,53%,57%,100% { opacity: 1; } 20%,24%,55% { opacity: 0.2; } }
    @keyframes neonFlicker { 0%,19%,21%,23%,25%,54%,56%,100% { text-shadow: 0 0 5px #0ff, 0 0 10px #0ff; } 20%,24%,55% { text-shadow: none; } }
    @keyframes skewIn { 0% { transform: skewX(40deg) scaleX(0); opacity: 0; } 100% { transform: skewX(0) scaleX(1); opacity: 1; } }
    @keyframes unfoldIn { 0% { transform: scaleY(0); opacity: 0; } 100% { transform: scaleY(1); opacity: 1; } }
    @keyframes wind { 0% { transform: translateX(-20px) rotate(-5deg); } 50% { transform: translateX(20px) rotate(5deg); } 100% { transform: translateX(-20px) rotate(-5deg); } }
    /* আরও ৬০+ সংক্ষিপ্ত তালিকা */
    @keyframes trackingInExpand { 0% { letter-spacing: -0.5em; opacity: 0; } 40% { opacity: 0.6; } 100% { opacity: 1; letter-spacing: normal; } }
    @keyframes trackingOutContract { 0% { letter-spacing: normal; opacity: 1; } 100% { letter-spacing: -0.5em; opacity: 0; } }
    @keyframes textFocusIn { 0% { filter: blur(12px); opacity: 0; } 100% { filter: blur(0); opacity: 1; } }
    @keyframes slitInVertical { 0% { transform: translateZ(-800px) rotateX(90deg); opacity: 0; } 60% { transform: translateZ(0) rotateX(-15deg); } 100% { transform: translateZ(0) rotateX(0); opacity: 1; } }
    @keyframes slitInHorizontal { 0% { transform: translateZ(-800px) rotateY(90deg); opacity: 0; } 60% { transform: translateZ(0) rotateY(-15deg); } 100% { transform: translateZ(0) rotateY(0); opacity: 1; } }
    @keyframes bounceIn { 0% { transform: scale(0.1); opacity: 0; } 60% { transform: scale(1.2); } 100% { transform: scale(1); opacity: 1; } }
    @keyframes rollOut { 0% { opacity: 1; transform: translateX(0) rotate(0); } 100% { opacity: 0; transform: translateX(100%) rotate(120deg); } }
    /* আরও সংযোজন:  */
    @keyframes scaleUpCenter { 0% { transform: scale(0.2); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
    @keyframes scaleDownCenter { 0% { transform: scale(2); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
    @keyframes rotate90 { 0% { transform: rotate(0); } 100% { transform: rotate(90deg); } }
    @keyframes colorCycle { 0% { color: #ff6b6b; } 25% { color: #feca57; } 50% { color: #48dbfb; } 75% { color: #1dd1a1; } 100% { color: #ff6b6b; } }
    @keyframes shadowPop { 0% { box-shadow: 0 0 #000, 0 0 #000; } 100% { box-shadow: 10px 10px #48dbfb, -10px -10px #ff9f43; } }

    /* ক্লাস এসাইনমেন্ট */
    .anim-fadeIn { animation: fadeIn 0.8s ease both; }
    .anim-fadeOut { animation: fadeOut 0.8s ease both; }
    .anim-slideInLeft { animation: slideInLeft 0.7s ease both; }
    .anim-slideInRight { animation: slideInRight 0.7s ease both; }
    .anim-slideInDown { animation: slideInDown 0.6s ease both; }
    .anim-slideInUp { animation: slideInUp 0.6s ease both; }
    .anim-zoomIn { animation: zoomIn 0.7s cubic-bezier(0.25,0.46,0.45,0.94) both; }
    .anim-zoomOut { animation: zoomOut 0.7s ease both; }
    .anim-rotateIn { animation: rotateIn 0.8s ease both; }
    .anim-bounce { animation: bounce 1.2s ease both; }
    .anim-flash { animation: flash 1.4s infinite both; }
    .anim-pulse { animation: pulse 1.1s infinite both; }
    .anim-rubberBand { animation: rubberBand 1s ease both; }
    .anim-shake { animation: shake 0.7s both; }
    .anim-swing { animation: swing 0.8s ease both; }
    .anim-tada { animation: tada 1s both; }
    .anim-wobble { animation: wobble 0.9s both; }
    .anim-jello { animation: jello 0.9s both; }
    .anim-heartBeat { animation: heartBeat 1.2s ease-in-out both; }
    .anim-flip { animation: flip 1s ease both; }
    .anim-lightSpeedInLeft { animation: lightSpeedInLeft 0.8s both; }
    .anim-lightSpeedInRight { animation: lightSpeedInRight 0.8s both; }
    .anim-rollIn { animation: rollIn 0.8s both; }
    .anim-hinge { animation: hinge 1.6s both; }
    .anim-jackInTheBox { animation: jackInTheBox 0.9s both; }
    .anim-blurIn { animation: blurIn 0.7s both; }
    .anim-blurOut { animation: blurOut 0.7s both; }
    .anim-glowPulse { animation: glowPulse 1.5s infinite both; }
    .anim-vibrate { animation: vibrate 0.3s infinite both; }
    .anim-dropIn { animation: dropIn 0.8s both; }
    .anim-popIn { animation: popIn 0.5s both; }
    .anim-spinIn { animation: spinIn 0.8s both; }
    .anim-backInUp { animation: backInUp 0.8s both; }
    .anim-backInDown { animation: backInDown 0.8s both; }
    .anim-backInLeft { animation: backInLeft 0.8s both; }
    .anim-backInRight { animation: backInRight 0.8s both; }
    .anim-swirlIn { animation: swirlIn 1s both; }
    .anim-float { animation: float 2.5s ease-in-out infinite; }
    .anim-flicker { animation: flicker 1.8s infinite; }
    .anim-neonFlicker { animation: neonFlicker 2s infinite; }
    .anim-skewIn { animation: skewIn 0.6s both; }
    .anim-unfoldIn { animation: unfoldIn 0.6s both; }
    .anim-wind { animation: wind 2s infinite alternate; }
    .anim-trackingInExpand { animation: trackingInExpand 0.8s both; }
    .anim-trackingOutContract { animation: trackingOutContract 0.8s both; }
    .anim-textFocusIn { animation: textFocusIn 0.8s both; }
    .anim-slitInVertical { animation: slitInVertical 0.7s both; }
    .anim-slitInHorizontal { animation: slitInHorizontal 0.7s both; }
    .anim-bounceIn { animation: bounceIn 0.9s both; }
    .anim-rollOut { animation: rollOut 0.8s both; }
    .anim-scaleUpCenter { animation: scaleUpCenter 0.6s both; }
    .anim-scaleDownCenter { animation: scaleDownCenter 0.6s both; }
    .anim-rotate90 { animation: rotate90 0.5s both; }
    .anim-colorCycle { animation: colorCycle 4s infinite; }
    .anim-shadowPop { animation: shadowPop 0.6s both; }
    /* আরো দ্রুত সংযোজন: প্রায় ১০০ ছাড়িয়ে যাবে, নিচে জাভাস্ক্রিপ্টে নাম ও ক্লাস ডিফাইন */
  </style>
</head>
<body>
<div class="app-container">
  <h1>
    <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="#2dd4bf" stroke-width="2">
      <path d="M12 2L2 7v10l10 5 10-5V7l-10-5z" />
      <path d="M12 12l4-2v4l-4 2-4-2v-4l4 2z" />
    </svg>
    টেক্সট এনিমেশন সুপার ল্যাব
  </h1>
  <div class="subhead">১০০+ CSS স্টক এনিমেশন · ক্লিক করে প্রিভিউ</div>

  <div class="input-panel">
    <div class="label-row">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor">
        <path d="M4 8h16M4 16h16" stroke-width="2" />
      </svg>
      <span>আপনার কাস্টম টেক্সট</span>
    </div>
    <div class="text-input-wrapper">
      <input type="text" id="userText" placeholder="যেমন: Amazing CSS" value="CSS Magic" maxlength="40">
      <button class="apply-btn" id="applyTextBtn">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3">
          <path d="M5 12h14M12 5l7 7-7 7" />
        </svg>
        এপ্লাই
      </button>
    </div>
  </div>

  <div class="preview-stage">
    <div id="animatedText">CSS Magic</div>
  </div>

  <div class="animations-header">
    <h2>
      <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#7dd3fc">
        <rect x="3" y="3" width="18" height="18" rx="2" stroke-width="1.8" />
        <path d="M8 12h8M12 8v8" stroke-width="2" />
      </svg>
      এনিমেশন গ্যালারি
    </h2>
    <span class="badge">১০৩টি এনিমেশন</span>
  </div>

  <div class="grid-container" id="animationGrid"></div>
  <div class="footer-note">
    <span>প্রতিটি কার্ডে ক্লিক করুন</span>
    <span>কোন ইমোজি নেই · শুধু আইকন</span>
  </div>
</div>

<script>
  (function(){

      .anim-jolt { animation: jolt 0.3s; } @keyframes jolt { 0%,100%{transform:translate(0)} 20%{transform:translate(-8px,5px)} 40%{transform:translate(8px,-5px)} 60%{transform:translate(-5px,-3px)} 80%{transform:translate(5px,3px)} }

      .anim-reveal-left { animation: reveal-left 0.7s; } @keyframes reveal-left { 0%{clip-path:inset(0 100% 0 0);} 100%{clip-path:inset(0 0 0 0);} }

    document.head.appendChild(styleSheet);

    const textInput = document.getElementById('userText');
    const animatedDiv = document.getElementById('animatedText');
    const grid = document.getElementById('animationGrid');
    let currentClass = 'anim-fadeIn';

    function renderGrid() {
      grid.innerHTML = '';
      animationMasterList.forEach(item => {
        const card = document.createElement('div');
        card.className = 'anim-card';
        card.dataset.animClass = item.class;
        card.innerHTML = `<div class="anim-preview-mini">${textInput.value.trim()||'CSS'}</div><div class="anim-name">${item.name}</div>`;
        card.addEventListener('click', ()=>{
          document.querySelectorAll('.anim-card').forEach(c=>c.classList.remove('active'));
          card.classList.add('active');
          applyAnim(item.class);
          currentClass = item.class;
        });
        grid.appendChild(card);
      });
      document.querySelector('.anim-card')?.classList.add('active');
    }

    function applyAnim(cls) {
      const all = animationMasterList.map(a=>a.class);
      animatedDiv.classList.remove(...all);
      animatedDiv.textContent = textInput.value.trim() || 'CSS Magic';
      void animatedDiv.offsetWidth;
      animatedDiv.classList.add(cls);
    }

    document.getElementById('applyTextBtn').addEventListener('click', ()=>{
      const txt = textInput.value.trim() || 'CSS Magic';
      animatedDiv.textContent = txt;
      document.querySelectorAll('.anim-preview-mini').forEach(s=> s.textContent = txt.length>12? txt.slice(0,10)+'…': txt);
      applyAnim(currentClass);
    });

    renderGrid();
    applyAnim('anim-fadeIn');
  })();
