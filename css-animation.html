<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
  <title>CSS Animation Test - One Tool</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: linear-gradient(145deg, #0f172a 0%, #1e293b 100%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: 'Segoe UI', 'Inter', system-ui, -apple-system, sans-serif;
      padding: 1.5rem;
    }

    .app-container {
      max-width: 1400px;
      width: 100%;
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 2.5rem;
      padding: 2rem 2rem 2.2rem;
      box-shadow: 0 25px 40px -10px rgba(0, 0, 0, 0.5);
    }

    h1 {
      font-size: 2.2rem;
      font-weight: 600;
      letter-spacing: -0.01em;
      color: #e2e8f0;
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 0.25rem;
    }

    h1 svg {
      opacity: 0.9;
    }

    .subhead {
      color: #94a3b8;
      margin-bottom: 2rem;
      font-weight: 400;
      border-left: 4px solid #38bdf8;
      padding-left: 18px;
      font-size: 1rem;
    }

    /* ইনপুট এরিয়া */
    .input-panel {
      background: #1e293b;
      border-radius: 2rem;
      padding: 1.5rem 1.8rem;
      margin-bottom: 2.2rem;
      border: 1px solid #334155;
      box-shadow: inset 0 2px 3px rgba(0,0,0,0.3), 0 8px 12px -4px #0f172a;
    }

    .label-row {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 12px;
    }

    .label-row svg {
      stroke: #94a3b8;
    }

    .label-row span {
      color: #cbd5e1;
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 1px;
      font-size: 0.85rem;
    }

    .text-input-wrapper {
      display: flex;
      gap: 12px;
      align-items: center;
      flex-wrap: wrap;
    }

    #userText {
      flex: 2;
      min-width: 260px;
      background: #0f172a;
      border: 1.5px solid #475569;
      border-radius: 60px;
      padding: 16px 24px;
      font-size: 1.3rem;
      color: #f1f5f9;
      font-weight: 500;
      outline: none;
      transition: all 0.2s;
      font-family: inherit;
    }

    #userText:focus {
      border-color: #38bdf8;
      box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.2);
    }

    #userText::placeholder {
      color: #64748b;
      font-weight: 400;
      font-size: 1rem;
    }

    .apply-btn {
      background: #2dd4bf;
      color: #0f172a;
      border: none;
      border-radius: 60px;
      padding: 0 32px;
      height: 58px;
      font-weight: 700;
      font-size: 1.1rem;
      display: flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      transition: 0.15s;
      border: 1px solid #5eead4;
      box-shadow: 0 6px 0 #0f766e;
      transform: translateY(0);
    }

    .apply-btn:hover {
      background: #5eead4;
      box-shadow: 0 4px 0 #0f766e;
      transform: translateY(2px);
    }

    .apply-btn:active {
      transform: translateY(6px);
      box-shadow: 0 0 0 #0f766e;
    }

    /* প্রিভিউ এরিয়া */
    .preview-stage {
      background: #0b1120;
      border-radius: 2rem;
      padding: 2.2rem 1.5rem;
      margin-bottom: 2.8rem;
      border: 1px solid #334155;
      box-shadow: inset 0 6px 8px rgba(0,0,0,0.5), 0 10px 15px -5px #020617;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 200px;
      transition: background 0.2s;
    }

    #animatedText {
      font-size: 4.5rem;
      font-weight: 800;
      color: #f8fafc;
      text-align: center;
      line-height: 1.3;
      word-break: break-word;
      max-width: 90%;
      text-shadow: 0 4px 12px rgba(0,0,0,0.6);
      letter-spacing: -0.02em;
      transition: all 0.1s ease;
    }

    /* এনিমেশন গ্রিড */
    .animations-header {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      margin-bottom: 1.5rem;
    }

    .animations-header h2 {
      color: #e2e8f0;
      font-weight: 500;
      font-size: 1.5rem;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .badge {
      background: #334155;
      color: #a5f3fc;
      border-radius: 40px;
      padding: 4px 14px;
      font-size: 0.9rem;
      font-weight: 600;
    }

    .grid-container {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
      gap: 14px;
      max-height: 380px;
      overflow-y: auto;
      padding: 8px 4px 8px 4px;
      scrollbar-width: thin;
      scrollbar-color: #38bdf8 #1e293b;
    }

    .grid-container::-webkit-scrollbar {
      width: 6px;
    }
    .grid-container::-webkit-scrollbar-track {
      background: #1e293b;
      border-radius: 10px;
    }
    .grid-container::-webkit-scrollbar-thumb {
      background: #38bdf8;
      border-radius: 10px;
    }

    /* এনিমেশন কার্ড */
    .anim-card {
      background: #1e293b;
      border: 1.5px solid #334155;
      border-radius: 1.5rem;
      padding: 16px 8px 12px;
      cursor: pointer;
      transition: all 0.15s;
      text-align: center;
      box-shadow: 0 6px 0 #0f172a;
      transform: translateY(0);
    }

    .anim-card:hover {
      background: #2d3a52;
      border-color: #5eead4;
      box-shadow: 0 4px 0 #0f172a;
      transform: translateY(2px);
    }

    .anim-card.active {
      background: #0f766e;
      border-color: #2dd4bf;
      box-shadow: inset 0 2px 6px #134e4a, 0 4px 0 #042f2e;
      transform: translateY(2px);
    }

    .anim-preview-mini {
      font-size: 2rem;
      font-weight: 700;
      color: #f1f5f9;
      padding: 12px 0 8px;
      pointer-events: none;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 100%;
    }

    .anim-name {
      font-size: 0.85rem;
      color: #94a3b8;
      margin-top: 6px;
      text-transform: capitalize;
      font-weight: 500;
      letter-spacing: 0.3px;
    }

    .active .anim-name {
      color: #ccfbf1;
    }

    /* ফুটার */
    .footer-note {
      margin-top: 24px;
      color: #64748b;
      font-size: 0.8rem;
      display: flex;
      justify-content: flex-end;
      gap: 24px;
    }

    /* ইউটিলিটি */
    .flex-center {
      display: flex;
      align-items: center;
    }

    .gap-2 { gap: 8px; }
    .mt-4 { margin-top: 1.5rem; }

    /* সকল CSS এনিমেশন কীফ্রেম — এক্সটেন্সিভ কালেকশন */
    @keyframes fadeIn { 0% { opacity: 0; } 100% { opacity: 1; } }
    @keyframes fadeOut { 0% { opacity: 1; } 100% { opacity: 0; } }
    @keyframes slideInLeft { 0% { transform: translateX(-60px); opacity: 0; } 100% { transform: translateX(0); opacity: 1; } }
    @keyframes slideInRight { 0% { transform: translateX(60px); opacity: 0; } 100% { transform: translateX(0); opacity: 1; } }
    @keyframes slideInDown { 0% { transform: translateY(-60px); opacity: 0; } 100% { transform: translateY(0); opacity: 1; } }
    @keyframes slideInUp { 0% { transform: translateY(60px); opacity: 0; } 100% { transform: translateY(0); opacity: 1; } }
    @keyframes zoomIn { 0% { transform: scale(0.2); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
    @keyframes zoomOut { 0% { transform: scale(2.5); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
    @keyframes rotateIn { 0% { transform: rotate(-180deg) scale(0.3); opacity: 0; } 100% { transform: rotate(0) scale(1); opacity: 1; } }
    @keyframes bounce { 0%,20%,50%,80%,100% { transform: translateY(0); } 40% { transform: translateY(-25px); } 60% { transform: translateY(-12px); } }
    @keyframes flash { 0%,50%,100% { opacity: 1; } 25%,75% { opacity: 0.2; } }
    @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.08); } 100% { transform: scale(1); } }
    @keyframes rubberBand { 0% { transform: scale(1); } 30% { transform: scale(1.25,0.75); } 40% { transform: scale(0.75,1.25); } 50% { transform: scale(1.15,0.85); } 65% { transform: scale(0.95,1.05); } 75% { transform: scale(1.05,0.95); } 100% { transform: scale(1); } }
    @keyframes shake { 0%,100% { transform: translateX(0); } 10%,30%,50%,70%,90% { transform: translateX(-8px); } 20%,40%,60%,80% { transform: translateX(8px); } }
    @keyframes swing { 20% { transform: rotate(12deg); } 40% { transform: rotate(-8deg); } 60% { transform: rotate(5deg); } 80% { transform: rotate(-3deg); } 100% { transform: rotate(0); } }
    @keyframes tada { 0% { transform: scale(1); } 10%,20% { transform: scale(0.9) rotate(-3deg); } 30%,50%,70%,90% { transform: scale(1.1) rotate(3deg); } 40%,60%,80% { transform: scale(1.1) rotate(-3deg); } 100% { transform: scale(1) rotate(0); } }
    @keyframes wobble { 0% { transform: translateX(0); } 15% { transform: translateX(-20px) rotate(-4deg); } 30% { transform: translateX(16px) rotate(3deg); } 45% { transform: translateX(-12px) rotate(-2deg); } 60% { transform: translateX(8px) rotate(1deg); } 75% { transform: translateX(-4px) rotate(-0.5deg); } 100% { transform: translateX(0); } }
    @keyframes jello { 0%,11.1%,100% { transform: none; } 22.2% { transform: skewX(-12deg) skewY(-12deg); } 33.3% { transform: skewX(8deg) skewY(8deg); } 44.4% { transform: skewX(-5deg) skewY(-5deg); } 55.5% { transform: skewX(2deg) skewY(2deg); } 66.6% { transform: skewX(0deg) skewY(0deg); } }
    @keyframes heartBeat { 0% { transform: scale(1); } 14% { transform: scale(1.3); } 28% { transform: scale(1); } 42% { transform: scale(1.3); } 70% { transform: scale(1); } }
    @keyframes flip { 0% { transform: perspective(400px) rotateY(0); animation-timing-function: ease-out; } 40% { transform: perspective(400px) translateZ(150px) rotateY(170deg); } 50% { transform: perspective(400px) translateZ(150px) rotateY(190deg) scale(1); } 80% { transform: perspective(400px) rotateY(360deg) scale(0.95); } 100% { transform: perspective(400px) scale(1); } }
    @keyframes lightSpeedInLeft { 0% { transform: translateX(-100%) skewX(20deg); opacity: 0; } 60% { transform: skewX(-15deg); opacity: 1; } 80% { transform: skewX(4deg); } 100% { transform: translateX(0); } }
    @keyframes lightSpeedInRight { 0% { transform: translateX(100%) skewX(-20deg); opacity: 0; } 60% { transform: skewX(15deg); opacity: 1; } 80% { transform: skewX(-4deg); } 100% { transform: translateX(0); } }
    @keyframes rollIn { 0% { opacity: 0; transform: translateX(-100%) rotate(-120deg); } 100% { opacity: 1; transform: translateX(0) rotate(0); } }
    @keyframes hinge { 0% { transform: rotate(0); } 20%,60% { transform: rotate(70deg); } 40% { transform: rotate(50deg); } 80% { transform: rotate(60deg); opacity: 1; } 100% { transform: translateY(600px); opacity: 0; } }
    @keyframes jackInTheBox { 0% { opacity: 0; transform: scale(0.1) rotate(30deg); transform-origin: center bottom; } 50% { transform: rotate(-10deg); } 70% { transform: rotate(3deg); } 100% { opacity: 1; transform: scale(1); } }

    /* এনিমেশন ক্লাস */
    .anim-fadeIn { animation: fadeIn 1s ease both; }
    .anim-fadeOut { animation: fadeOut 1s ease both; }
    .anim-slideInLeft { animation: slideInLeft 0.8s ease both; }
    .anim-slideInRight { animation: slideInRight 0.8s ease both; }
    .anim-slideInDown { animation: slideInDown 0.7s ease both; }
    .anim-slideInUp { animation: slideInUp 0.7s ease both; }
    .anim-zoomIn { animation: zoomIn 0.8s cubic-bezier(0.18, 0.89, 0.32, 1.28) both; }
    .anim-zoomOut { animation: zoomOut 0.7s ease both; }
    .anim-rotateIn { animation: rotateIn 0.9s ease both; }
    .anim-bounce { animation: bounce 1.2s ease both; }
    .anim-flash { animation: flash 1.5s infinite both; }
    .anim-pulse { animation: pulse 1.2s ease-in-out infinite both; }
    .anim-rubberBand { animation: rubberBand 1s ease both; }
    .anim-shake { animation: shake 0.8s ease both; }
    .anim-swing { animation: swing 0.9s ease both; }
    .anim-tada { animation: tada 1.2s ease both; }
    .anim-wobble { animation: wobble 1s ease both; }
    .anim-jello { animation: jello 1s ease both; }
    .anim-heartBeat { animation: heartBeat 1.3s ease-in-out both; }
    .anim-flip { animation: flip 1.2s ease both; }
    .anim-lightSpeedInLeft { animation: lightSpeedInLeft 0.9s ease-out both; }
    .anim-lightSpeedInRight { animation: lightSpeedInRight 0.9s ease-out both; }
    .anim-rollIn { animation: rollIn 0.9s ease both; }
    .anim-hinge { animation: hinge 1.8s ease both; }
    .anim-jackInTheBox { animation: jackInTheBox 1s ease both; }
  </style>
</head>
<body>
<div class="app-container">
  
  <h1>
    <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="#2dd4bf" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <path d="M4 8V6a2 2 0 0 1 2-2h2" />
      <path d="M4 16v2a2 2 0 0 0 2 2h2" />
      <path d="M16 4h2a2 2 0 0 1 2 2v2" />
      <path d="M16 20h2a2 2 0 0 0 2-2v-2" />
      <rect x="3" y="9" width="18" height="6" rx="1" />
    </svg>
    টেক্সট এনিমেশন ল্যাব
  </h1>
  <div class="subhead">স্টক CSS এনিমেশন · প্রিভিউ সহ নির্বাচন করুন</div>

  <div class="input-panel">
    <div class="label-row">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M4 7h16M4 12h16M4 17h10" />
      </svg>
      <span>আপনার টেক্সট লিখুন</span>
    </div>
    <div class="text-input-wrapper">
      <input type="text" id="userText" placeholder="যেমন: বাংলাদেশ" value="Hello বিশ্ব" maxlength="35" autocomplete="off">
      <button class="apply-btn" id="applyTextBtn">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
          <path d="M20 6L9 17l-5-5" />
        </svg>
        আপডেট
      </button>
    </div>
  </div>

  <!-- লাইভ প্রিভিউ -->
  <div class="preview-stage">
    <div id="animatedText">Hello বিশ্ব</div>
  </div>

  <!-- এনিমেশন গ্রিড -->
  <div class="animations-header">
    <h2>
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#a5f3fc" stroke-width="1.8">
        <circle cx="12" cy="12" r="10" />
        <path d="M12 6v6l4 2" />
      </svg>
      স্টক এনিমেশন লাইব্রেরি
    </h2>
    <span class="badge">২৫+ CSS এনিমেশন</span>
  </div>

  <div class="grid-container" id="animationGrid"></div>

  <div class="footer-note">
    <span>ক্লিক করলেই প্রিভিউ</span>
    <span>সিঙ্গেল ফাইল · আইকন বেসড</span>
  </div>
</div>

<script>
  (function() {
    "use strict";

    // ---------- এনিমেশন ডেটা (নাম + CSS ক্লাস) ----------
    const animationList = [
      { name: "Fade In", class: "anim-fadeIn" },
      { name: "Fade Out", class: "anim-fadeOut" },
      { name: "Slide Left", class: "anim-slideInLeft" },
      { name: "Slide Right", class: "anim-slideInRight" },
      { name: "Slide Down", class: "anim-slideInDown" },
      { name: "Slide Up", class: "anim-slideInUp" },
      { name: "Zoom In", class: "anim-zoomIn" },
      { name: "Zoom Out", class: "anim-zoomOut" },
      { name: "Rotate In", class: "anim-rotateIn" },
      { name: "Bounce", class: "anim-bounce" },
      { name: "Flash", class: "anim-flash" },
      { name: "Pulse", class: "anim-pulse" },
      { name: "Rubber Band", class: "anim-rubberBand" },
      { name: "Shake", class: "anim-shake" },
      { name: "Swing", class: "anim-swing" },
      { name: "Tada", class: "anim-tada" },
      { name: "Wobble", class: "anim-wobble" },
      { name: "Jello", class: "anim-jello" },
      { name: "Heart Beat", class: "anim-heartBeat" },
      { name: "Flip", class: "anim-flip" },
      { name: "Light Speed Left", class: "anim-lightSpeedInLeft" },
      { name: "Light Speed Right", class: "anim-lightSpeedInRight" },
      { name: "Roll In", class: "anim-rollIn" },
      { name: "Hinge", class: "anim-hinge" },
      { name: "Jack In The Box", class: "anim-jackInTheBox" }
    ];

    // DOM elements
    const textInput = document.getElementById('userText');
    const animatedTextDiv = document.getElementById('animatedText');
    const applyBtn = document.getElementById('applyTextBtn');
    const gridContainer = document.getElementById('animationGrid');

    let currentAnimationClass = 'anim-fadeIn';   // default
    let activeCard = null;

    // ---------- রেন্ডার গ্রিড ----------
    function renderGrid() {
      gridContainer.innerHTML = '';
      animationList.forEach((anim) => {
        const card = document.createElement('div');
        card.className = 'anim-card';
        card.dataset.animClass = anim.class;

        // মিনি প্রিভিউ এলিমেন্ট (কার্ডের ভেতর)
        const previewSpan = document.createElement('div');
        previewSpan.className = 'anim-preview-mini';
        // ছোট্ট টেক্সট — ইউজার টেক্সট বা ডিফল্ট
        previewSpan.textContent = textInput.value.trim() || 'Text';
        
        const nameSpan = document.createElement('div');
        nameSpan.className = 'anim-name';
        nameSpan.textContent = anim.name;

        card.appendChild(previewSpan);
        card.appendChild(nameSpan);

        // ইভেন্ট: কার্ডে ক্লিক করলে এনিমেশন সেট
        card.addEventListener('click', (e) => {
          const clickedCard = e.currentTarget;
          const animClass = clickedCard.dataset.animClass;
          
          // আগের অ্যাক্টিভ ক্লাস সরান
          if (activeCard) {
            activeCard.classList.remove('active');
          }
          clickedCard.classList.add('active');
          activeCard = clickedCard;
          
          // প্রিভিউ টেক্সট এ এনিমেশন এপ্লাই
          applyAnimationToPreview(animClass);
          currentAnimationClass = animClass;
        });

        gridContainer.appendChild(card);
      });

      // প্রথম কার্ডটি ডিফল্ট এক্টিভ সেট (fadeIn)
      const defaultCard = Array.from(document.querySelectorAll('.anim-card')).find(
        card => card.dataset.animClass === 'anim-fadeIn'
      );
      if (defaultCard) {
        defaultCard.classList.add('active');
        activeCard = defaultCard;
        applyAnimationToPreview('anim-fadeIn');
        currentAnimationClass = 'anim-fadeIn';
      }
    }

    // ---------- এনিমেশন রি-ট্রিগার হেল্পার ----------
    function applyAnimationToPreview(animationClass) {
      const el = animatedTextDiv;
      
      // অ্যানিমেশন ক্লাস রিমুভ করে আবার এড (রি-ট্রিগার)
      // প্রথমে সব এনিমেশন ক্লাস সরাই
      const allAnimClasses = animationList.map(a => a.class);
      el.classList.remove(...allAnimClasses);
      
      // টেক্সট আপডেট (ইনপুট থেকে)
      const newText = textInput.value.trim();
      el.textContent = newText === '' ? 'Hello বিশ্ব' : newText;
      
      // রি-ফ্লো ট্রিগার (ছোট ট্রিক)
      void el.offsetWidth;
      
      // নতুন এনিমেশন ক্লাস যোগ
      el.classList.add(animationClass);
      
      // যদি hinge / fadeOut মত ক্লাস শেষে অপাসিটি 0 করে, সেটা পরে রিসেট করতে হবে?
      // তবে আমরা ইউজারকে আবার ক্লিক করতে দিব। hinge শেষে অদৃশ্য হলে পরবর্তী ক্লিকে আবার ভিজিবল হবে।
      // আমরা কিছু ক্লাসের জন্য শেষ অবস্থা ঠিক রাখতে পারি, কিন্তু সব ক্লাস "both" fill mode এ আছে।
    }

    // টেক্সট আপডেট + একই এনিমেশন রিফ্রেশ
    function updateTextAndReapplyAnimation() {
      const rawText = textInput.value.trim();
      const displayText = rawText === '' ? 'Hello বিশ্ব' : rawText;
      
      animatedTextDiv.textContent = displayText;
      
      // ছোট কার্ডগুলোর মিনি টেক্সট আপডেট
      const miniPreviews = document.querySelectorAll('.anim-preview-mini');
      miniPreviews.forEach(span => {
        span.textContent = displayText.length > 12 ? displayText.substring(0,10)+'…' : displayText;
      });
      
      // বর্তমান এনিমেশন রি-এপ্লাই
      const allClasses = animationList.map(a => a.class);
      animatedTextDiv.classList.remove(...allClasses);
      void animatedTextDiv.offsetWidth;
      animatedTextDiv.classList.add(currentAnimationClass);
    }

    // ---------- ইভেন্ট লিসেনার ----------
    applyBtn.addEventListener('click', () => {
      updateTextAndReapplyAnimation();
    });

    // এন্টার প্রেসেও আপডেট
    textInput.addEventListener('keypress', (e) => {
      if (e.key === 'Enter') {
        e.preventDefault();
        updateTextAndReapplyAnimation();
      }
    });

    // ইনিশিয়ালাইজ
    renderGrid();

    // শুরুতে একবার টেক্সট সিঙ্ক
    (function initializeText() {
      const initText = textInput.value.trim() || 'Hello বিশ্ব';
      animatedTextDiv.textContent = initText;
      const miniSpans = document.querySelectorAll('.anim-preview-mini');
      miniSpans.forEach(s => s.textContent = initText);
    })();

    // hinge এনিমেশন শেষে অপাসিটি 0 হয়ে যায়, কিন্তু আমরা যখন অন্য এনিমেশন সিলেক্ট করি তখন
    // ক্লাস রিমুভ হয় এবং আবার অপাসিটি 1 হয়ে যায় (কারণ রিমুভ হলে ইনলাইন কিছু নেই)।
    // অতিরিক্ত সুরক্ষা: animationend ইভেন্টে hinge এর পরে ফোর্স রিসেট করব না,
    // কারণ পরবর্তী এনিমেশন নিজেই স্বাভাবিক করবে।

    // তবে hinge চলাকালীন ইউজার অপর এনিমেশন সিলেক্ট করলে, পুরনো ক্লাস সরে গিয়ে নতুন বসে।
    // এটা ঠিক আছে।

    // ফ্ল্যাশ/পালস ইনফিনিট থাকলে অন্যটা সিলেক্ট করলে থেমে যায়।
    
  })();
</script>
</body>
</html>
