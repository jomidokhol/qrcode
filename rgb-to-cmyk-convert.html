<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>One Tool | RGB to CMYK Converter Pro</title>
    
    <!-- External Libraries -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
    
    <style>
        /* --- THEME FROM INDEX.HTML --- */
        :root { --primary: #10b981; --bg: #ffffff; --card: #f8fafc; --text: #0f172a; --border: #e2e8f0; --shadow: rgba(0, 0, 0, 0.1); }
        .dark-mode { --bg: #000000; --card: #111111; --text: #ffffff; --border: #222222; --shadow: rgba(255, 255, 255, 0.1); }
        
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Plus Jakarta Sans', sans-serif; -webkit-tap-highlight-color: transparent; }
        
        body { 
            background-color: var(--bg); color: var(--text); 
            transition: 0.4s; min-height: 100vh; display: flex; 
            flex-direction: column; 
        }

        header { 
            position: sticky; top: 0; z-index: 1000; width: 100%; 
            background: var(--bg); border-bottom: 1px solid var(--border); 
            padding: 15px 20px; box-shadow: 0 2px 4px var(--shadow);
            display: flex; justify-content: center;
        }
        .header-content { 
            width: 100%; max-width: 800px; display: flex; 
            justify-content: space-between; align-items: center; 
        }
        .logo { font-weight: 800; font-size: 1.4rem; color: var(--primary); display: flex; align-items: center; gap: 8px; cursor: pointer; }
        .logo img { height: 50px; }
        .theme-btn { background: var(--border); border: none; width: 40px; height: 40px; border-radius: 12px; cursor: pointer; color: var(--text); transition: 0.3s; display: flex; align-items: center; justify-content: center; }
        
        .main-content { 
            flex-grow: 1; display: flex; justify-content: center; align-items: flex-start; 
            padding: 20px; 
        }
        .container { width: 100%; max-width: 900px; }
        .main-card { background: var(--card); border: 1px solid var(--border); border-radius: 32px; padding: 30px; box-shadow: 0 25px 50px -12px var(--shadow); }

        .upload-box { 
            border: 2px dashed var(--primary); border-radius: 24px; padding: 30px; 
            text-align: center; cursor: pointer; background: rgba(16, 185, 129, 0.05); 
            transition: 0.3s; position: relative; margin-bottom: 20px;
        }
        .upload-box:hover { background: rgba(16, 185, 129, 0.1); }

        .btn { 
            width: 100%; padding: 14px; border-radius: 12px; border: none; 
            font-weight: 700; cursor: pointer; transition: 0.3s; 
            display: flex; align-items: center; justify-content: center; gap: 10px; margin-top: 15px; 
        }
        .btn-primary { background: var(--primary); color: white; }
        .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }
        .btn-outline { background: transparent; border: 1px solid var(--border); color: var(--text); }
        .btn-outline:hover { border-color: var(--primary); }

        /* Settings Grid */
        .settings-section {
            background: var(--bg); border: 1px solid var(--border);
            border-radius: 16px; padding: 20px; margin-bottom: 20px;
        }
        .settings-grid {
            display: grid; grid-template-columns: 1fr 1fr; gap: 15px; 
        }
        @media (max-width: 600px) { .settings-grid { grid-template-columns: 1fr; } }

        label { font-size: 0.8rem; font-weight: 700; margin-bottom: 5px; display: block; opacity: 0.9; }
        
        select, input[type="range"] {
            width: 100%; padding: 10px; border-radius: 10px; border: 1px solid var(--border); 
            background: var(--card); color: var(--text); outline: none; cursor: pointer;
        }

        /* Result Area */
        .result-area { display: none; margin-top: 20px; padding-top: 20px; border-top: 1px solid var(--border); }
        .preview-grid {
            display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 20px;
        }
        @media (max-width: 768px) { .preview-grid { grid-template-columns: 1fr; } }
        
        .canvas-wrapper {
            background: var(--bg); border: 1px solid var(--border); border-radius: 16px;
            overflow: hidden; position: relative; 
            display: flex; justify-content: center; align-items: center;
            /* Responsive height for display, but canvas keeps real pixels */
            aspect-ratio: 16/9; 
        }
        .canvas-label {
            position: absolute; top: 10px; left: 10px;
            background: rgba(0,0,0,0.7); color: white;
            padding: 4px 10px; border-radius: 6px; font-size: 0.75rem; font-weight: 700;
            pointer-events: none; z-index: 5;
        }
        /* Canvas Styling for Responsive Display Only */
        canvas { 
            width: 100%; height: 100%; object-fit: contain; 
        }

        .loading-overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(var(--bg), 0.9); z-index: 100; display: none;
            justify-content: center; align-items: center; flex-direction: column;
            border-radius: 24px; backdrop-filter: blur(4px);
        }
        .spinner {
            width: 40px; height: 40px; border: 4px solid var(--border);
            border-top: 4px solid var(--primary); border-radius: 50%;
            animation: spin 1s linear infinite; margin-bottom: 15px;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        .image-info { font-size: 0.8rem; text-align: center; margin-top: 5px; opacity: 0.7; }
        
        footer { 
            text-align: center; padding: 20px; font-size: 0.8rem; opacity: 0.7; 
            border-top: 1px solid var(--border); margin-top: auto;
        }
    </style>
</head>
<body>

    <header>
        <div class="header-content">
            <div class="logo" onclick="setView('mainOptionsView')">
            <img id="logoImage" src="img/logo.png" alt="Logo">
            </div>
            <button class="theme-btn" id="themeToggle"><i class="fas fa-moon"></i></button>
        </div>
    </header>

    <div class="main-content">
        <div class="container">
            <div class="main-card">
                <h2 style="text-align: center; margin-bottom: 10px;">RGB to CMYK Converter</h2>
                <p style="text-align: center; font-size: 0.9rem; opacity: 0.7; margin-bottom: 25px;">
                    High-Resolution Processing without Quality Loss
                </p>

                <!-- Configuration -->
                <div class="settings-section">
                    <h4 style="margin-bottom: 15px; color: var(--primary);"><i class="fas fa-sliders-h"></i> Conversion Settings</h4>
                    <div class="settings-grid">
                        <div>
                            <label>Color Profile (Simulation)</label>
                            <select id="profileSelect">
                                <option value="coated">US Web Coated (SWOP) v2</option>
                                <option value="fogra39" selected>Coated FOGRA39 (ISO 12647)</option>
                                <option value="japancolor">Japan Color 2001 Coated</option>
                                <option value="uncoated">Uncoated (Matte Paper)</option>
                                <option value="grayscale">Grayscale (K Only)</option>
                            </select>
                        </div>
                        <div>
                            <label>Rendering Intent</label>
                            <select id="intentSelect">
                                <option value="perceptual" selected>Perceptual (Photographic)</option>
                                <option value="relative">Relative Colorimetric</option>
                                <option value="absolute">Absolute Colorimetric</option>
                            </select>
                        </div>
                    </div>
                </div>

                <!-- Upload Area -->
                <div class="upload-box" id="dropZone">
                    <div id="loading" class="loading-overlay">
                        <div class="spinner"></div>
                        <span style="font-weight: 700; font-size: 1rem;" id="loadingText">Processing High-Res Image...</span>
                    </div>

                    <i class="fas fa-cloud-arrow-up" style="font-size: 3rem; color: var(--primary); margin-bottom: 15px;"></i>
                    <h3 id="uploadTitle">Click to Upload Image</h3>
                    <p style="font-size: 0.8rem; opacity: 0.7; margin-top: 5px;">Supports JPG, PNG, WEBP, TIFF (Max 50MB)</p>
                    <input type="file" id="fileInput" hidden accept="image/*">
                </div>

                <!-- Main Action -->
                <button class="btn btn-primary" id="processBtn" disabled>
                    <i class="fas fa-cogs"></i> Convert Image
                </button>

                <!-- Results -->
                <div class="result-area" id="resultArea">
                    <div class="settings-section" style="border-color: var(--primary);">
                        <h4 style="margin-bottom: 15px;"><i class="fas fa-file-export"></i> Export Options</h4>
                        <div class="settings-grid">
                            <div>
                                <label>Output Format</label>
                                <select id="formatSelect">
                                    <option value="image/jpeg" selected>JPEG (High Compatibility)</option>
                                    <option value="image/png">PNG (Lossless)</option>
                                    <option value="image/webp">WEBP (Modern)</option>
                                </select>
                            </div>
                            <div>
                                <label>Quality: <span id="qualityVal">100%</span></label>
                                <input type="range" id="qualityRange" min="10" max="100" value="100">
                            </div>
                        </div>
                    </div>

                    <div class="preview-grid">
                        <div>
                            <div class="canvas-wrapper">
                                <span class="canvas-label">Original (RGB)</span>
                                <canvas id="canvasOriginal"></canvas>
                            </div>
                            <div class="image-info" id="originalInfo"></div>
                        </div>
                        <div>
                            <div class="canvas-wrapper">
                                <span class="canvas-label">CMYK Proof</span>
                                <canvas id="canvasCMYK"></canvas>
                            </div>
                            <div class="image-info" id="cmykInfo"></div>
                        </div>
                    </div>
                    
                    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px;">
                        <button class="btn btn-outline" onclick="location.reload()">
                            <i class="fas fa-redo"></i> New Image
                        </button>
                        <button class="btn btn-primary" id="downloadBtn" style="margin-top: 0;">
                            <i class="fas fa-download"></i> Download High-Res
                        </button>
                    </div>
                </div>

            </div>
        </div>
    </div>

    <footer>
        <p>&copy; 2026 One Tool. Developed for Professional Print Accuracy.</p>
    </footer>

    <script>
        // --- THEME LOGIC ---
        const themeToggle = document.getElementById('themeToggle');
        themeToggle.onclick = () => {
            document.body.classList.toggle('dark-mode');
            const icon = themeToggle.querySelector('i');
            icon.classList.toggle('fa-moon');
            icon.classList.toggle('fa-sun');
        };

        // --- ELEMENTS ---
        const fileInput = document.getElementById('fileInput');
        const dropZone = document.getElementById('dropZone');
        const processBtn = document.getElementById('processBtn');
        const downloadBtn = document.getElementById('downloadBtn');
        const resultArea = document.getElementById('resultArea');
        const loading = document.getElementById('loading');
        
        const canvasOriginal = document.getElementById('canvasOriginal');
        const ctxOriginal = canvasOriginal.getContext('2d'); // Will initialize with alpha: false for standard images
        const canvasCMYK = document.getElementById('canvasCMYK');
        const ctxCMYK = canvasCMYK.getContext('2d');

        const qualityRange = document.getElementById('qualityRange');
        const qualityVal = document.getElementById('qualityVal');
        
        let originalImage = null;
        let fileName = "image";

        // Quality Slider UI
        qualityRange.oninput = (e) => {
            qualityVal.innerText = e.target.value + "%";
        };

        // --- UPLOAD HANDLING ---
        dropZone.onclick = () => fileInput.click();
        dropZone.ondragover = (e) => { e.preventDefault(); dropZone.style.background = 'rgba(16, 185, 129, 0.15)'; };
        dropZone.ondragleave = () => { dropZone.style.background = ''; };
        dropZone.ondrop = (e) => {
            e.preventDefault(); dropZone.style.background = '';
            if(e.dataTransfer.files[0]) handleFile(e.dataTransfer.files[0]);
        };
        fileInput.onchange = (e) => {
            if(e.target.files[0]) handleFile(e.target.files[0]);
        };

        function handleFile(file) {
            fileName = file.name.split('.')[0];
            const reader = new FileReader();
            
            // Show loading initially
            loading.style.display = 'flex';
            document.getElementById('loadingText').innerText = "Reading Image...";

            reader.onload = (event) => {
                originalImage = new Image();
                originalImage.onload = () => {
                    // RESOLUTION FIX: Set canvas size to NATURAL size immediately
                    canvasOriginal.width = originalImage.naturalWidth;
                    canvasOriginal.height = originalImage.naturalHeight;
                    canvasCMYK.width = originalImage.naturalWidth;
                    canvasCMYK.height = originalImage.naturalHeight;

                    // Draw original high-res data
                    ctxOriginal.drawImage(originalImage, 0, 0);
                    
                    // Update UI Info
                    document.getElementById('uploadTitle').innerHTML = `<b>${file.name}</b>`;
                    document.getElementById('originalInfo').innerText = `${originalImage.naturalWidth} x ${originalImage.naturalHeight} px`;
                    
                    processBtn.disabled = false;
                    loading.style.display = 'none';
                    resultArea.style.display = 'none';
                };
                originalImage.src = event.target.result;
            };
            reader.readAsDataURL(file);
        }

        // --- COLOR SCIENCE & ALGORITHMS ---

        function sRGBtoLinear(x) {
            x = x / 255.0;
            return (x <= 0.04045) ? (x / 12.92) : Math.pow((x + 0.055) / 1.055, 2.4);
        }

        function linearTosRGB(x) {
            const val = (x <= 0.0031308) ? (12.92 * x) : (1.055 * Math.pow(x, 1.0 / 2.4) - 0.055);
            return Math.min(255, Math.max(0, Math.round(val * 255)));
        }

        // Advanced RGB to CMYK with Profile Simulation
        function rgbToCmyk(r, g, b, profile) {
            if (profile === 'grayscale') {
                // Luminance conversion
                const k = 1 - (0.299 * r + 0.587 * g + 0.114 * b) / 255;
                return { c: 0, m: 0, y: 0, k: Math.min(1, Math.max(0, k)) };
            }

            const linR = sRGBtoLinear(r);
            const linG = sRGBtoLinear(g);
            const linB = sRGBtoLinear(b);

            let c = 1 - linR;
            let m = 1 - linG;
            let y = 1 - linB;

            // Profile Tuned GCR (Gray Component Replacement)
            let gcr = 0.7; // Standard
            if (profile === 'fogra39') gcr = 0.8;
            if (profile === 'japancolor') gcr = 0.6; // More vibrant
            if (profile === 'uncoated') gcr = 0.5; // Less ink absorption

            let k = Math.min(c, m, y) * gcr;

            // UCR (Under Color Removal)
            c = Math.min(1, Math.max(0, (c - k) / (1 - k + 0.0001))); 
            m = Math.min(1, Math.max(0, (m - k) / (1 - k + 0.0001)));
            y = Math.min(1, Math.max(0, (y - k) / (1 - k + 0.0001)));
            k = Math.min(1, Math.max(0, k));

            return { c, m, y, k };
        }

        // CMYK to RGB Soft Proof (Simulate Print Appearance on Screen)
        function cmykToRgbProof(c, m, y, k, profile, intent) {
            // Profile Specific Impurities (Dot Gain & Paper Color)
            let impurity = 0.05; // Default Coated
            let paperWhite = { r: 1, g: 1, b: 1 };

            if (profile === 'fogra39') impurity = 0.08;
            if (profile === 'japancolor') impurity = 0.06;
            if (profile === 'uncoated') {
                impurity = 0.15; // Dull colors
                paperWhite = { r: 0.96, g: 0.95, b: 0.93 }; // Slightly yellowish paper
            }
            if (profile === 'grayscale') impurity = 0.0;

            // Basic CMYK -> RGB
            let r = (1 - c) * (1 - k);
            let g = (1 - m) * (1 - k);
            let b = (1 - y) * (1 - k);

            // Apply Paper White Simulation (if Absolute Colorimetric)
            if (intent === 'absolute') {
                r *= paperWhite.r;
                g *= paperWhite.g;
                b *= paperWhite.b;
            }

            // Apply Dot Gain / Impurity Simulation
            if (intent !== 'relative') { // Relative maps white to white, so less dulling
                const luma = 0.2126 * r + 0.7152 * g + 0.0722 * b;
                r = r + (luma - r) * impurity;
                g = g + (luma - g) * impurity;
                b = b + (luma - b) * impurity;
            }

            return {
                r: linearTosRGB(r),
                g: linearTosRGB(g),
                b: linearTosRGB(b)
            };
        }

        // --- PROCESSING ENGINE ---
        processBtn.onclick = () => {
            if(!originalImage) return;
            
            loading.style.display = 'flex';
            document.getElementById('loadingText').innerText = "Processing Pixels...";
            
            // Use setTimeout to allow UI render
            setTimeout(() => {
                const w = canvasOriginal.width;
                const h = canvasOriginal.height;
                const profile = document.getElementById('profileSelect').value;
                const intent = document.getElementById('intentSelect').value;

                // Process High-Res Data directly
                const imgData = ctxOriginal.getImageData(0, 0, w, h);
                const data = imgData.data;
                const newImgData = ctxCMYK.createImageData(w, h);
                const newData = newImgData.data;

                // Loop through every pixel
                for(let i = 0; i < data.length; i += 4) {
                    const r = data[i];
                    const g = data[i+1];
                    const b = data[i+2];

                    // 1. RGB -> CMYK (Simulated Data)
                    const cmyk = rgbToCmyk(r, g, b, profile);

                    // 2. CMYK -> RGB Soft Proof (Visual Output)
                    const proof = cmykToRgbProof(cmyk.c, cmyk.m, cmyk.y, cmyk.k, profile, intent);

                    newData[i] = proof.r;
                    newData[i+1] = proof.g;
                    newData[i+2] = proof.b;
                    newData[i+3] = 255; // Alpha 100%
                }

                ctxCMYK.putImageData(newImgData, 0, 0);
                
                // Update Info
                document.getElementById('cmykInfo').innerText = `${w} x ${h} px | ${profile.toUpperCase()}`;
                
                loading.style.display = 'none';
                resultArea.style.display = 'block';
                resultArea.scrollIntoView({behavior: 'smooth'});
            }, 50);
        };

        // --- DOWNLOAD LOGIC ---
        downloadBtn.onclick = () => {
            const format = document.getElementById('formatSelect').value;
            const quality = parseInt(document.getElementById('qualityRange').value) / 100;
            
            // Generate Data URL from High-Res Canvas
            // Canvas inherently exports at the resolution set in .width/.height
            const dataUrl = canvasCMYK.toDataURL(format, quality);
            
            let ext = format.split('/')[1];
            if (ext === 'jpeg') ext = 'jpg';

            const link = document.createElement('a');
            link.download = `${fileName}_cmyk_proof.${ext}`;
            link.href = dataUrl;
            link.click();
        };

    </script>
</body>
</html>
