<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>One Tool - True AI Subtitle Studio</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background: #f8fafc; color: #0f172a; }
        .glass-card { background: #ffffff; border: 1px solid #e2e8f0; border-radius: 16px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); padding: 24px; }
        .skeleton { background: linear-gradient(90deg, #f1f5f9 25%, #e2e8f0 50%, #f1f5f9 75%); background-size: 200% 100%; animation: load 1.5s infinite; }
        @keyframes load { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }
        canvas { width: 100%; height: 60px; background: #0f172a; border-radius: 8px; }
    </style>
</head>
<body class="p-4 md:p-8 max-w-5xl mx-auto">

    <header class="flex items-center justify-between mb-8 pb-4 border-b border-slate-200">
        <div class="flex items-center gap-3">
            <div class="w-10 h-10 bg-emerald-600 text-white rounded-lg flex items-center justify-center text-xl"><i class="fas fa-brain"></i></div>
            <div>
                <h1 class="font-bold text-lg leading-none">One Tool AI Engine</h1>
                <span class="text-xs text-emerald-600 font-semibold">True Speech-to-Text Studio</span>
            </div>
        </div>
    </header>

    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
        <!-- Media Upload & Player -->
        <div class="glass-card space-y-4">
            <h3 class="font-bold text-slate-800 border-b pb-2">1. Upload Media</h3>
            <select id="lang-select" class="w-full p-2 border rounded-lg text-sm mb-2">
                <option value="bn-BD">Language: Bengali (বাংলা)</option>
                <option value="en-US">Language: English (US)</option>
                <option value="hi-IN">Language: Hindi (हिन्दी)</option>
            </select>
            
            <input type="file" id="media-input" accept="audio/*,video/*" class="w-full text-sm file:mr-4 file:py-2 file:px-4 file:rounded-lg file:border-0 file:text-sm file:font-semibold file:bg-emerald-50 file:text-emerald-700 hover:file:bg-emerald-100">
            
            <div id="player-container" class="hidden space-y-2 pt-4">
                <video id="media-player" class="w-full rounded-lg bg-black object-contain max-h-48" controls></video>
                <p class="text-xs text-slate-500 font-semibold mt-2">Live Frequency Analyzer:</p>
                <canvas id="visualizer"></canvas>
                <button onclick="startTrueAnalysis()" class="w-full py-2 bg-emerald-600 hover:bg-emerald-700 text-white rounded-lg text-sm font-bold flex justify-center items-center gap-2">
                    <i class="fas fa-microphone"></i> Start Real-Time AI Extraction
                </button>
            </div>
        </div>

        <!-- Processing & Results -->
        <div class="glass-card space-y-4 relative">
            <h3 class="font-bold text-slate-800 border-b pb-2 flex justify-between">
                <span>2. Generated Subtitles</span>
                <button onclick="toggleRoman()" class="text-xs bg-slate-100 px-2 py-1 rounded text-emerald-700 font-bold border hover:bg-slate-200">
                    <i class="fas fa-language"></i> Toggle Banglish
                </button>
            </h3>

            <!-- Processing Loaders -->
            <div id="processing-ui" class="hidden space-y-4 pt-4">
                <div class="flex justify-between text-xs font-bold text-emerald-600">
                    <span id="status-text">Listening & Transcribing...</span>
                </div>
                <div class="h-2 bg-slate-100 rounded-full overflow-hidden">
                    <div class="h-full bg-emerald-500 w-full animate-pulse"></div>
                </div>
                <div class="space-y-2">
                    <div class="h-8 skeleton rounded w-full"></div>
                    <div class="h-8 skeleton rounded w-3/4"></div>
                </div>
            </div>

            <!-- Real-Time Cues Output -->
            <div id="cues-output" class="space-y-2 max-h-80 overflow-y-auto">
                <p class="text-xs text-slate-400 text-center py-8">No captions generated yet. Play media and start extraction.</p>
            </div>
        </div>
    </div>

    <script>
        const mediaInput = document.getElementById('media-input');
        const mediaPlayer = document.getElementById('media-player');
        const playerContainer = document.getElementById('player-container');
        const visualizer = document.getElementById('visualizer');
        const cuesOutput = document.getElementById('cues-output');
        const processingUI = document.getElementById('processing-ui');
        
        let audioCtx, analyzer, source;
        let speechRecognizer;
        let generatedCues = [];
        let isRomanMode = false;

        // Basic Transliteration Engine (Bengali to English Letters)
        // এই ফাংশনটি স্বর ও ব্যঞ্জনবর্ণ বিশ্লেষণ করে বাংলিশ তৈরি করে
        function transcribeToRoman(text) {
            const charMap = {
                'অ':'o', 'আ':'a', 'ই':'i', 'ঈ':'i', 'উ':'u', 'ঊ':'u', 'এ':'e', 'ঐ':'oi', 'ও':'o', 'ঔ':'ou',
                'ক':'k', 'খ':'kh', 'গ':'g', 'ঘ':'gh', 'ঙ':'ng',
                'চ':'ch', 'ছ':'chh', 'জ':'j', 'ঝ':'jh', 'ঞ':'n',
                'ট':'t', 'ঠ':'th', 'ড':'d', 'ঢ':'dh', 'ণ':'n',
                'ত':'t', 'থ':'th', 'দ':'d', 'ध':'dh', 'ন':'n',
                'প':'p', 'ফ':'f', 'ব':'b', 'ভ':'bh', 'ম':'m',
                'য':'j', 'র':'r', 'ল':'l', 'শ':'sh', 'ষ':'sh', 'স':'s', 'হ':'h',
                'ড়':'r', 'ঢ়':'rh', 'য়':'y',
                'া':'a', 'ি':'i', 'ী':'i', 'ু':'u', 'ূ':'u', 'ৃ':'ri', 'ে':'e', 'ৈ':'oi', 'ো':'o', 'ৌ':'ou',
                'ং':'ng', 'ঃ':'h', 'ঁ':'n', '्':'', '্':''
            };
            
            let romanized = '';
            for(let i=0; i<text.length; i++) {
                romanized += charMap[text[i]] || text[i];
            }
            return romanized;
        }

        mediaInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (!file) return;
            mediaPlayer.src = URL.createObjectURL(file);
            playerContainer.classList.remove('hidden');
            setupAudioAnalyzer();
        });

        function setupAudioAnalyzer() {
            if(!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                analyzer = audioCtx.createAnalyser();
                source = audioCtx.createMediaElementSource(mediaPlayer);
                source.connect(analyzer);
                analyzer.connect(audioCtx.destination);
                analyzer.fftSize = 256;
                drawVisualizer();
            }
        }

        function drawVisualizer() {
            requestAnimationFrame(drawVisualizer);
            if(!analyzer) return;
            const bufferLength = analyzer.frequencyBinCount;
            const dataArray = new Uint8Array(bufferLength);
            analyzer.getByteFrequencyData(dataArray);

            const canvasCtx = visualizer.getContext('2d');
            canvasCtx.fillStyle = '#0f172a';
            canvasCtx.fillRect(0, 0, visualizer.width, visualizer.height);

            const barWidth = (visualizer.width / bufferLength) * 2.5;
            let barHeight;
            let x = 0;

            for(let i = 0; i < bufferLength; i++) {
                barHeight = dataArray[i] / 2;
                canvasCtx.fillStyle = `rgb(16, 185, 129)`;
                canvasCtx.fillRect(x, visualizer.height - barHeight, barWidth, barHeight);
                x += barWidth + 1;
            }
        }

        function startTrueAnalysis() {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (!SpeechRecognition) {
                alert("Your browser doesn't support Web Speech API. Please use Google Chrome.");
                return;
            }

            cuesOutput.innerHTML = '';
            generatedCues = [];
            processingUI.classList.remove('hidden');
            
            if(mediaPlayer.paused) mediaPlayer.play();

            speechRecognizer = new SpeechRecognition();
            speechRecognizer.continuous = true;
            speechRecognizer.interimResults = true;
            speechRecognizer.lang = document.getElementById('lang-select').value;

            let currentStartTime = mediaPlayer.currentTime;

            speechRecognizer.onresult = (event) => {
                let finalTranscript = '';
                for (let i = event.resultIndex; i < event.results.length; ++i) {
                    if (event.results[i].isFinal) {
                        finalTranscript += event.results[i][0].transcript;
                        
                        const endTime = mediaPlayer.currentTime;
                        const roman = transcribeToRoman(finalTranscript);
                        
                        generatedCues.push({
                            start: currentStartTime,
                            end: endTime,
                            original: finalTranscript,
                            romanized: roman
                        });

                        currentStartTime = endTime;
                        renderCues();
                    }
                }
            };

            speechRecognizer.onerror = (e) => console.error("Speech API Error:", e.error);
            speechRecognizer.onend = () => {
                processingUI.classList.add('hidden');
                document.getElementById('status-text').innerText = "Analysis Complete!";
            };

            speechRecognizer.start();
        }

        function renderCues() {
            cuesOutput.innerHTML = '';
            generatedCues.forEach((cue, index) => {
                const textToShow = isRomanMode ? cue.romanized : cue.original;
                const div = document.createElement('div');
                div.className = "p-2 bg-slate-50 border rounded-lg text-sm";
                div.innerHTML = `
                    <div class="text-[10px] text-slate-400 font-mono mb-1">
                        ${cue.start.toFixed(1)}s --> ${cue.end.toFixed(1)}s
                    </div>
                    <div class="font-medium text-slate-700">${textToShow}</div>
                `;
                cuesOutput.appendChild(div);
            });
            cuesOutput.scrollTop = cuesOutput.scrollHeight;
        }

        function toggleRoman() {
            isRomanMode = !isRomanMode;
            renderCues();
        }
    </script>
</body>
</html>
