<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AURA.DSP | Slowed + Reverb + Visuals</title>
    <!-- MP3 Encoder Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/lamejs/1.2.1/lame.min.js"></script>
    <style>
        :root {
            --bg-dark: #050505;
            --bg-panel: rgba(20, 20, 25, 0.6);
            --primary: #7000ff;
            --secondary: #00d2ff;
            --text-main: #ffffff;
            --text-muted: #888888;
            --glass-border: rgba(255, 255, 255, 0.08);
            --neon-glow: 0 0 20px rgba(112, 0, 255, 0.4);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', system-ui, -apple-system, sans-serif; }

        body {
            background-color: var(--bg-dark);
            background-image: 
                radial-gradient(circle at 10% 20%, rgba(112, 0, 255, 0.15) 0%, transparent 40%),
                radial-gradient(circle at 90% 80%, rgba(0, 210, 255, 0.1) 0%, transparent 40%);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        /* --- Loader --- */
        #loader {
            position: fixed; inset: 0; background: #000; z-index: 999;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            transition: opacity 0.4s;
        }
        .loader-ring {
            width: 50px; height: 50px; border: 3px solid rgba(255,255,255,0.1);
            border-top: 3px solid var(--secondary); border-radius: 50%;
            animation: spin 1s linear infinite; margin-bottom: 20px;
        }
        @keyframes spin { 100% { transform: rotate(360deg); } }

        /* --- Upload Modal (Popup) --- */
        #uploadModal {
            position: fixed; inset: 0; background: rgba(0,0,0,0.8); z-index: 800;
            backdrop-filter: blur(10px);
            display: flex; align-items: center; justify-content: center;
        }
        .modal-content {
            background: #111; border: 1px solid var(--glass-border);
            padding: 40px; border-radius: 20px; text-align: center;
            box-shadow: 0 0 50px rgba(112, 0, 255, 0.2);
            max-width: 400px; width: 90%;
            display: flex; flex-direction: column; align-items: center;
        }
        /* Icon Button for Modal */
        .upload-big-btn {
            background: linear-gradient(135deg, var(--primary), #4a00e0);
            color: white; border: none; 
            width: 80px; height: 80px; 
            border-radius: 50%; 
            display: flex; align-items: center; justify-content: center;
            cursor: pointer; margin-top: 40px; 
            box-shadow: var(--neon-glow); transition: 0.3s;
        }
        .upload-big-btn svg { width: 32px; height: 32px; fill: white; }
        .upload-big-btn:hover { transform: scale(1.1); box-shadow: 0 0 30px var(--primary); }

        /* --- Layout --- */
        .app-shell {
            width: 100%; max-width: 900px;
            display: grid; grid-template-columns: 1fr; gap: 20px;
        }

        /* --- Top Section: Banner & Visualizer --- */
        .stage-area {
            background: var(--bg-panel);
            backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            padding: 30px;
            display: flex; flex-direction: column; align-items: center;
            position: relative; overflow: hidden;
            box-shadow: 0 20px 40px rgba(0,0,0,0.4);
        }

        /* New Project Icon Button */
        .new-btn {
            position: absolute; top: 20px; right: 20px;
            background: rgba(255,255,255,0.1); border: 1px solid var(--glass-border);
            color: white; 
            width: 40px; height: 40px; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            cursor: pointer; transition: 0.3s; z-index: 10;
        }
        .new-btn svg { width: 20px; height: 20px; fill: white; }
        .new-btn:hover { background: var(--secondary); transform: rotate(90deg); }
        .new-btn:hover svg { fill: black; }

        /* Song Input Style */
        .song-meta {
            text-align: center; margin-bottom: 20px; width: 100%; z-index: 5;
        }
        .song-input {
            background: transparent; border: none; border-bottom: 1px solid rgba(255,255,255,0.2);
            color: var(--text-main); font-size: 1.2rem; text-align: center; width: 60%;
            padding: 5px; margin-bottom: 5px; outline: none; transition: 0.3s;
        }
        .song-input:focus { border-color: var(--secondary); width: 80%; }
        .banner-hint { font-size: 0.75rem; color: var(--text-muted); cursor: pointer; text-decoration: underline; }

        /* Visualizer Canvas */
        canvas {
            width: 100%; height: 350px; 
            border-radius: 12px;
            margin-bottom: 20px;
        }

        /* --- Player Controls (Icons) --- */
        .player-controls {
            display: flex; gap: 30px; align-items: center; justify-content: center;
            margin-bottom: 10px; opacity: 0.5; pointer-events: none; transition: 0.3s; z-index: 5;
        }
        .player-controls.active { opacity: 1; pointer-events: all; }

        .icon-btn {
            background: rgba(255,255,255,0.05); border: none;
            width: 50px; height: 50px; border-radius: 50%;
            color: var(--text-main); cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            transition: 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .icon-btn:hover { background: rgba(255,255,255,0.15); transform: scale(1.1); color: var(--secondary); }
        .icon-btn svg { width: 22px; height: 22px; fill: currentColor; }
        
        .icon-btn.big {
            width: 70px; height: 70px;
            background: linear-gradient(135deg, var(--primary), #4a00e0);
            box-shadow: var(--neon-glow);
        }
        .icon-btn.big:hover { transform: scale(1.05); box-shadow: 0 0 30px rgba(112, 0, 255, 0.6); }

        /* Progress Bar */
        .progress-container { width: 100%; margin-top: 10px; z-index: 5; position: relative; }
        .time-display { display: flex; justify-content: space-between; font-size: 0.75rem; color: var(--text-muted); margin-top: 8px; }

        /* --- Settings Panel --- */
        .settings-panel {
            background: var(--bg-panel);
            backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            padding: 30px;
        }

        .upload-section {
            display: none; 
        }
        
        /* Sliders Grid */
        .controls-grid {
            display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 25px;
        }

        .control-item h4 {
            font-size: 0.85rem; font-weight: 500; color: var(--text-muted); margin-bottom: 10px;
            display: flex; justify-content: space-between;
        }
        .control-item h4 span { color: var(--secondary); }

        /* Custom Range Slider */
        input[type=range] {
            -webkit-appearance: none; width: 100%; background: transparent;
        }
        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none; height: 14px; width: 14px; border-radius: 50%;
            background: #fff; cursor: pointer; margin-top: -5px; box-shadow: 0 0 10px rgba(255,255,255,0.5);
        }
        input[type=range]::-webkit-slider-runnable-track {
            width: 100%; height: 4px; cursor: pointer; background: rgba(255,255,255,0.1); border-radius: 2px;
        }

        /* Checkbox */
        .toggle-row { display: flex; align-items: center; gap: 10px; font-size: 0.9rem; color: var(--text-muted); cursor: pointer; }
        .toggle-box {
            width: 18px; height: 18px; border: 2px solid var(--glass-border); border-radius: 4px;
            display: flex; align-items: center; justify-content: center; transition: 0.2s;
        }
        input[type="checkbox"]:checked + .toggle-box { background: var(--secondary); border-color: var(--secondary); }
        input[type="checkbox"]:checked + .toggle-box::after { content: ''; width: 8px; height: 8px; background: #000; clip-path: polygon(14% 44%, 0 65%, 50% 100%, 100% 16%, 80% 0%, 43% 62%); }

        .hidden { display: none !important; }

    </style>
</head>

    <script>
        // --- 1. FIXED: Advanced Pitch Shifter (Rotating Crossfade / Delay Line) ---
        // eliminates cuts and latency artifacts by using a windowed dual-tap delay
        class PitchShifter {
            constructor(context) {
                this.context = context;
                this.pitchRatio = 1.0;
                this.bufferSize = 4096; // Large buffer for safety
                this.fadeLength = 0.05; // 50ms overlap
            }

            setPitch(semitones) {
                // Determine pitch ratio. 
                this.pitchRatio = Math.pow(2, semitones / 12);
            }

            createNode() {
                const scriptNode = this.context.createScriptProcessor(this.bufferSize, 2, 2);
                
                const delayTime = 0.200; // 200ms buffer
                const delaySamples = Math.floor(delayTime * this.context.sampleRate);
                const bufferL = new Float32Array(delaySamples);
                const bufferR = new Float32Array(delaySamples);
                
                let writePos = 0;
                let phase = 0; // Phasor 0.0 to 1.0
                
                // Optimized grain window
                const windowSize = delaySamples / 2; 

                scriptNode.onaudioprocess = (e) => {
                    const inputL = e.inputBuffer.getChannelData(0);
                    const inputR = e.inputBuffer.getChannelData(1);
                    const outputL = e.outputBuffer.getChannelData(0);
                    const outputR = e.outputBuffer.getChannelData(1);
                    
                    for (let i = 0; i < inputL.length; i++) {
                        // 1. Write to Ring Buffer
                        bufferL[writePos] = inputL[i];
                        bufferR[writePos] = inputR[i];

                        // 2. Calculate Pitch Phase
                        // Relative speed difference (1.0 = normal, 0.5 = half speed)
                        // If pitchRatio is 1, phase increment is 0.
                        const phaseStep = (1.0 - this.pitchRatio) / windowSize;
                        phase = (phase + phaseStep);
                        if(phase >= 1.0) phase -= 1.0;
                        if(phase < 0.0) phase += 1.0;

                        // 3. Dual Tap Calculation (Overlap-Add)
                        // Tap A follows phase
                        // Tap B follows phase + 0.5 (180 deg out of phase)
                        let offsetA = phase * windowSize;
                        let offsetB = ((phase + 0.5) % 1.0) * windowSize;

                        let readPosA = (writePos - offsetA + delaySamples) % delaySamples;
                        let readPosB = (writePos - offsetB + delaySamples) % delaySamples;

                        // Linear Interpolation for Tap A
                        let idxA = Math.floor(readPosA);
                        let fracA = readPosA - idxA;
                        let nextA = (idxA + 1) % delaySamples;
                        let valLA = bufferL[idxA] * (1-fracA) + bufferL[nextA] * fracA;
                        let valRA = bufferR[idxA] * (1-fracA) + bufferR[nextA] * fracA;

                        // Linear Interpolation for Tap B
                        let idxB = Math.floor(readPosB);
                        let fracB = readPosB - idxB;
                        let nextB = (idxB + 1) % delaySamples;
                        let valLB = bufferL[idxB] * (1-fracB) + bufferL[nextB] * fracB;
                        let valRB = bufferR[idxB] * (1-fracB) + bufferR[nextB] * fracB;

                        // 4. Triangle Window (Crossfade)
                        // Gain is 1 when phase is 0.5, 0 when phase is 0 or 1
                        let gainA = 0.5 * (1.0 - Math.cos(2 * Math.PI * phase)); 
                        // Simplified triangle/cosine window for smoother overlap
                        
                        // Inverse for B? No, B is offset by 0.5, so we use same function on (phase+0.5)
                        let gainB = 0.5 * (1.0 - Math.cos(2 * Math.PI * ((phase + 0.5)%1.0)));

                        // Combine
                        outputL[i] = (valLA * gainA) + (valLB * gainB);
                        outputR[i] = (valRA * gainA) + (valRB * gainB);

                        writePos = (writePos + 1) % delaySamples;
                    }
                };
                return scriptNode;
            }
        }

        // --- Variables ---
        let audioContext;
        let sourceNode;
        let originalBuffer = null;
        let isPlaying = false;
        let startTime = 0;
        let pausedAt = 0;
        let animationId;
        let pitchShifterInstance = null;
        // removed global loaderInterval

        // Nodes
        let gainNode, bassNode, dryNode, wetNode, pannerNode, distortionNode, masterGain, pitchNode;

        // UI Refs
        const loader = document.getElementById('loader');
        const loaderText = document.getElementById('loaderText');
        const uploadModal = document.getElementById('uploadModal');
        const playBtn = document.getElementById('playBtn');
        const playIcon = document.getElementById('playIcon');
        const pauseIcon = document.getElementById('pauseIcon');
        const playerControls = document.getElementById('playerControls');
        const visualizerCanvas = document.getElementById('visualizer');
        const canvasCtx = visualizerCanvas.getContext('2d');
        const bannerInput = document.getElementById('bannerInput');
        const bannerImg = document.getElementById('bannerImg');
        const songNameInput = document.getElementById('songName');

        // Inputs
        const inputs = {
            speed: document.getElementById('speed'),
            pitch: document.getElementById('pitch'),
            reverb: document.getElementById('reverb'),
            bass: document.getElementById('bass'),
            spatial: document.getElementById('spatial'),
            lofi: document.getElementById('lofi'),
            reverse: document.getElementById('reverse'),
            progress: document.getElementById('progressBar')
        };

        const displays = {
            speed: document.getElementById('val-speed'),
            pitch: document.getElementById('val-pitch'),
            reverb: document.getElementById('val-reverb'),
            bass: document.getElementById('val-bass'),
            spatial: document.getElementById('val-3d'),
            lofi: document.getElementById('val-lofi')
        };

        // --- Init ---
        window.addEventListener('load', () => {
            resizeCanvas();
            window.addEventListener('resize', resizeCanvas);
            document.body.addEventListener('click', initAudio, { once: true });
        });

        function initAudio() {
            if (!audioContext) audioContext = new (window.AudioContext || window.webkitAudioContext)();
        }

        function resizeCanvas() {
            visualizerCanvas.width = visualizerCanvas.offsetWidth;
            visualizerCanvas.height = visualizerCanvas.offsetHeight;
        }

        // --- 1. New Project & Modal Logic ---
        document.getElementById('newProjectBtn').addEventListener('click', () => {
            stopAudio(true);
            uploadModal.style.display = 'flex';
        });

        document.getElementById('modalAudioInput').addEventListener('change', (e) => {
            handleFileSelect(e);
            uploadModal.style.display = 'none'; 
        });

        bannerInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = (evt) => { bannerImg.src = evt.target.result; };
                reader.readAsDataURL(file);
            }
        });

        document.getElementById('audioInput').addEventListener('change', handleFileSelect);

        async function handleFileSelect(e) {
            if(!e.target.files[0]) return;
            const file = e.target.files[0];
            initAudio();
            toggleLoader(true, "ANALYZING FILE...");

            if(songNameInput.value === "") {
                songNameInput.value = file.name.replace(/\.[^/.]+$/, "");
            }

            const sizeMB = (file.size / (1024 * 1024)).toFixed(2);
            document.getElementById('fileInfo').innerHTML = `<strong>${file.name}</strong> (${sizeMB} MB)`;

            try {
                const arrayBuffer = await file.arrayBuffer();
                originalBuffer = await audioContext.decodeAudioData(arrayBuffer);
                resetPlayer();
                playerControls.classList.add('active'); 
            } catch (err) {
                alert("Error decoding audio.");
            }
            toggleLoader(false);
        }

        // --- Core Audio Logic ---

        function buildImpulse(duration, decay) {
            const length = audioContext.sampleRate * duration;
            const impulse = audioContext.createBuffer(2, length, audioContext.sampleRate);
            const L = impulse.getChannelData(0), R = impulse.getChannelData(1);
            for (let i = 0; i < length; i++) {
                const n = i < length ? Math.pow(1 - i / length, decay) : 0;
                L[i] = (Math.random() * 2 - 1) * n;
                R[i] = (Math.random() * 2 - 1) * n;
            }
            return impulse;
        }

        function makeDistortionCurve(amount) {
            const k = typeof amount === 'number' ? amount : 50;
            const n_samples = 44100;
            const curve = new Float32Array(n_samples);
            for (let i = 0; i < n_samples; ++i) {
                let x = i * 2 / n_samples - 1;
                curve[i] = (3 + k) * x * 20 * (Math.PI / 180) / (Math.PI + k * Math.abs(x));
            }
            return curve;
        }

        function playAudio() {
            if (!originalBuffer) return;
            if (isPlaying) stopAudio();

            let bufferToPlay = originalBuffer;
            if (inputs.reverse.checked) {
                bufferToPlay = cloneAudioBuffer(originalBuffer);
                for (let i = 0; i < 2; i++) Array.prototype.reverse.call(bufferToPlay.getChannelData(i));
            }

            sourceNode = audioContext.createBufferSource();
            sourceNode.buffer = bufferToPlay;
            sourceNode.playbackRate.value = parseFloat(inputs.speed.value);

            pitchShifterInstance = new PitchShifter(audioContext);
            pitchShifterInstance.setPitch(parseInt(inputs.pitch.value));
            pitchNode = pitchShifterInstance.createNode();

            bassNode = audioContext.createBiquadFilter();
            bassNode.type = 'lowshelf';
            bassNode.frequency.value = 200;
            bassNode.gain.value = parseFloat(inputs.bass.value);

            const conv = audioContext.createConvolver();
            conv.buffer = buildImpulse(3, 2);

            dryNode = audioContext.createGain();
            wetNode = audioContext.createGain();
            const rVal = parseFloat(inputs.reverb.value);
            dryNode.gain.value = 1 - (rVal * 0.4);
            wetNode.gain.value = rVal;

            distortionNode = audioContext.createWaveShaper();
            distortionNode.curve = makeDistortionCurve(parseFloat(inputs.lofi.value));
            distortionNode.oversample = '4x';

            pannerNode = audioContext.createStereoPanner();
            pannerNode.pan.value = 0; 

            masterGain = audioContext.createGain();
            const analyser = audioContext.createAnalyser();
            analyser.fftSize = 256; 

            sourceNode.connect(pitchNode);
            pitchNode.connect(distortionNode);
            distortionNode.connect(bassNode);
            bassNode.connect(dryNode);
            bassNode.connect(conv);
            conv.connect(wetNode);
            dryNode.connect(pannerNode);
            wetNode.connect(pannerNode);
            pannerNode.connect(masterGain);
            masterGain.connect(analyser);
            masterGain.connect(audioContext.destination);

            const offset = pausedAt;
            sourceNode.start(0, offset);
            startTime = audioContext.currentTime - (offset / parseFloat(inputs.speed.value));

            isPlaying = true;
            updatePlayIcon(true);
            visualize(analyser);
            updateProgress();

            sourceNode.onended = () => {
                if(isPlaying && inputs.progress.value >= 100) stopAudio(true);
            };
        }

        function stopAudio(reset = false) {
            if (sourceNode) {
                try { sourceNode.stop(); } catch(e){}
                sourceNode.disconnect();
                if(pitchNode) { pitchNode.disconnect(); pitchNode = null; }
            }
            isPlaying = false;
            updatePlayIcon(false);
            cancelAnimationFrame(animationId);
            
            if (reset) {
                pausedAt = 0;
                inputs.progress.value = 0;
            } else {
                pausedAt = (audioContext.currentTime - startTime) * parseFloat(inputs.speed.value);
            }
        }

        function updatePlayIcon(playing) {
            if(playing) {
                playIcon.classList.add('hidden');
                pauseIcon.classList.remove('hidden');
            } else {
                playIcon.classList.remove('hidden');
                pauseIcon.classList.add('hidden');
            }
        }

        function cloneAudioBuffer(from) {
            const other = audioContext.createBuffer(from.numberOfChannels, from.length, from.sampleRate);
            for (let i = 0; i < from.numberOfChannels; i++) other.copyToChannel(from.getChannelData(i), i);
            return other;
        }

        inputs.speed.addEventListener('input', e => {
            displays.speed.innerText = Math.round(e.target.value * 100) + "%";
            if(isPlaying && sourceNode) sourceNode.playbackRate.setValueAtTime(e.target.value, audioContext.currentTime);
        });

        inputs.pitch.addEventListener('input', e => {
            const val = parseInt(e.target.value);
            displays.pitch.innerText = val > 0 ? `+${val}` : val;
            if(isPlaying && pitchShifterInstance) {
                pitchShifterInstance.setPitch(val);
            }
        });

        inputs.reverb.addEventListener('input', e => {
            displays.reverb.innerText = Math.round(e.target.value * 100) + "%";
            if(wetNode) {
                wetNode.gain.setTargetAtTime(parseFloat(e.target.value), audioContext.currentTime, 0.1);
                dryNode.gain.setTargetAtTime(1 - (parseFloat(e.target.value)*0.4), audioContext.currentTime, 0.1);
            }
        });

        inputs.bass.addEventListener('input', e => displays.bass.innerText = e.target.value + "dB");
        inputs.lofi.addEventListener('input', e => displays.lofi.innerText = e.target.value + "%");
        inputs.spatial.addEventListener('input', e => displays.spatial.innerText = Math.round(e.target.value * 100) + "%");
        
        inputs.reverse.addEventListener('change', async () => { 
            if(isPlaying) {
                stopAudio();
                toggleLoader(true, "REVERSING AUDIO..."); 
                await new Promise(r => setTimeout(r, 800)); 
                playAudio();
                toggleLoader(false);
            }
        });

        playBtn.addEventListener('click', () => {
            if(!originalBuffer) return;
            isPlaying ? stopAudio() : playAudio();
        });

        document.getElementById('resetBtn').addEventListener('click', () => {
            inputs.speed.value = 0.85; displays.speed.innerText = "85%";
            inputs.pitch.value = -2; displays.pitch.innerText = "-2";
            inputs.reverb.value = 0.4; displays.reverb.innerText = "40%";
            inputs.bass.value = 5; displays.bass.innerText = "5dB";
            inputs.lofi.value = 0; displays.lofi.innerText = "0%";
            inputs.spatial.value = 0; displays.spatial.innerText = "0%";
            inputs.reverse.checked = false;
            if(isPlaying) { stopAudio(); playAudio(); }
        });

        inputs.progress.addEventListener('input', (e) => {
            if(!originalBuffer) return;
            pausedAt = (e.target.value / 100) * originalBuffer.duration;
            if(isPlaying) { stopAudio(); playAudio(); } else formatTime(pausedAt);
        });

        function resetPlayer() {
            stopAudio(true);
            document.getElementById('totalTime').innerText = formatSeconds(originalBuffer.duration);
        }

        function updateProgress() {
            if(!isPlaying) return;
            const speed = parseFloat(inputs.speed.value);
            const elapsed = (audioContext.currentTime - startTime) * speed;
            inputs.progress.value = (elapsed / originalBuffer.duration) * 100;
            formatTime(elapsed);
            if(inputs.progress.value < 100) animationId = requestAnimationFrame(updateProgress);
        }

        function formatTime(s) {
            document.getElementById('currentTime').innerText = formatSeconds(s);
        }
        function formatSeconds(s) {
            const m = Math.floor(s / 60);
            const sec = Math.floor(s % 60);
            return `${m}:${sec < 10 ? '0'+sec : sec}`;
        }

        // --- 2. Visualizer (Line Wave at Bottom) ---
        function visualize(analyser) {
            const bufferLength = analyser.frequencyBinCount;
            const dataArray = new Uint8Array(bufferLength);

            const draw = () => {
                if(!isPlaying) return;
                requestAnimationFrame(draw);
                analyser.getByteFrequencyData(dataArray);

                const width = visualizerCanvas.width;
                const height = visualizerCanvas.height;
                
                canvasCtx.clearRect(0, 0, width, height);

                // Draw Banner Image in Center (Static Rectangle)
                if (bannerImg && bannerImg.src) {
                    const imgSize = 200;
                    const x = (width - imgSize) / 2;
                    const y = (height - imgSize) / 2 - 20;
                    
                    canvasCtx.save();
                    canvasCtx.shadowBlur = 20;
                    canvasCtx.shadowColor = "rgba(0,0,0,0.5)";
                    
                    canvasCtx.beginPath();
                    canvasCtx.roundRect(x, y, imgSize, imgSize, 10);
                    canvasCtx.clip();
                    
                    canvasCtx.drawImage(bannerImg, x, y, imgSize, imgSize);
                    canvasCtx.restore();
                }

                // Draw Waveform Line at Bottom
                canvasCtx.lineWidth = 3;
                canvasCtx.strokeStyle = 'rgba(0, 210, 255, 0.8)';
                canvasCtx.shadowBlur = 10;
                canvasCtx.shadowColor = 'var(--secondary)';
                
                canvasCtx.beginPath();

                const sliceWidth = width * 1.0 / bufferLength;
                let x = 0;
                
                canvasCtx.moveTo(0, height);

                for(let i = 0; i < bufferLength; i++) {
                    const v = dataArray[i] / 255.0; 
                    const y = height - (v * 80); 
                    if(i === 0) {
                        canvasCtx.moveTo(x, y);
                    } else {
                        canvasCtx.lineTo(x, y);
                    }
                    x += sliceWidth;
                }

                canvasCtx.lineTo(width, height);
                canvasCtx.stroke();
            };
            draw();
        }

        // --- 3. FIXED: Download Logic with Real-time Status ---
        document.getElementById('downloadBtn').addEventListener('click', async () => {
            if(!originalBuffer) return;
            
            // 2. Status: Preparing
            toggleLoader(true, "PREPARING AUDIO..."); 
            await new Promise(r => setTimeout(r, 50));

            let renderBuffer = originalBuffer;
            if(inputs.reverse.checked) {
                renderBuffer = cloneAudioBuffer(originalBuffer);
                for (let i=0; i<renderBuffer.numberOfChannels; i++) Array.prototype.reverse.call(renderBuffer.getChannelData(i));
            }

            const speed = parseFloat(inputs.speed.value);
            const offlineCtx = new OfflineAudioContext(2, (renderBuffer.length/speed) + (3*44100), renderBuffer.sampleRate);
            
            const source = offlineCtx.createBufferSource();
            source.buffer = renderBuffer;
            source.playbackRate.value = speed;
            
            const shifter = new PitchShifter(offlineCtx);
            shifter.setPitch(parseInt(inputs.pitch.value));
            const pNode = shifter.createNode();

            const bass = offlineCtx.createBiquadFilter();
            bass.type = 'lowshelf';
            bass.frequency.value = 200;
            bass.gain.value = parseFloat(inputs.bass.value);

            const conv = offlineCtx.createConvolver();
            const impLen = offlineCtx.sampleRate * 3;
            const impBuf = offlineCtx.createBuffer(2, impLen, offlineCtx.sampleRate);
            for(let c=0; c<2; c++){
                const ch = impBuf.getChannelData(c);
                for(let i=0; i<impLen; i++) ch[i] = (Math.random()*2-1)*Math.pow(1-i/impLen,2);
            }
            conv.buffer = impBuf;

            const dry = offlineCtx.createGain();
            const wet = offlineCtx.createGain();
            const rVal = parseFloat(inputs.reverb.value);
            dry.gain.value = 1 - (rVal * 0.4);
            wet.gain.value = rVal;

            const dist = offlineCtx.createWaveShaper();
            dist.curve = makeDistortionCurve(parseFloat(inputs.lofi.value));

            source.connect(pNode);
            pNode.connect(dist);
            dist.connect(bass);
            bass.connect(dry);
            bass.connect(conv);
            conv.connect(wet);
            dry.connect(offlineCtx.destination);
            wet.connect(offlineCtx.destination);

            source.start(0);

            try {
                // 2. Status: Rendering
                toggleLoader(true, "RENDERING EFFECTS...");
                const rendered = await offlineCtx.startRendering();
                
                // 2. Status: Encoding
                toggleLoader(true, "ENCODING MP3...");
                // Allow UI to repaint
                await new Promise(r => setTimeout(r, 50));
                
                const mp3Data = await encodeMP3Async(rendered.getChannelData(0), rendered.getChannelData(1), rendered.sampleRate);
                
                // 2. Status: Finalizing
                toggleLoader(true, "FINALIZING...");
                
                const blob = new Blob(mp3Data, { type: 'audio/mp3' });
                const url = URL.createObjectURL(blob);
                
                const a = document.createElement('a');
                a.href = url;
                const name = songNameInput.value || "AURA_REMIX";
                a.download = `${name}_slowed-reverb_onetool.mp3`;
                a.click();
            } catch(e) { 
                console.error(e);
                alert("Render Failed: " + e.message); 
            }
            toggleLoader(false);
        });

        // Async Encoding to allow UI updates (prevents freeze)
        async function encodeMP3Async(left, right, sampleRate) {
            const channels = 2;
            const kbps = 192;
            const mp3encoder = new lamejs.Mp3Encoder(channels, sampleRate, kbps);
            const mp3Data = [];
            
            const sampleBlockSize = 1152;
            const samplesL = new Int16Array(left.length);
            const samplesR = new Int16Array(right.length);
            
            // Normalize
            for (let i = 0; i < left.length; i++) {
                samplesL[i] = Math.max(-1, Math.min(1, left[i])) * 32767;
                samplesR[i] = Math.max(-1, Math.min(1, right[i])) * 32767;
            }

            // Encode in chunks to keep UI alive
            for (let i = 0; i < samplesL.length; i += sampleBlockSize) {
                const chunkL = samplesL.subarray(i, i + sampleBlockSize);
                const chunkR = samplesR.subarray(i, i + sampleBlockSize);
                const mp3buf = mp3encoder.encodeBuffer(chunkL, chunkR);
                if (mp3buf.length > 0) mp3Data.push(mp3buf);
                
                // Yield to main thread every ~500 blocks to update text/animation
                if(i % (sampleBlockSize * 500) === 0) {
                     await new Promise(r => setTimeout(r, 0));
                }
            }
            
            const mp3buf = mp3encoder.flush();
            if (mp3buf.length > 0) mp3Data.push(mp3buf);
            return mp3Data;
        }

        // 2. FIXED: Loader only shows actual text, no randomization
        function toggleLoader(show, text) {
            if(show) { 
                loader.classList.remove('hidden'); 
                if(text) loaderText.innerText = text;
            } else { 
                loader.classList.add('hidden'); 
            }
        }
    </script>
